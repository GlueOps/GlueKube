name: Molecule Tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Molecule scenario to run (leave empty for all)'
        required: false
        type: choice
        options:
          - 'all'
          - 'test-cluster'
          - 'rotate-master-nodes'
          - 'scale-cluster'
        default: 'all'

env:
  ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles

# Every scenario reuses fixed resource identities and PATCHes the same AUTOGLUE_RECORD_ID, and
# both providers' create steps are idempotent on that identity -- so two concurrent runs adopt and
# then destroy each other's VMs. On scale-cluster and rotate-master-nodes that identity is the
# Hetzner names (test-molecule-network, my-firewall, master-node-N, worker-node-N); on test-cluster
# it is the Proxmox vmid range starting at PROXMOX_VMID_BASE. Queue them instead (#461).
#
# cancel-in-progress must stay false: cancelling a molecule run mid-flight skips `destroy` and
# leaks six VMs.
concurrency:
  group: molecule-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint and syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: yamllint
        run: yamllint ansible/

      # Runs from the repo root on purpose: ansible-lint resolves .ansible-lint-ignore against
      # the project root it detects (the git root), so running from ansible/ silently ignores
      # the whole baseline file.
      - name: ansible-lint
        run: ansible-lint ansible/playbooks ansible/roles

      # -i localhost, rather than the real inventory: ansible's YAML inventory plugin skips
      # files not named *.yaml/*.yml, and a fresh checkout has no inventory/hosts.yaml anyway.
      - name: Syntax check every playbook
        run: |
          for p in ansible/playbooks/*.yaml; do
            echo "== $p"
            ansible-playbook -i localhost, --syntax-check "$p"
          done

  molecule:
    name: Molecule Tests
    # Molecule builds six VMs -- Proxmox for test-cluster, Hetzner for the other two -- and needs
    # the PROXMOX_* / HCLOUD_TOKEN credentials plus the AutoGlue secrets, which GitHub does not
    # expose to pull requests from forks. PRs get the lint job only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      - name: Setup Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          args: "--exit-node=${{ secrets.TAILSCALE_EXIT_NODE }}  --accept-dns=false"
          tags: tag:github-actions
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install molecule molecule-plugins[docker] ansible-core ansible-lint yamllint
          pip install docker
          # netaddr backs the ansible.utils ipaddr/network_in_network filters that
          # playbooks/preflight.yaml uses for the pod/service CIDR overlap check.
          # proxmoxer + requests back the community.proxmox modules that
          # molecule/test-cluster's create.yml and destroy.yml use.
          pip install jmespath python-dateutil netaddr proxmoxer requests

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Set up environment variables
        env:
          KUBERNETES_VERSION: 'v1.34.5'
          KUBERNETES_PACKAGE_VERSION: '1.34.5-1.1'
          LOADBALANCER_APISERVER: 'ctrp.gluekube.qa-glueops.com'
          DOMAIN_NAME: 'gluekube.qa-glueops.com'
          CALICO_CHART_VERSION: 'v3.31.4'
          CALICO_TIGERA_OPERATOR_VERSION: 'v1.40.7'
          CERTIFICATE_KEY: ${{ secrets.CERTIFICATE_KEY || '' }}
          RANDOM_TOKEN: ${{ secrets.RANDOM_TOKEN || '' }}
          AUTOGLUE_BASE_URL: https://autoglue.glueopshosted.rocks
          AUTOGLUE_ORG_KEY: ${{ secrets.AUTOGLUE_ORG_KEY || '' }}
          AUTOGLUE_ORG_SECRET: ${{ secrets.AUTOGLUE_ORG_SECRET || '' }}
          AUTOGLUE_ORG_ID: ${{ secrets.AUTOGLUE_ORG_ID || '' }}
          # create.yml creates the DNS domain and the ctrp record, destroy.yml deletes both.
          # Those calls authenticate with the x-org-key/x-org-secret pair above.
          AUTOGLUE_CREDENTIAL_ID: ${{ secrets.AUTOGLUE_CREDENTIAL_ID || '' }}
          AUTOGLUE_ZONE_ID: ${{ secrets.AUTOGLUE_ZONE_ID || '' }}
          AUTOGLUE_CLUSTER_ID: 'empty'
          # scale-cluster and rotate-master-nodes are still on Hetzner.
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN || '' }}
          # test-cluster builds on Proxmox instead. PROXMOX_HOST/USER/TOKEN_ID/TOKEN_SECRET are
          # the names community.proxmox reads from the environment on its own, which is why no
          # module in create.yml passes api_* parameters.
          #
          # The non-secret settings below read `vars` first and fall back to `secrets`: the two
          # are separate namespaces, so a value stored in the wrong one expands to the empty
          # string with no warning and create.yml's assert fires for a name that is plainly set
          # in the UI (#486). Taking both means either place works.
          PROXMOX_HOST: ${{ secrets.PROXMOX_HOST || '' }}
          PROXMOX_USER: ${{ secrets.PROXMOX_USER || 'root@pam' }}
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID || '' }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET || '' }}
          # Read by create.yml's two uri calls; defaults to true, so a PVE host with a
          # self-signed certificate needs this set to false.
          PROXMOX_VALIDATE_CERTS: ${{ vars.PROXMOX_VALIDATE_CERTS || secrets.PROXMOX_VALIDATE_CERTS || 'true' }}
          PROXMOX_NODE: ${{ vars.PROXMOX_NODE || secrets.PROXMOX_NODE || '' }}
          # The cloud image the nodes are built from -- there is no template on this cluster.
          PROXMOX_IMPORT_FROM: ${{ vars.PROXMOX_IMPORT_FROM || secrets.PROXMOX_IMPORT_FROM || 'local:import/noble-server-cloudimg-amd64.qcow2' }}
          PROXMOX_DISK_SIZE: ${{ vars.PROXMOX_DISK_SIZE || secrets.PROXMOX_DISK_SIZE || '40G' }}
          PROXMOX_STORAGE: ${{ vars.PROXMOX_STORAGE || secrets.PROXMOX_STORAGE || 'local' }}
          # Two NICs: net0 on the public bridge for SSH, net1 on the LAN bridge for everything the
          # cluster does. PROXMOX_LAN_CIDR is what create.yml uses to tell the two DHCP leases
          # apart, so an unset value fails the run up front rather than mis-assigning addresses.
          PROXMOX_BRIDGE_PUBLIC: ${{ vars.PROXMOX_BRIDGE_PUBLIC || secrets.PROXMOX_BRIDGE_PUBLIC || 'vmbr_public' }}
          PROXMOX_BRIDGE_LAN: ${{ vars.PROXMOX_BRIDGE_LAN || secrets.PROXMOX_BRIDGE_LAN || 'vmbr_lan' }}
          PROXMOX_LAN_CIDR: ${{ vars.PROXMOX_LAN_CIDR || secrets.PROXMOX_LAN_CIDR || '' }}
          PROXMOX_SNIPPET_STORAGE: ${{ vars.PROXMOX_SNIPPET_STORAGE || secrets.PROXMOX_SNIPPET_STORAGE || 'local' }}
          PROXMOX_VMID_BASE: ${{ vars.PROXMOX_VMID_BASE || secrets.PROXMOX_VMID_BASE || '9000' }}
          PROXMOX_SSH_USER: ${{ vars.PROXMOX_SSH_USER || secrets.PROXMOX_SSH_USER || 'root' }}
        run: |
          echo "kubernetes_version=${KUBERNETES_VERSION}" >> $GITHUB_ENV
          echo "kubernetes_package_version=${KUBERNETES_PACKAGE_VERSION}" >> $GITHUB_ENV
          echo "loadbalancer_apiserver=${LOADBALANCER_APISERVER}" >> $GITHUB_ENV
          # consumed by kubeadm-stacked-config.yaml.j2 (certSANs) and
          # authentication-configuration.yaml.j2 (dex issuer). Without it every scenario dies
          # at "Init kubeadm" with AnsibleUndefinedVariable (#463).
          echo "domain_name=${DOMAIN_NAME}" >> $GITHUB_ENV
          echo "calico_chart_version=${CALICO_CHART_VERSION}" >> $GITHUB_ENV
          echo "calico_tigera_operator_version=${CALICO_TIGERA_OPERATOR_VERSION}" >> $GITHUB_ENV
          echo "CERTIFICATE_KEY=${CERTIFICATE_KEY}" >> $GITHUB_ENV
          echo "RANDOM_TOKEN=${RANDOM_TOKEN}" >> $GITHUB_ENV
          echo "AUTOGLUE_BASE_URL=${AUTOGLUE_BASE_URL}" >> $GITHUB_ENV
          echo "AUTOGLUE_ORG_KEY=${AUTOGLUE_ORG_KEY}" >> $GITHUB_ENV
          echo "AUTOGLUE_ORG_SECRET=${AUTOGLUE_ORG_SECRET}" >> $GITHUB_ENV
          echo "AUTOGLUE_ORG_ID=${AUTOGLUE_ORG_ID}" >> $GITHUB_ENV
          echo "AUTOGLUE_CREDENTIAL_ID=${AUTOGLUE_CREDENTIAL_ID}" >> $GITHUB_ENV
          echo "AUTOGLUE_ZONE_ID=${AUTOGLUE_ZONE_ID}" >> $GITHUB_ENV
          echo "AUTOGLUE_CLUSTER_ID=${AUTOGLUE_CLUSTER_ID}" >> $GITHUB_ENV
          echo "HCLOUD_TOKEN=${HCLOUD_TOKEN}" >> $GITHUB_ENV
          echo "PROXMOX_HOST=${PROXMOX_HOST}" >> $GITHUB_ENV
          echo "PROXMOX_USER=${PROXMOX_USER}" >> $GITHUB_ENV
          echo "PROXMOX_TOKEN_ID=${PROXMOX_TOKEN_ID}" >> $GITHUB_ENV
          echo "PROXMOX_TOKEN_SECRET=${PROXMOX_TOKEN_SECRET}" >> $GITHUB_ENV
          echo "PROXMOX_VALIDATE_CERTS=${PROXMOX_VALIDATE_CERTS}" >> $GITHUB_ENV
          echo "PROXMOX_NODE=${PROXMOX_NODE}" >> $GITHUB_ENV
          echo "PROXMOX_IMPORT_FROM=${PROXMOX_IMPORT_FROM}" >> $GITHUB_ENV
          echo "PROXMOX_DISK_SIZE=${PROXMOX_DISK_SIZE}" >> $GITHUB_ENV
          echo "PROXMOX_STORAGE=${PROXMOX_STORAGE}" >> $GITHUB_ENV
          echo "PROXMOX_BRIDGE_PUBLIC=${PROXMOX_BRIDGE_PUBLIC}" >> $GITHUB_ENV
          echo "PROXMOX_BRIDGE_LAN=${PROXMOX_BRIDGE_LAN}" >> $GITHUB_ENV
          echo "PROXMOX_LAN_CIDR=${PROXMOX_LAN_CIDR}" >> $GITHUB_ENV
          echo "PROXMOX_SNIPPET_STORAGE=${PROXMOX_SNIPPET_STORAGE}" >> $GITHUB_ENV
          echo "PROXMOX_VMID_BASE=${PROXMOX_VMID_BASE}" >> $GITHUB_ENV
          echo "PROXMOX_SSH_USER=${PROXMOX_SSH_USER}" >> $GITHUB_ENV

      - name: Create /opt/gluekube directory and download Kubernetes release key
        run: |
          sudo mkdir -p /opt/gluekube
          K8S_MINOR=$(echo $kubernetes_version | cut -d. -f1,2)
          sudo curl -fsSL "https://pkgs.k8s.io/core:/stable:/${K8S_MINOR}/deb/Release.key" -o /opt/gluekube/kubernetes-release.key

      

      - name: Run Molecule Test - scale-cluster
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.scenario == 'all' || github.event.inputs.scenario == 'scale-cluster'
        working-directory: ansible
        run: |
          mkdir -p molecule/scale-cluster/keys/
          ssh-keygen -t rsa -b 4096 -f molecule/scale-cluster/keys/vm_node -N "" -C "molecule-test-key"
          chmod 600 molecule/scale-cluster/keys/vm_node
          molecule test -s scale-cluster
      
      - name: Run Molecule Test - rotate-master-nodes
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.scenario == 'all' || github.event.inputs.scenario == 'rotate-master-nodes'
        working-directory: ansible
        run: |
          mkdir -p molecule/rotate-master-nodes/keys/
          ssh-keygen -t rsa -b 4096 -f molecule/rotate-master-nodes/keys/vm_node -N "" -C "molecule-test-key"
          chmod 600 molecule/rotate-master-nodes/keys/vm_node
          molecule test -s rotate-master-nodes
      
      # test-cluster is the Proxmox scenario. Besides the throwaway key for the test VMs it needs
      # a key for the PVE host itself: the Proxmox API's storage upload endpoint does not accept
      # snippets, so create.yml writes the cloud-init files to the hypervisor over SSH.
      - name: Install the Proxmox host SSH key
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.scenario == 'all' || github.event.inputs.scenario == 'test-cluster'
        env:
          PROXMOX_SSH_KEY: ${{ secrets.PROXMOX_SSH_KEY || '' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          KEY=~/.ssh/proxmox_host

          if [ -z "${PROXMOX_SSH_KEY}" ]; then
            echo "::error::PROXMOX_SSH_KEY is empty. create.yml writes the cloud-init snippets to"
            echo "::error::the PVE host over SSH -- the API's upload endpoint does not take snippets."
            exit 1
          fi

          # The secret is accepted either as the PEM itself or base64-encoded. Base64 is the
          # reliable form: a PEM pasted into a field that eats newlines, or saved from an editor
          # with CRLF endings, produces a file ssh rejects with "error in libcrypto" and then
          # silently falls back to password auth (#486).
          if printf '%s' "${PROXMOX_SSH_KEY}" | tr -d '[:space:]' | base64 -d > "$KEY" 2>/dev/null \
             && grep -q -- "-----BEGIN" "$KEY"; then
            echo "PROXMOX_SSH_KEY decoded from base64."
          else
            printf '%s' "${PROXMOX_SSH_KEY}" | tr -d '\r' > "$KEY"
            # OpenSSH requires the final newline; without it the last base64 line is truncated.
            if [ -n "$(tail -c1 "$KEY")" ]; then printf '\n' >> "$KEY"; fi
          fi
          chmod 600 "$KEY"

          # Fail here with the reason rather than 100 lines later as an UNREACHABLE host whose
          # message blames publickey auth. -P '' distinguishes a malformed key from an encrypted
          # one: CI cannot type a passphrase, so a passphrased key is just as unusable.
          if ! ssh-keygen -y -P '' -f "$KEY" > "$KEY.pub" 2>/tmp/keyerr; then
            echo "::error::PROXMOX_SSH_KEY is not a usable private key:"
            sed 's/^/::error::  /' /tmp/keyerr
            echo "::error::Store it base64-encoded -- \`base64 -w0 < id_ed25519\` -- and make sure it"
            echo "::error::has no passphrase. A passphrased key cannot be used unattended."
            exit 1
          fi
          # Public half only; safe to print, and it is what has to be in the PVE host's
          # authorized_keys for the user in PROXMOX_SSH_USER.
          echo "Proxmox host key loaded: $(cat "$KEY.pub")"

          echo "PROXMOX_SSH_KEY_FILE=$KEY" >> $GITHUB_ENV
          # create.yml delegates to the PVE host, and ansible.cfg's host-key setting is inert
          # (it spells the env var name, not the ini key), so seed the known_hosts instead of
          # relying on ANSIBLE_HOST_KEY_CHECKING.
          ssh-keyscan -H "${PROXMOX_HOST:-}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run Molecule Test - test-cluster
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.scenario == 'all' || github.event.inputs.scenario == 'test-cluster'
        working-directory: ansible
        run: |
          mkdir -p molecule/test-cluster/keys/
          ssh-keygen -t rsa -b 4096 -f molecule/test-cluster/keys/vm_node -N "" -C "molecule-test-key"
          chmod 600 molecule/test-cluster/keys/vm_node
          molecule test -s test-cluster

      # The old globs collected nothing: `.molecule` has not been molecule's state directory for
      # years, and `tests` is unmodified source. ~/.cache/molecule is the real ephemeral
      # directory and holds the resolved inventory and config for each scenario (#464).
      #
      # DO NOT add ansible/ansible.log here. ansible.cfg sends every task result to it, the repo
      # has no no_log (issue #433 was closed as won't-do), and this repository is public --
      # artifacts on public repos are world-downloadable. Uploading it publishes the join token,
      # the certificate key and the AutoGlue org secret.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: molecule-test-results
          path: ~/.cache/molecule
          retention-days: 7
