---
# The sync diff: both directions, computed from the shared node lists (#474).
# nodes_to_remove is what the cluster has and the inventory does not name; nodes_to_add is the
# reverse. sync.yaml reads both off the orchestrator's hostvars.

- name: Collect the inventory and cluster node lists
  ansible.builtin.import_tasks: ../../common/tasks/collect-node-lists.yaml

- name: Copy the remove-diff script
  ansible.builtin.copy:
    src: "compare-to-remove.py"
    dest: "/opt/kubernetes/compare-to-remove.py"
    mode: "0644"

- name: Register nodes to remove
  ansible.builtin.command: python3 /opt/kubernetes/compare-to-remove.py
  register: nodes_to_remove
  changed_when: false


- name: Register nodes to add
  ansible.builtin.command: python3 /opt/kubernetes/compare-to-add.py
  register: nodes_to_add
  changed_when: false

# debug
- name: List of nodes changes
  ansible.builtin.debug:
    msg:
    - "Nodes to remove: {{ nodes_to_remove.stdout }}."
    - "Nodes to add '{{ nodes_to_add.stdout }}'."
