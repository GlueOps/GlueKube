- name: Generate Kubeadm configuration
  ansible.builtin.template:
    src: "kubeadm-stacked-config.yaml.j2"
    dest: "{{ kubeadm_config_file }}"
    owner: root
    group: root
    mode: "0644"
  tags: init_kubeadm

- name: Create PKI directory
  ansible.builtin.file:
    path: /etc/kubernetes/pki/
    state: directory
    mode: '0755'

- name: Generate Authentication Configuration
  ansible.builtin.template:
    src: "authentication-configuration.yaml.j2"
    dest: "/etc/kubernetes/pki/authentication-config.yaml"
    owner: root
    group: root
    mode: "0644"
  tags: init_kubeadm

# check if kubernetes manifest exists
- name: Check if kubernetes manifest exists
  ansible.builtin.stat:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
  register: kube_apiserver_manifest
  tags: init_kubeadm


# run kubernetes init command on master node #1
- name: Initialize Kubernetes cluster
  ansible.builtin.command: "kubeadm init --config {{ kubeadm_config_file }} --upload-certs "
  when: kube_apiserver_manifest.stat.exists == false
  tags: init_kubeadm

# Ungated (#486). prepare-nodes.yaml creates /opt/kubernetes/.kube on every master, and both
# tasks below are idempotent -- copy compares checksums. They used to carry
# `when: kube_apiserver_manifest.stat.exists == false`, which is only true on the node that ran
# `kubeadm init`, so on any other elected orchestrator the kubeconfig was never written and the
# `fetch` below failed on a missing source.
- name: Create kubeconfig directory
  ansible.builtin.file:
    path: "/opt/kubernetes/.kube"
    state: directory
    mode: "0755"
  tags: kubeconfig_setup

- name: Copy kubeconfig to user home directory
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/opt/kubernetes/.kube/config"
    remote_src: true
    owner: "root"
    group: "root"
    mode: "0644"
  tags: kubeconfig_setup


- name: Fetch kubeconfig file
  ansible.builtin.fetch:
    src: /opt/kubernetes/.kube/config
    dest: ./.kube/config
    flat: true
  tags: kubeconfig_setup