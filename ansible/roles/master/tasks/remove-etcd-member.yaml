# Removes ONE removed node's etcd member. Included once per node from scale-down.yaml, so members
# are removed one at a time with etcd checked healthy before each.
#
# Why one at a time: raft accepts a single membership change at a time. A removal sent straight
# after the previous one (or after the leader changes because of it) can be dropped by the leader
# while the earlier change is still unapplied, and the client then times out ("context deadline
# exceeded") even though etcd is healthy. Seen removing the second of two old masters in one sync;
# that member then had to be removed by hand. Waiting for health first and retrying a timeout
# avoids it.

# The lookahead/lookbehind anchors keep master-node-3 from matching master-node-30's row, and a
# worker matches no row and no-ops on its own (#475).
- name: Find the etcd member of {{ master_etcd_node }}
  ansible.builtin.set_fact:
    master_etcd_current_node: "{{ master_etcd_node }}"
    master_etcd_current_member_id: >-
      {{ master_etcd_member_list.stdout_lines | default([])
         | select('search', '(?<![\w-])' ~ master_etcd_node ~ '(?![\w-])')
         | map('regex_replace', '^([^,]*),.*$', '\1')
         | map('trim') | list | first | default('') }}

# Only the members that stay are probed: a leftover member whose VM is already gone would fail an
# `endpoint health --cluster` and block the very removal that fixes it.
- name: Wait for the remaining etcd members to be healthy before removing {{ master_etcd_node }}
  ansible.builtin.shell: |
    export ETCDCTL_API=3
    etcdctl \
      --endpoints={{ master_etcd_surviving_endpoints | join(',') }} \
      --command-timeout=30s --dial-timeout=10s \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt \
      --cert=/etc/kubernetes/pki/etcd/server.crt \
      --key=/etc/kubernetes/pki/etcd/server.key \
      endpoint health
  register: master_etcd_health_before_remove
  changed_when: false
  retries: 10
  delay: 10
  until: master_etcd_health_before_remove.rc == 0
  when: master_etcd_current_member_id | length > 0

# A timed-out removal can still have been applied, so a retry that finds the member gone
# ("member not found") counts as done. Only a timeout is retried; any other error fails at once.
- name: Remove the etcd member of {{ master_etcd_node }}
  ansible.builtin.shell: |
    export ETCDCTL_API=3
    etcdctl \
      --command-timeout=30s --dial-timeout=10s \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt \
      --cert=/etc/kubernetes/pki/etcd/server.crt \
      --key=/etc/kubernetes/pki/etcd/server.key \
      member remove {{ master_etcd_current_member_id }}
  register: master_etcd_member_removed
  changed_when: master_etcd_member_removed.rc == 0
  retries: 5
  delay: 15
  until: >-
    master_etcd_member_removed.rc == 0 or
    'member not found' in master_etcd_member_removed.stderr | default('') or
    'context deadline exceeded' not in master_etcd_member_removed.stderr | default('')
  # tolerate the member disappearing between the read and this removal, as the sibling does
  failed_when: >-
    master_etcd_member_removed.rc != 0 and
    'member not found' not in master_etcd_member_removed.stderr | default('')
  when: master_etcd_current_member_id | length > 0

- name: Record the handled etcd member of {{ master_etcd_node }}
  ansible.builtin.set_fact:
    master_etcd_removed_nodes: "{{ master_etcd_removed_nodes | default([]) + [master_etcd_node] }}"
  when: master_etcd_current_member_id | length > 0
