# upgrade-cluster.yaml does not run prepare-nodes, which is what normally creates this, and on a
# cluster built before /opt/kubernetes was created on every master it exists only on the node that
# originally ran `kubeadm init` (#486). This play is `hosts: orchestrator`, so it lands on whichever
# master the election picks -- and the moment that is not the original init node, the redirect below
# fails with "No such file or directory" after kubeadm has already been upgraded. file/directory is
# idempotent and creates parents.
- name: Ensure the GlueKube state directory exists
  ansible.builtin.file:
    path: /opt/kubernetes
    state: directory
    mode: "0755"
  tags: upgrade

- name: show upgrade plan
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubeadm upgrade plan --allow-release-candidate-upgrades > /opt/kubernetes/upgrade_plan.txt
  register: upgrade_plan
  changed_when: false
  tags: upgrade

# fetch the upgrade plan
- name: fetch the upgrade plan
  ansible.builtin.fetch:
    src: /opt/kubernetes/upgrade_plan.txt
    dest: /tmp/upgrade_plan.txt
    flat: true
  tags: upgrade

# debug
- name: Upgrade Plan
  ansible.builtin.debug:
    msg:
    - "Have a look the upgrade plan in /tmp/upgrade_plan.txt"
  tags: upgrade
  

# debug
- name: Assure Message
  ansible.builtin.debug:
    msg:
    - "We're upgrading your cluster to the following kubernetes version {{ kubernetes_version }}"
  tags: upgrade

# upgrade nodes pacakages

- name: Render the per-node kubelet patch
  ansible.builtin.import_tasks: ../../common/tasks/render-kubelet-patch.yaml
  tags: upgrade

- name: making the upgrade
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubeadm upgrade apply {{ kubernetes_version }} -y --patches /etc/kubernetes/patches
  tags: upgrade

- name: Generate Kubeadm configuration
  ansible.builtin.template:
    src: "kubeadm-stacked-config.yaml.j2"
    dest: "{{ kubeadm_config_file }}"
    owner: root
    group: root
    mode: "0644"
  tags: init_kubeadm