---
- name: Select the orchestrator node
  ansible.builtin.import_tasks: select-orchestrator.yaml
  vars:
    orchestrator_in_play_required: true

# check_mode: false propagates to every task in compare-node.yaml. The diff has to actually run
# under --check or there is no plan to show: it only writes scratch lists under /opt/kubernetes
# and runs read-only kubectl plus the two python diff scripts, so forcing it is safe.
- name: Compare resources
  ansible.builtin.import_tasks: compare-node.yaml
  when: inventory_hostname == orchestrator_node
  check_mode: false

- name: Determine if resources are in sync
  set_fact:
    resources_in_sync: >-
      {{ (hostvars[orchestrator_node]['nodes_to_add'].stdout | default('[]', true)) == '[]'
         and (hostvars[orchestrator_node]['nodes_to_remove'].stdout | default('[]', true)) == '[]' }}
  run_once: true

- name: Report that resources are in sync
  ansible.builtin.debug:
    msg: "All resources are synced"
  when: resources_in_sync | bool
  run_once: true
  delegate_to: localhost

- name: End play successfully when all resources are synced
  ansible.builtin.meta: end_play
  when: resources_in_sync | bool


- name: Parse nodes to add/remove as lists
  set_fact:
    nodes_to_add_list: "{{ (hostvars[orchestrator_node]['nodes_to_add'].stdout | default('[]', true)) | from_json }}"
    nodes_to_remove_list: "{{ (hostvars[orchestrator_node]['nodes_to_remove'].stdout | default('[]', true)) | from_json }}"
  run_once: true

#scale up
- name: Scale up nodes
  ansible.builtin.include_tasks: scale-up.yaml
  vars:
    nodes_to_add: "{{ nodes_to_add_list }}"

# taint/label nodes after scale up
- name: Prepare values for taint/label
  set_fact:
    taint_label_values: "{{ hostvars | dict2items | community.general.json_query(\"[?starts_with(key, 'master') || starts_with(key, 'worker')].{host:key,extra:value.extra}\") }}"
  when: inventory_hostname == orchestrator_node

- name: Taint and label nodes
  ansible.builtin.include_tasks: taint-nodes.yaml
  vars:
    values: "{{ taint_label_values }}"
  when: inventory_hostname == orchestrator_node

# Only the control-plane nodes among the removals belong in the ctrp record, and which ones those
# are comes from the cluster's role label rather than the hostname (#506). nodes_to_remove_list is
# what the cluster holds and the inventory no longer names, so every entry is a live node and the
# label answers for all of them.
- name: Update DNS records and wait for propagation
  ansible.builtin.include_tasks: master-node-rotation/update-dns-records.yaml
  vars:
    nodes_to_remove: >-
      {{ nodes_to_remove_list
         | intersect(hostvars[orchestrator_node]['current_control_plane_nodes'].stdout | from_json)
         | sort | list }}
  when: inventory_hostname == orchestrator_node

# scale down
- name: Scale down nodes
  ansible.builtin.include_tasks: scale-down.yaml
  vars:
    nodes_to_remove: "{{ nodes_to_remove_list }}"
  when: nodes_to_remove_list | length > 0 and inventory_hostname == orchestrator_node
