- name: Select the orchestrator node
  ansible.builtin.import_tasks: select-orchestrator.yaml

- name: Generate Kubeadm configuration
  ansible.builtin.template:
    src: "kubeadm-stacked-config.yaml.j2"
    dest: "{{ kubeadm_config_file }}"
    owner: root
    group: root
    mode: "0644"
  tags: rotate-certs-with-config

- name: Generate Authentication Configuration
  ansible.builtin.template:
    src: "authentication-configuration.yaml.j2"
    dest: "/etc/kubernetes/pki/authentication-config.yaml"
    owner: root
    group: root
    mode: "0644"
  tags: rotate-certs-with-config

# The kubeadm config above was re-rendered from this run's environment and inventory. Uploading
# it replaces the cluster's authoritative kubeadm-config ConfigMap, so an operator running with a
# stale .env -- an older kubernetes_version, a different service_subnet, a domain_name that has
# since changed -- would silently rewrite what every subsequent join and upgrade reads. Compare
# first and refuse unless the change is deliberate (#450).
#
# The comparison is limited to the fields this template actually derives from the environment.
# kubeadm normalises the stored ClusterConfiguration and fills in defaults, so a whole-document
# equality check would fail on every run and teach everyone to pass the override reflexively.
- name: Guard the cluster's kubeadm configuration against local drift
  vars:
    live_cc: "{{ (live_cluster_config.stdout | default('', true) | from_yaml) | default({}, true) }}"
    rendered_cc: "{{ (rendered_kubeadm_config.content | b64decode | from_yaml_all | list)
                     | selectattr('kind', 'defined')
                     | selectattr('kind', 'equalto', 'ClusterConfiguration')
                     | first | default({}, true) }}"
    # certSANs are compared with "0.0.0.0" rejected from BOTH sides (#486). Every cluster built
    # before this branch has it in the stored ConfigMap -- it was in the template and was removed
    # here -- so comparing the raw lists would make this guard hard-fail on the first cert
    # rotation of every existing cluster. The only documented escape, -e allow_config_change=true,
    # also un-gates the upload at the bottom of this file, so the operator's way past a spurious
    # diff was to overwrite the cluster's authoritative config. "0.0.0.0" is inert as an apiserver
    # SAN either way, so dropping it from the comparison is the narrow fix; keeping it in the
    # template would have been the other.
    #
    # etcd is compared too, narrowed the same way apiServer is. The etcd extraArgs carry
    # listen-metrics-urls, which this branch changes cluster-wide -- without it here the guard
    # asserted on a subset of what the upload would actually rewrite and reported "no drift" while
    # silently carrying that change through on an allow_config_change run. dataDir and
    # imageRepository are deliberately excluded: kubeadm fills them in as defaults and the
    # template never sets them, so including them would be permanent false drift.
    live_etcd: "{{ ((live_cc.get('etcd', {}) or {}).get('local', {}) or {}) }}"
    rendered_etcd: "{{ ((rendered_cc.get('etcd', {}) or {}).get('local', {}) or {}) }}"
    live_significant: "{{ {'kubernetesVersion': live_cc.get('kubernetesVersion', ''),
        'controlPlaneEndpoint': live_cc.get('controlPlaneEndpoint', ''),
        'networking': live_cc.get('networking', {}),
        'certSANs': (live_cc.get('apiServer', {}) or {}).get('certSANs', [])
                    | reject('equalto', '0.0.0.0') | sort,
        'apiServerExtraArgs': (live_cc.get('apiServer', {}) or {}).get('extraArgs', []),
        'etcd': {'extraArgs': live_etcd.get('extraArgs', []),
                 'serverCertSANs': live_etcd.get('serverCertSANs', []) | sort,
                 'peerCertSANs': live_etcd.get('peerCertSANs', []) | sort}} }}"
    rendered_significant: "{{ {'kubernetesVersion': rendered_cc.get('kubernetesVersion', ''),
        'controlPlaneEndpoint': rendered_cc.get('controlPlaneEndpoint', ''),
        'networking': rendered_cc.get('networking', {}),
        'certSANs': (rendered_cc.get('apiServer', {}) or {}).get('certSANs', [])
                    | reject('equalto', '0.0.0.0') | sort,
        'apiServerExtraArgs': (rendered_cc.get('apiServer', {}) or {}).get('extraArgs', []),
        'etcd': {'extraArgs': rendered_etcd.get('extraArgs', []),
                 'serverCertSANs': rendered_etcd.get('serverCertSANs', []) | sort,
                 'peerCertSANs': rendered_etcd.get('peerCertSANs', []) | sort}} }}"
  tags: rotate-certs-with-config
  block:
    # failed_when: false, not ignore_errors -- a missing ConfigMap is a legitimate state to
    # report through the assert below rather than a task failure with no explanation.
    - name: Fetch the live ClusterConfiguration from the cluster
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - --namespace=kube-system
          - get
          - configmap
          - kubeadm-config
          - --output=jsonpath={.data.ClusterConfiguration}
      register: live_cluster_config
      changed_when: false
      failed_when: false

    - name: Read the ClusterConfiguration this run rendered
      ansible.builtin.slurp:
        src: "{{ kubeadm_config_file }}"
      register: rendered_kubeadm_config

    - name: Report the configuration difference
      ansible.builtin.debug:
        msg:
          - "cluster:  {{ live_significant }}"
          - "rendered: {{ rendered_significant }}"
      when: live_significant != rendered_significant

    - name: Refuse to silently change the cluster's kubeadm configuration
      ansible.builtin.assert:
        that:
          - live_significant == rendered_significant
        fail_msg: >-
          The kubeadm configuration rendered on {{ inventory_hostname }} does not match the
          cluster's kubeadm-config ConfigMap (the difference is in the task above). Rotating
          certs would overwrite the cluster's copy with this one. If that is what you want --
          adding a certSAN, for instance -- re-run with -e allow_config_change=true. If it is
          not, your local variables are stale: regenerate .env from platform.json with parser.py
          and source it before running again.
        quiet: true
      when: not (allow_config_change | default(false) | bool)


# The whole PKI, not just the apiserver (#486). Everything below this task used to be the only
# certificate work the playbook did -- it regenerated apiserver.{crt,key} and nothing else -- while
# `playbooks/rotate-certs.yaml`, `roles/master/tasks/rotate-certs.yaml` and `make rotate-certs` were
# deleted on this branch and readme.md's day-2 table now sends "rotate the control-plane
# certificates" here. An operator following that renewed one certificate of eleven and was left with
# etcd/server, etcd/peer, apiserver-etcd-client, front-proxy and the controller-manager/scheduler
# kubeconfigs expiring on their original schedule.
#
# Ordering: this runs BEFORE the apiserver-specific regeneration below, not after. `certs renew`
# rebuilds apiserver.crt from the cluster's STORED kubeadm-config, so running it last would
# overwrite the cert the `--config` render produces and silently drop any certSAN change on a run
# with -e allow_config_change=false, where the upload is skipped and the stored copy is stale.
# Renewing first and letting the config-driven regeneration have the last word on the apiserver
# keeps both behaviours.
#
# `certs renew all` also rewrites /etc/kubernetes/admin.conf, which is why the kubeconfig copy is
# refreshed further down.
- name: Renew the full control-plane PKI
  ansible.builtin.command: kubeadm certs renew all
  tags: rotate-certs-with-config

- name: Remove existing API server cert files to force regeneration from config
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes/pki/apiserver.crt
    - /etc/kubernetes/pki/apiserver.key
  tags: rotate-certs-with-config

- name: Regenerate API server certificate from kubeadm config
  ansible.builtin.command: "kubeadm init phase certs apiserver --config {{ kubeadm_config_file }}"
  tags: rotate-certs-with-config

# Only ever runs on an explicit opt-in -- see the guard above. If the rendered configuration
# already matches the cluster's there is nothing to upload, and if it does not, rewriting the
# authoritative kubeadm-config ConfigMap is a cluster-wide change that every later `kubeadm join`
# and `kubeadm upgrade` reads (#450).
- name: Upload kubeadm ClusterConfiguration to kubeadm-config ConfigMap
  ansible.builtin.command: "kubeadm init phase upload-config kubeadm --config {{ kubeadm_config_file }}"
  when:
    - inventory_hostname == orchestrator_node
    - allow_config_change | default(false) | bool
  tags: rotate-certs-with-config

- name: Regenerate API server static pod manifest from kubeadm config
  ansible.builtin.command: "kubeadm init phase control-plane apiserver --config {{ kubeadm_config_file }}"
  tags: rotate-certs-with-config

# Restart order. etcd goes down WITH the apiserver, not after it, and controller-manager and
# scheduler only once the apiserver is ready again.
#
# The kubelet makes API calls for a static pod (the mirror pod) before it recreates it. With etcd
# parked on its own, the local apiserver stays up with no etcd behind it, and those calls hang until
# they time out instead of failing. That is how kube-scheduler stayed missing for ~5.5 minutes on a
# single-master cluster and failed the run: it had been parked alongside etcd, and the kubelet only
# recreated it once the apiserver restarted and the calls failed fast with "connection refused".
# With 3 masters the same hang hits every call ctrp routes to this node.
#
# Parking the apiserver with etcd means there is never an apiserver that accepts and then hangs:
# the calls are refused (single master) or answered by a sibling (ctrp). It is also one control-plane
# outage on this node instead of two. On this `serial: 1` play only one etcd member is down at a
# time, so a 3-node cluster keeps quorum.
#
# The etcd flags come from the ClusterConfiguration this run rendered and the guard above compared.
- name: Restart etcd and the apiserver onto the renewed certificates and the rendered etcd flags
  ansible.builtin.include_tasks: restart-static-pods.yaml
  vars:
    master_static_pods: [etcd, kube-apiserver]
    master_etcd_extra_args: >-
      {{ ((((rendered_kubeadm_config.content | b64decode | from_yaml_all | list)
             | selectattr('kind', 'defined')
             | selectattr('kind', 'equalto', 'ClusterConfiguration')
             | first | default({}, true)).get('etcd', {}) or {}).get('local', {}) or {}).get('extraArgs', [])
         | default([], true) }}
  tags: rotate-certs-with-config

# controller-manager.conf and scheduler.conf were rewritten by `certs renew all`, and both pods keep
# the old credential until they are recreated. The apiserver is ready by now, so the kubelet's calls
# for these two pods return straight away.
- name: Restart the controller-manager and scheduler onto the renewed certificates
  ansible.builtin.include_tasks: restart-static-pods.yaml
  vars:
    master_static_pods: [kube-controller-manager, kube-scheduler]
  tags: rotate-certs-with-config

# `certs renew all` rewrote /etc/kubernetes/admin.conf with a fresh client certificate. Without this
# the copy at /opt/kubernetes/.kube/config -- the one kubeadm-init.yaml puts there and the one an
# operator on the box actually uses -- keeps the pre-rotation credential and starts failing when the
# old certificate expires. Same tasks as kubeadm-init.yaml:44-58, so the file ends up identical
# whichever path wrote it last.
- name: Create kubeconfig directory
  ansible.builtin.file:
    path: /opt/kubernetes/.kube
    state: directory
    mode: "0755"
  tags: rotate-certs-with-config

- name: Refresh the operator kubeconfig with the renewed credential
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /opt/kubernetes/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  tags: rotate-certs-with-config

# The outcome, printed rather than asserted. What counts as "long enough" depends on when the
# operator plans to run this again, so this reports the expiry dates and leaves the judgement to
# them -- but it makes a rotation that silently renewed nothing impossible to mistake for a good
# run, which is what the old apiserver-only behaviour looked like from the log.
- name: Read the certificate expiry dates
  ansible.builtin.command: kubeadm certs check-expiration
  register: certs_expiration
  changed_when: false
  tags: rotate-certs-with-config

- name: Report the certificate expiry dates
  ansible.builtin.debug:
    msg: "{{ certs_expiration.stdout_lines }}"
  tags: rotate-certs-with-config
