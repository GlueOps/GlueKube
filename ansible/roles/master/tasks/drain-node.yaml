# Included once per node from scale-down.yaml so the task header names the node before the drain
# starts; a plain looped task only prints `(item=...)` after each iteration finishes.
- name: "Drain node {{ node_to_drain }}"
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl drain {{ node_to_drain }} --ignore-daemonsets  --delete-emptydir-data --grace-period=900
  register: master_drain_node_result
  changed_when: "'drained' in master_drain_node_result.stdout"
