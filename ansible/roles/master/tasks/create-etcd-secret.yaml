---
# Publishes an etcd client identity scoped to Prometheus monitoring.
#
# The kube-apiserver etcd client keypair is NOT shared with the monitoring
# namespace: anything able to read that secret would get full read/write access
# to etcd. Instead a dedicated keypair (CN=prometheus) is minted from the etcd
# CA and restricted to clientAuth, so the scrape identity is separate,
# auditable and revocable without touching the control plane.
#
# DEPRECATED, pending removal. etcd RBAC is not enabled (no auth-enable in
# kubeadm-stacked-config.yaml.j2, and nothing here runs etcdctl user/role), and
# etcd with --client-cert-auth accepts any certificate its CA signed. So this
# identity is separate and revocable but NOT read-only -- CN=prometheus can still
# read and write every key, which is exactly what #436 is about.
#
# The replacement is already in place: etcd now exposes an unauthenticated
# metrics/health listener on :2381 (listen-metrics-urls in
# kubeadm-stacked-config.yaml.j2), which is all Prometheus actually needs. Once the
# glueops-core kube-prometheus-stack serviceMonitor is repointed from
# https://<node>:2379 + etcd-client-certs to http://<node>:2381, delete this file,
# drop the import from main.yaml, and remove the secret with:
#
#   kubectl -n <etcd_secret_namespace> delete secret etcd-client-certs
#
# Until that lands, removing this task would blind etcd monitoring, so it stays.

- name: Set etcd monitoring certificate facts
  ansible.builtin.set_fact:
    etcd_monitoring_ca_crt: /etc/kubernetes/pki/etcd/ca.crt
    etcd_monitoring_ca_key: /etc/kubernetes/pki/etcd/ca.key
    etcd_monitoring_crt: /etc/kubernetes/pki/etcd/prometheus-client.crt
    etcd_monitoring_key: /etc/kubernetes/pki/etcd/prometheus-client.key
    etcd_monitoring_subject: "{{ etcd_monitoring_cert_subject | default('/O=glueops-monitoring/CN=prometheus') }}"
    etcd_monitoring_validity_days: "{{ etcd_monitoring_cert_validity_days | default(3650) }}"
    etcd_monitoring_renew_before: "{{ etcd_monitoring_cert_renew_before_seconds | default(2592000) }}"
  tags: create_etcd_secret

- name: Check for a valid Prometheus etcd client certificate
  ansible.builtin.shell: |
    set -o pipefail
    test -s {{ etcd_monitoring_crt }} && test -s {{ etcd_monitoring_key }} || exit 1
    openssl x509 -in {{ etcd_monitoring_crt }} -noout -checkend {{ etcd_monitoring_renew_before }}
  register: etcd_monitoring_cert_state
  changed_when: false
  failed_when: false
  args:
    executable: /bin/bash
  tags: create_etcd_secret

- name: Issue a Prometheus-scoped etcd client certificate
  ansible.builtin.shell: |
    set -euo pipefail
    D="$(mktemp -d)"
    trap 'rm -rf "$D"' EXIT
    cat > "$D/client.ext" <<'EOF'
    basicConstraints = critical,CA:FALSE
    keyUsage = critical,digitalSignature,keyEncipherment
    extendedKeyUsage = clientAuth
    subjectKeyIdentifier = hash
    EOF
    openssl genrsa -out "$D/client.key" 2048
    openssl req -new -key "$D/client.key" -subj "{{ etcd_monitoring_subject }}" -out "$D/client.csr"
    openssl x509 -req -sha256 \
      -in "$D/client.csr" \
      -CA {{ etcd_monitoring_ca_crt }} \
      -CAkey {{ etcd_monitoring_ca_key }} \
      -CAcreateserial \
      -days {{ etcd_monitoring_validity_days }} \
      -extfile "$D/client.ext" \
      -out "$D/client.crt"
    install -m 0600 "$D/client.key" {{ etcd_monitoring_key }}
    install -m 0644 "$D/client.crt" {{ etcd_monitoring_crt }}
  args:
    executable: /bin/bash
  when: etcd_monitoring_cert_state.rc != 0
  register: etcd_monitoring_cert_issued
  tags: create_etcd_secret

- name: Verify the scoped certificate can scrape etcd metrics
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sSf --max-time 10 \
      --cacert {{ etcd_monitoring_ca_crt }} \
      --cert {{ etcd_monitoring_crt }} \
      --key {{ etcd_monitoring_key }} \
      https://127.0.0.1:2379/metrics -o /dev/null
  args:
    executable: /bin/bash
  changed_when: false
  retries: 6
  delay: 5
  register: etcd_monitoring_scrape
  until: etcd_monitoring_scrape.rc == 0
  tags: create_etcd_secret

- name: Ensure the monitoring namespace exists
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl create namespace {{ etcd_secret_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  register: etcd_secret_namespace_apply
  changed_when: "'unchanged' not in etcd_secret_namespace_apply.stdout"
  tags: create_etcd_secret

# Key names are kept as-is so the kube-prometheus-stack serviceMonitor
# (caFile/certFile/keyFile) keeps working unchanged; only the identity behind
# apiserver-etcd-client.* changed from the apiserver to CN=prometheus.
- name: Publish the scoped etcd client secret
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl -n {{ etcd_secret_namespace }} create secret generic etcd-client-certs \
      --from-file=ca.crt={{ etcd_monitoring_ca_crt }} \
      --from-file=apiserver-etcd-client.crt={{ etcd_monitoring_crt }} \
      --from-file=apiserver-etcd-client.key={{ etcd_monitoring_key }} \
      --dry-run=client -o yaml | kubectl apply -f -
    kubectl -n {{ etcd_secret_namespace }} label secret etcd-client-certs \
      app.kubernetes.io/managed-by=gluekube \
      app.kubernetes.io/component=etcd-monitoring --overwrite
  args:
    executable: /bin/bash
  register: etcd_secret_apply
  changed_when: "'unchanged' not in etcd_secret_apply.stdout"
  tags: create_etcd_secret
