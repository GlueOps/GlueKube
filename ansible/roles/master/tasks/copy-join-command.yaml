---
# Control-plane side of the join: shared credentials, then the JoinConfiguration that carries
# controlPlane/certificateKey. The credential half lives in roles/common (#474).

- name: Create the join credentials on the orchestrator
  ansible.builtin.include_role:
    name: common
    tasks_from: create-join-credentials.yaml
  tags: create_join_command

- name: Generate Kubeadm Join configuration
  ansible.builtin.template:
    src: kubeadm-join-config.j2
    dest: /opt/kubeadm_join.yaml
    mode: "0755"
  when: inventory_hostname != orchestrator_node
  tags: create_join_command
