- name: Cordon Nodes
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    echo "Cordon Node: {{ item }}"
    kubectl cordon {{ item }}
  with_items: "{{ nodes_to_remove | default([]) }}"
  when: nodes_to_remove | length > 0

- name: Drain Nodes
  ansible.builtin.include_tasks: drain-node.yaml
  loop: "{{ nodes_to_remove | default([]) }}"
  loop_control:
    loop_var: node_to_drain
  when: nodes_to_remove | length > 0

# Read once, rc checked, for the endpoints below; each removal re-reads it. A failed read
# must fail here, not look like "no members".
- name: Read the etcd member list
  ansible.builtin.shell: |
    export ETCDCTL_API=3
    etcdctl \
      --command-timeout=30s --dial-timeout=10s \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt \
      --cert=/etc/kubernetes/pki/etcd/server.crt \
      --key=/etc/kubernetes/pki/etcd/server.key \
      member list
  register: master_etcd_member_list
  changed_when: false
  retries: 3
  delay: 10
  until: master_etcd_member_list.rc == 0
  when: inventory_hostname == orchestrator_node and nodes_to_remove | length > 0

# Health checks probe only the members that stay, so a dead member being removed can't fail them.
- name: Work out the etcd endpoints that remain after the scale-down
  ansible.builtin.set_fact:
    master_etcd_health_endpoints: >-
      {{ master_etcd_member_list.stdout_lines | default([])
         | reject('search', '(?<![\w-])(' ~ (nodes_to_remove | map('regex_escape') | join('|')) ~ ')(?![\w-])')
         | map('regex_replace', '^(?:[^,]*,){4}\s*([^,]*),.*$', '\1')
         | map('trim') | select | list }}
  when: inventory_hostname == orchestrator_node and nodes_to_remove | length > 0

# Unreachable members go first: while a dead member is still counted, etcd refuses to remove a
# live one ("unhealthy cluster"), and nodes_to_remove has no fixed order.
- name: Probe the etcd endpoint of each removed node
  ansible.builtin.shell: |
    export ETCDCTL_API=3
    etcdctl endpoint health --endpoints={{ master_etcd_probe_url }} \
      --dial-timeout=3s --command-timeout=5s \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt \
      --cert=/etc/kubernetes/pki/etcd/server.crt \
      --key=/etc/kubernetes/pki/etcd/server.key
  vars:
    master_etcd_probe_url: >-
      {{ master_etcd_member_list.stdout_lines | select('search', '(?<![\w-])' ~ (item | regex_escape) ~ '(?![\w-])')
         | map('regex_replace', '^(?:[^,]*,){4}\s*([^,]*),.*$', '\1') | map('trim') | first | default('') }}
  loop: "{{ nodes_to_remove | default([]) }}"
  register: master_etcd_probe
  changed_when: false
  failed_when: false
  when: inventory_hostname == orchestrator_node and master_etcd_probe_url | length > 0

# Gated only on etcd membership, not on node names or groups['masters'] (#475): a node being
# scaled down is by definition no longer in the inventory.
- name: Remove each node from etcd and Kubernetes, one at a time
  ansible.builtin.include_tasks: remove-node.yaml
  loop: "{{ (master_etcd_unreachable | sort) + (nodes_to_remove | default([]) | difference(master_etcd_unreachable) | sort) }}"
  loop_control:
    loop_var: master_etcd_node
  vars:
    master_etcd_unreachable: >-
      {{ master_etcd_probe.results | default([]) | selectattr('rc', 'defined')
         | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}
  when: inventory_hostname == orchestrator_node and nodes_to_remove | length > 0

- name: Wait for etcd to be healthy after removing members
  ansible.builtin.include_tasks: master-node-rotation/check-etcd-health.yaml
  vars:
    health_check_stage: after removing members
    master_etcd_health_retries: 10
  when:
    - inventory_hostname == orchestrator_node and nodes_to_remove | length > 0
    - master_etcd_removed_nodes | default([]) | length > 0
