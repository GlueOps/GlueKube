- name: Cordon Nodes
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    echo "Cordon Node: {{ item }}"
    kubectl cordon {{ item }}
  with_items: "{{ nodes_to_remove | default([]) }}"
  when: nodes_to_remove | length > 0

- name: Drain Nodes
  ansible.builtin.include_tasks: drain-node.yaml
  loop: "{{ nodes_to_remove | default([]) }}"
  loop_control:
    loop_var: node_to_drain
  when: nodes_to_remove | length > 0

- name: Delete Nodes
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    echo "Deleting Node: {{ item }}"
    kubectl delete node {{ item }} 
  with_items: "{{ nodes_to_remove | default([]) }}"
  when: nodes_to_remove | length > 0

# The etcd member list is the authority on which nodes are members, and this reads it once, with
# its rc checked, before anything acts on the answer. Splitting the read from the removal is the
# point: a failed or timed-out `member list` returns the same empty result as a node that has no
# member, so a guard on emptiness alone cannot tell "this is not a member" from "could not ask" and
# turns the second into a green no-op -- after cordon, drain and delete have already run, leaving a
# phantom member counting toward quorum on a VM the operator is about to destroy. Failing here is
# the whole behaviour: the removal below only ever runs on an answer etcd actually gave.
#
# Timeouts match remove-single-master.yaml and check-etcd-health.yaml; without them a single hung
# probe eats the retry budget.
- name: Read the etcd member list
  ansible.builtin.shell: |
    export ETCDCTL_API=3
    etcdctl \
      --command-timeout=30s --dial-timeout=10s \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt \
      --cert=/etc/kubernetes/pki/etcd/server.crt \
      --key=/etc/kubernetes/pki/etcd/server.key \
      member list
  register: master_etcd_member_list
  changed_when: false
  retries: 3
  delay: 10
  until: master_etcd_member_list.rc == 0
  when: inventory_hostname == orchestrator_node and nodes_to_remove | length > 0

# Gated on nothing but etcd's own membership (#475).
#
# This used to carry `when: item is search("master-node-*")`, so a control-plane node named
# anything else skipped removal and left a phantom member counting toward quorum -- a two-member
# cluster that has lost quorum while reporting three.
#
# The obvious repair, `item in groups['masters']`, is WRONG here and would be a worse bug:
# nodes_to_remove is by definition what the cluster has and the inventory does NOT name
# (compare-node.yaml), so a node being scaled down is already absent from groups['masters'] and
# the condition would be false for exactly the nodes this has to act on -- silently skipping
# every removal.
#
# The lookahead/lookbehind anchors keep master-node-3 from matching master-node-30's row, and a
# worker matches no row and no-ops on its own, which is what the hostname regex was reaching for.
- name: Remove the etcd members of removed control-plane nodes
  when: inventory_hostname == orchestrator_node and nodes_to_remove | length > 0
  block:
    - name: Remove the node's etcd member if it has one
      ansible.builtin.shell: |
        export ETCDCTL_API=3
        etcdctl \
          --command-timeout=30s --dial-timeout=10s \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key \
          member remove {{ etcd_member_id }}
      vars:
        etcd_member_id: >-
          {{ master_etcd_member_list.stdout_lines | default([])
             | select('search', '(?<![\w-])' ~ item ~ '(?![\w-])')
             | map('regex_replace', '^([^,]*),.*$', '\1')
             | map('trim') | list | first | default('') }}
      with_items: "{{ nodes_to_remove | default([]) }}"
      when:
        - inventory_hostname == orchestrator_node and nodes_to_remove | length > 0
        - etcd_member_id | length > 0
      register: master_etcd_member_removed
      changed_when: master_etcd_member_removed.rc == 0
      # Retry each removal. Scaling down several masters removes their members back to back, and a
      # removal issued right after the previous membership change can fail to commit within
      # --command-timeout ("context deadline exceeded") even though etcd is healthy and has quorum --
      # seen removing the second of two old masters, which then had to be removed by hand. A timed-out
      # removal can still have been applied, so a retry that finds the member gone ("member not found")
      # counts as done, the same as the failed_when below.
      retries: 5
      delay: 15
      until: >-
        master_etcd_member_removed.rc == 0 or
        'member not found' in master_etcd_member_removed.stderr | default('')
      # tolerate the member disappearing between the read above and this removal, as the sibling does
      failed_when: >-
        master_etcd_member_removed.rc != 0 and
        'member not found' not in master_etcd_member_removed.stderr | default('')

  # When a removal still fails after its retries, say what failed and what to do, in the log the
  # operator is already reading, instead of a bare failed_when. The cordon, drain and node deletion
  # above have already run, so the safe next step is to remove the leftover member by hand and sync
  # again. Only the known case (a timeout) gets that advice; any other error is printed as-is.
  rescue:
    - name: Check etcd health after the failed removal
      ansible.builtin.shell: |
        export ETCDCTL_API=3
        etcdctl \
          --command-timeout=30s --dial-timeout=10s \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key \
          endpoint health --cluster
      register: master_etcd_health_on_failure
      changed_when: false
      failed_when: false

    - name: Explain the failed etcd member removal
      ansible.builtin.debug:
        msg: "{{ master_etcd_removal_help | trim | from_json }}"
      vars:
        master_etcd_failed_removals: >-
          {{ (ansible_failed_result.results | default([ansible_failed_result]))
             | selectattr('failed', 'defined') | selectattr('failed') | list }}
        master_etcd_removal_help: >-
          {% set lines = ['etcd member removal failed after its retries. The nodes below were already cordoned, drained and deleted from Kubernetes; only their etcd member is left.'] %}
          {% for r in master_etcd_failed_removals %}
          {%   set member_id = (r.cmd | default('') | regex_search('member remove (\\S+)', '\\1') or ['?']) | first %}
          {%   set timed_out = 'context deadline exceeded' in (r.stderr | default('')) %}
          {%   set _ = lines.append('- ' ~ (r.item | default('?')) ~ ' (etcd member ' ~ member_id ~ '): ' ~ ('timed out (context deadline exceeded)' if timed_out else 'unexpected error: ' ~ (r.stderr | default(r.msg | default('')) | trim))) %}
          {% endfor %}
          {% set _ = lines.append('etcd health now: ' ~ ('all remaining members healthy, quorum intact' if master_etcd_health_on_failure.rc == 0 else 'NOT healthy, do not remove anything else until it is: ' ~ (master_etcd_health_on_failure.stderr | default('') | trim))) %}
          {% if master_etcd_health_on_failure.rc == 0 and (master_etcd_failed_removals | rejectattr('stderr', 'search', 'context deadline exceeded') | list | length == 0) %}
          {%   set _ = lines.append('Next: on ' ~ inventory_hostname ~ ', remove each member above by hand, one at a time, checking health in between:') %}
          {%   for r in master_etcd_failed_removals %}
          {%     set _ = lines.append('  sudo ETCDCTL_API=3 etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key member remove ' ~ ((r.cmd | default('') | regex_search('member remove (\\S+)', '\\1') or ['?']) | first)) %}
          {%   endfor %}
          {%   set _ = lines.append('  then: sudo ETCDCTL_API=3 etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key endpoint health --cluster (all healthy), and run sync again. It is safe to repeat.') %}
          {% else %}
          {%   set _ = lines.append('Next: fix the error above (or get etcd healthy) before removing anything by hand, then run sync again.') %}
          {% endif %}
          {{ lines | to_json }}

    - name: Fail the run after the etcd member removal error
      ansible.builtin.fail:
        msg: "etcd member removal failed; see the explanation in the previous task's output."

# Don't finish a scale-down on a cluster etcd hasn't settled: every remaining member must answer
# before the run reports success and the operator destroys the removed VMs. Runs whenever the
# removal above ran for at least one member (a worker-only scale-down skips it).
- name: Wait for etcd to be healthy after removing members
  ansible.builtin.shell: |
    export ETCDCTL_API=3
    etcdctl \
      --command-timeout=30s --dial-timeout=10s \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt \
      --cert=/etc/kubernetes/pki/etcd/server.crt \
      --key=/etc/kubernetes/pki/etcd/server.key \
      endpoint health --cluster
  register: master_etcd_health_after_remove
  changed_when: false
  retries: 10
  delay: 10
  until: master_etcd_health_after_remove.rc == 0
  when:
    - inventory_hostname == orchestrator_node and nodes_to_remove | length > 0
    - master_etcd_member_removed.results | default([]) | selectattr('rc', 'defined') | list | length > 0
