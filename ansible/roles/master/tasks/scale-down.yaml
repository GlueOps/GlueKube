- name: Cordon Nodes
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    echo "Cordon Node: {{ item }}"
    kubectl cordon {{ item }}
  with_items: "{{ nodes_to_remove | default([]) }}"
  when: nodes_to_remove | length > 0

- name: Drain Nodes
  ansible.builtin.include_tasks: drain-node.yaml
  loop: "{{ nodes_to_remove | default([]) }}"
  loop_control:
    loop_var: node_to_drain
  when: nodes_to_remove | length > 0

- name: Delete Nodes
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    echo "Deleting Node: {{ item }}"
    kubectl delete node {{ item }} 
  with_items: "{{ nodes_to_remove | default([]) }}"
  when: nodes_to_remove | length > 0

# The etcd member list is the authority on which nodes are members, and this reads it once, with
# its rc checked, before anything acts on the answer. Splitting the read from the removal is the
# point: a failed or timed-out `member list` returns the same empty result as a node that has no
# member, so a guard on emptiness alone cannot tell "this is not a member" from "could not ask" and
# turns the second into a green no-op -- after cordon, drain and delete have already run, leaving a
# phantom member counting toward quorum on a VM the operator is about to destroy. Failing here is
# the whole behaviour: the removal below only ever runs on an answer etcd actually gave.
#
# Timeouts match remove-single-master.yaml and check-etcd-health.yaml; without them a single hung
# probe eats the retry budget.
- name: Read the etcd member list
  ansible.builtin.shell: |
    export ETCDCTL_API=3
    etcdctl \
      --command-timeout=30s --dial-timeout=10s \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt \
      --cert=/etc/kubernetes/pki/etcd/server.crt \
      --key=/etc/kubernetes/pki/etcd/server.key \
      member list
  register: master_etcd_member_list
  changed_when: false
  retries: 3
  delay: 10
  until: master_etcd_member_list.rc == 0
  when: inventory_hostname == orchestrator_node and nodes_to_remove | length > 0

# Endpoints of the members that stay (everything in the list that isn't being removed). The shared
# health check (master-node-rotation/check-etcd-health.yaml) probes only these, so a leftover member
# whose VM is already gone can't block or mislead it.
- name: Work out the etcd endpoints that remain after the scale-down
  ansible.builtin.set_fact:
    master_etcd_health_endpoints: >-
      {{ master_etcd_member_list.stdout_lines | default([])
         | reject('search', '(?<![\w-])(' ~ (nodes_to_remove | map('regex_escape') | join('|')) ~ ')(?![\w-])')
         | map('regex_replace', '^(?:[^,]*,){4}\s*([^,]*),.*$', '\1')
         | map('trim') | select | list }}
  when: inventory_hostname == orchestrator_node and nodes_to_remove | length > 0

# Gated on nothing but etcd's own membership (#475).
#
# This used to carry `when: item is search("master-node-*")`, so a control-plane node named
# anything else skipped removal and left a phantom member counting toward quorum -- a two-member
# cluster that has lost quorum while reporting three.
#
# The obvious repair, `item in groups['masters']`, is WRONG here and would be a worse bug:
# nodes_to_remove is by definition what the cluster has and the inventory does NOT name
# (compare-node.yaml), so a node being scaled down is already absent from groups['masters'] and
# the condition would be false for exactly the nodes this has to act on -- silently skipping
# every removal.
#
# The lookahead/lookbehind anchors keep master-node-3 from matching master-node-30's row, and a
# worker matches no row and no-ops on its own, which is what the hostname regex was reaching for
# (the matching now lives in remove-etcd-member.yaml).
- name: Remove the etcd members of removed control-plane nodes
  when: inventory_hostname == orchestrator_node and nodes_to_remove | length > 0
  block:
    - name: Remove each removed node's etcd member, one at a time
      ansible.builtin.include_tasks: remove-etcd-member.yaml
      loop: "{{ nodes_to_remove | default([]) }}"
      loop_control:
        loop_var: master_etcd_node

  # When a removal (or the health wait before it) still fails after its retries, say what failed and
  # what to do, in the log the operator is already reading, instead of a bare failed_when. Cordon,
  # drain and node deletion above have already run, so the safe next step is usually to remove the
  # leftover members by hand and sync again. Only the known case (a timeout on a healthy etcd) gets
  # that advice; any other error is printed as-is. The run still fails afterwards.
  rescue:
    - name: Check the remaining etcd members after the failed removal
      ansible.builtin.include_tasks: master-node-rotation/check-etcd-health.yaml
      vars:
        health_check_stage: after the failed removal
        master_etcd_health_retries: 1
        master_etcd_health_fail: false

    - name: Explain the failed etcd member removal
      ansible.builtin.debug:
        msg: "{{ master_etcd_removal_help | trim | from_json }}"
      vars:
        master_etcd_error: "{{ ansible_failed_result.stderr | default(ansible_failed_result.msg | default('')) | trim }}"
        master_etcd_timed_out: "{{ 'context deadline exceeded' in master_etcd_error }}"
        master_etcd_failed_health_wait: "{{ master_etcd_current_step | default('') == 'health check' }}"
        master_etcd_left: >-
          {{ nodes_to_remove | default([]) | difference(master_etcd_removed_nodes | default([])) }}
        master_etcd_removal_help: >-
          {% set lines = ['etcd member removal failed. The nodes below were already cordoned, drained and deleted from Kubernetes; only their etcd member may be left.'] %}
          {% set reason = 'the remaining members were not healthy before the removal, so it was not attempted' if master_etcd_failed_health_wait | bool else ('timed out (context deadline exceeded)' if master_etcd_timed_out | bool else 'unexpected error: ' ~ master_etcd_error) %}
          {% set _ = lines.append('- failed on ' ~ (master_etcd_current_node | default('?')) ~ ' (etcd member ' ~ (master_etcd_current_member_id | default('?')) ~ '): ' ~ reason) %}
          {% set rest = master_etcd_left | difference([master_etcd_current_node | default('')]) %}
          {% if rest | length > 0 %}{% set _ = lines.append('- not attempted yet: ' ~ (rest | join(', '))) %}{% endif %}
          {% set healthy = etcd_health.rc | default(1) == 0 %}
          {% set _ = lines.append('etcd health of the remaining members now: ' ~ ('healthy, quorum intact' if healthy else 'NOT healthy, do not remove anything else until it is: ' ~ (etcd_health.stderr | default(etcd_health.stdout | default('')) | trim))) %}
          {% if healthy and master_etcd_timed_out | bool and not master_etcd_failed_health_wait | bool %}
          {%   set _ = lines.append('Next: on ' ~ inventory_hostname ~ ', for each node above, one at a time: find its ID with `member list`, run `member remove <id>`, then check `endpoint health --cluster` before the next one. `member not found` means it is already gone. Then run sync again; it is safe to repeat.') %}
          {%   set _ = lines.append('  sudo ETCDCTL_API=3 etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/etc/kubernetes/pki/etcd/ca.crt --cert=/etc/kubernetes/pki/etcd/server.crt --key=/etc/kubernetes/pki/etcd/server.key member remove ' ~ (master_etcd_current_member_id | default('<id>'))) %}
          {% else %}
          {%   set _ = lines.append('Next: fix the error above (or get etcd healthy) before removing anything by hand, then run sync again.') %}
          {% endif %}
          {{ lines | to_json }}

    - name: Fail the run after the etcd member removal error
      ansible.builtin.fail:
        msg: "etcd member removal failed; see the explanation in the previous task's output."

# Don't finish a scale-down on an etcd that hasn't settled: every remaining member must answer
# before the run reports success and the operator destroys the removed VMs.
- name: Wait for etcd to be healthy after removing members
  ansible.builtin.include_tasks: master-node-rotation/check-etcd-health.yaml
  vars:
    health_check_stage: after removing members
    master_etcd_health_retries: 10
  when:
    - inventory_hostname == orchestrator_node and nodes_to_remove | length > 0
    - master_etcd_removed_nodes | default([]) | length > 0
