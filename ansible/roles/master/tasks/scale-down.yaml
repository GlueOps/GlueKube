- name: Cordon Nodes
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    echo "Cordon Node: {{ item }}"
    kubectl cordon {{ item }}
  with_items: "{{ nodes_to_remove | default([]) }}"
  when: nodes_to_remove | length > 0

- name: Drain Nodes
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    echo "Drain Node: {{ item }}"
    kubectl drain {{ item }} --ignore-daemonsets  --delete-emptydir-data --grace-period=900
  with_items: "{{ nodes_to_remove | default([]) }}"
  when: nodes_to_remove | length > 0

- name: Delete Nodes
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    echo "Deleting Node: {{ item }}"
    kubectl delete node {{ item }} 
  with_items: "{{ nodes_to_remove | default([]) }}"
  when: nodes_to_remove | length > 0

- name: Remove etcd members only if it's control plane node
  ansible.builtin.shell: |
    set -o pipefail
    export ETCDCTL_API=3
    ETCD_MEMBER_ID=$(etcdctl \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt \
      --cert=/etc/kubernetes/pki/etcd/server.crt \
      --key=/etc/kubernetes/pki/etcd/server.key \
      member list | grep -P '(?<![\w-]){{ item }}(?![\w-])' | awk '{print $1}' | tr -d ',' )

    # the grep misses when the member is already gone. without this guard the removal below
    # runs as `member remove` with no argument and fails on a usage error instead of being a
    # no-op. remove-single-master.yaml guards the same case with `when: stdout | length > 0`.
    if [ -z "$ETCD_MEMBER_ID" ]; then
      echo "no etcd member matching {{ item }} - nothing to remove"
      exit 0
    fi

    etcdctl  \
      --cacert=/etc/kubernetes/pki/etcd/ca.crt \
      --cert=/etc/kubernetes/pki/etcd/server.crt \
      --key=/etc/kubernetes/pki/etcd/server.key \
      member remove $ETCD_MEMBER_ID
  args:
    executable: /bin/bash
  with_items: "{{ nodes_to_remove | default([]) }}"
  when: 
    - inventory_hostname == orchestrator_node and nodes_to_remove | length > 0
    - item is search("master-node-*")
  
