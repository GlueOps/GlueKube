---
# Picks the control-plane node the rest of the run reads its state from.
#
# Everything downstream (the node diff, the join token and hash, delegated kubectl calls) is read
# off a single master. Pinning that to groups['masters'][0] positionally means the tooling stops
# working whenever that node is down or excluded by --limit, even though the cluster itself is
# healthy. So probe the masters and take the first one whose apiserver answers /readyz.
#
# The probe is pinned to https://127.0.0.1:6443 rather than going through the kubeconfig's server
# (#486). admin.conf carries the cluster-wide controlPlaneEndpoint -- the multi-value ctrp A record
# holding every master's address -- so an unpinned `kubectl get --raw=/readyz` asked "can SOMEONE
# serve?" and came back rc 0 on every master as long as any one of them was healthy. The election
# then always picked groups['masters'][0], the exact positional behaviour this file exists to
# replace, and did it while reporting that it had probed. 127.0.0.1 under `delegate_to: {{ item }}`
# is that node's own apiserver, which is the question the header asks. Same reasoning, and the same
# pin, as master-node-rotation/remove-single-master.yaml and common/tasks/collect-node-lists.yaml;
# certSANs already carries 127.0.0.1, so the existing certificate covers it.
#
# On a fresh cluster no apiserver is up yet, so nothing answers and this falls back to
# groups['masters'][0] - the bootstrap behaviour, unchanged.
#
# Elected once per run: the election is gated on the `orchestrator` group not existing yet, and it
# publishes that group itself, so later plays and serial batches adopt the elected node instead of
# re-probing and the orchestrator cannot flap mid-operation.
#
# The gate is the group and not `orchestrator_node is not defined` (#486). The election tasks are
# `run_once`, and `run_once` evaluates its `when` on the play's first host only, while the fact it
# sets reaches just the hosts of the play that set it. A play mixing masters (elected on earlier)
# with workers (not) therefore skipped the whole election whenever the first host happened to be a
# master, and left every worker in the play with `orchestrator_node` undefined - the sync play in
# sync-resources.yaml, exactly. `groups` is global, so gating on the group is the same answer on
# every host, and the adopt task below hands the fact to whichever hosts are missing it.

- name: Probe each control-plane node for apiserver readiness
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      export KUBECONFIG=/etc/kubernetes/admin.conf
      kubectl --server https://127.0.0.1:6443 --request-timeout=10s get --raw='/readyz'
    executable: /bin/bash
  # Bounded: an unreachable or wedged apiserver has to answer "not this one" quickly, because this
  # loop runs once per master before anything else in the run can start.
  delegate_to: "{{ item }}"
  loop: "{{ groups['masters'] }}"
  register: control_plane_probe
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  # read-only, so run it under --check too. without this the probe is skipped during a dry run
  # and the election silently falls back to groups['masters'][0] instead of the real one.
  check_mode: false
  run_once: true
  when: groups['orchestrator'] is not defined
  tags: always

- name: Set the orchestrator to the first healthy control-plane node
  ansible.builtin.set_fact:
    orchestrator_node: >-
      {{ control_plane_probe.results
         | selectattr('rc', 'defined')
         | selectattr('rc', 'equalto', 0)
         | map(attribute='item')
         | list
         | first
         | default(groups['masters'][0], true) }}
  run_once: true
  when: groups['orchestrator'] is not defined
  tags: always

# Publishing the group here rather than only in playbooks/elect-orchestrator.yaml keeps the
# election single-shot for every entry point: a role that includes this file directly (the master
# and worker roles both do) elects at most once per run too, and a `hosts: orchestrator` play in a
# playbook that imported neither still finds its host.
#
# add_host on a host that already exists adds it to the group and leaves its inventory vars --
# ansible_host, ansible_user, the key file -- untouched. check_mode: false for the same reason as
# the probe: without it a dry run publishes no group and re-elects in every play.
- name: Publish the elected node as the orchestrator group
  ansible.builtin.add_host:
    name: "{{ orchestrator_node }}"
    groups: orchestrator
  run_once: true
  changed_when: false
  check_mode: false
  when: groups['orchestrator'] is not defined
  tags: always

# The hosts the election did not reach: every host of a play that ran after the electing one, and
# every host of a later serial batch. Not run_once - this is per-host by definition.
- name: Adopt the elected orchestrator on this host
  ansible.builtin.set_fact:
    orchestrator_node: "{{ groups['orchestrator'] | first }}"
  when:
    - orchestrator_node is not defined
    - groups['orchestrator'] | default([]) | length > 0
  tags: always

- name: Report the selected orchestrator
  ansible.builtin.debug:
    msg: "{{ orchestrator_node }} is the orchestrator for this run"
  run_once: true
  tags: always

# Callers that read registered state off the orchestrator (the node diff, the join token and hash)
# need it to be in the play, because that is where those tasks run. They opt in by setting
# orchestrator_in_play_required, and get one clear message instead of an undefined-variable error
# several tasks later. Callers that only delegate to it do not need this - delegation reaches hosts
# outside the play.
- name: The orchestrator must be part of this run
  ansible.builtin.assert:
    that: orchestrator_node in ansible_play_hosts
    fail_msg: >-
      {{ orchestrator_node }} is not part of this run, but the node diff and the join token are
      read from it. Drop the --limit, or widen it to include a healthy control-plane node.
  when: orchestrator_in_play_required | default(false) | bool
  run_once: true
  tags: always
