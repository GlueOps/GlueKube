---
# apply-calico-firewall.yaml creates one HostEndpoint per loadbalancer node, named after the node
# (calico-hostendpoint.yaml.j2: metadata.name == spec.node), and nothing ever deleted them, so a
# scaled-down loadbalancer node left its HostEndpoint behind.
#
# Only HostEndpoints that follow that naming are considered, so anything not made by GlueKube
# (a hand-made HostEndpoint, Calico's own "<node>-auto-hep") is never touched. Of those, one goes
# when its node is being removed by this sync, or when its node is no longer in the cluster at all
# -- the second catches the ones left by earlier syncs, which no later nodes_to_remove names again
# because the node is already gone. The first is still needed: until the VM is destroyed its
# kubelet can re-register the node that scale-down just deleted.

# Every call is pinned to this node's own apiserver. admin.conf points at ctrp, which right after
# a scale-down or join can land on a master whose aggregated projectcalico.org API answers
# ServiceUnavailable; 127.0.0.1 is in certSANs (same pin as select-orchestrator.yaml).
#
# The cleanup is cosmetic and must never fail the sync: a failed sync reruns as in-sync and skips
# the firewall play that gives new loadbalancer nodes their HostEndpoints. So a Calico API that
# stays down only warns, and whatever is left over goes on the next sync, which runs this again
# (sync-resources.yaml runs it on every sync, in-sync ones included).
- name: Read the Calico HostEndpoints
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      export KUBECONFIG=/etc/kubernetes/admin.conf
      kubectl --server https://127.0.0.1:6443 --request-timeout=30s get hostendpoints.projectcalico.org -o json
    executable: /bin/bash
  register: master_hostendpoints
  changed_when: false
  failed_when: false
  retries: 10
  delay: 15
  until: master_hostendpoints.rc == 0
  # read-only; without this a sync-resources --check run fails here, as this play runs every sync
  check_mode: false

- name: Warn that the HostEndpoints could not be read
  ansible.builtin.debug:
    msg: >-
      Skipping HostEndpoint cleanup, the Calico API did not answer:
      {{ master_hostendpoints.stderr | default('') | trim }}.
      Stale HostEndpoints will be cleaned up on a later sync.
  when: master_hostendpoints.rc != 0

# Unlike the read above this one stays fatal: an empty answer would make every HostEndpoint look
# orphaned, so it fails rather than guess.
- name: Read the cluster's nodes
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      export KUBECONFIG=/etc/kubernetes/admin.conf
      kubectl --server https://127.0.0.1:6443 --request-timeout=30s get nodes --no-headers -o custom-columns=':metadata.name'
    executable: /bin/bash
  register: master_hostendpoint_cluster_nodes
  changed_when: false
  retries: 10
  delay: 15
  until: master_hostendpoint_cluster_nodes.rc == 0
  failed_when: >-
    master_hostendpoint_cluster_nodes.rc != 0 or
    master_hostendpoint_cluster_nodes.stdout_lines | select | list | length == 0
  check_mode: false
  when: master_hostendpoints.rc == 0

# A HostEndpoint stays only if its node is in the cluster and not being removed by this sync.
- name: Select the HostEndpoints of nodes that are gone
  ansible.builtin.set_fact:
    master_hostendpoints_to_delete: >-
      {{ master_hostendpoints.stdout | from_json
         | community.general.json_query('items[?metadata.name == spec.node].metadata.name')
         | reject('in', master_hostendpoint_nodes_to_keep)
         | sort | list }}
  vars:
    master_hostendpoint_nodes_to_keep: >-
      {{ master_hostendpoint_cluster_nodes.stdout_lines | map('trim') | select
         | difference(master_hostendpoint_nodes_to_remove | default([])) }}
  when: master_hostendpoints.rc == 0

- name: Delete the HostEndpoints of nodes that are gone
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      export KUBECONFIG=/etc/kubernetes/admin.conf
      kubectl --server https://127.0.0.1:6443 --request-timeout=30s delete hostendpoints.projectcalico.org {{ item }} --ignore-not-found
    executable: /bin/bash
  loop: "{{ master_hostendpoints_to_delete | default([]) }}"
  register: master_hostendpoints_deleted
  retries: 10
  delay: 15
  until: master_hostendpoints_deleted.rc == 0
  changed_when: "'deleted' in master_hostendpoints_deleted.stdout"
  failed_when: false

- name: Warn that some HostEndpoints could not be deleted
  ansible.builtin.debug:
    msg: >-
      Could not delete HostEndpoints {{ master_hostendpoint_delete_failures }};
      they will be cleaned up on a later sync.
  vars:
    master_hostendpoint_delete_failures: >-
      {{ master_hostendpoints_deleted.results | default([])
         | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | list }}
  when: master_hostendpoint_delete_failures | length > 0
