# --patches for the same reason as roles/worker/tasks/upgrade.yaml: kubeadm does not persist the
# patches directory in the cluster, so `kubeadm upgrade node` without it rewrites
# /var/lib/kubelet/config.yaml from the cluster-wide kubelet-config ConfigMap and discards the
# per-node reservations this control-plane node joined with (#448, #449).
- name: Render the per-node kubelet patch
  ansible.builtin.import_tasks: render-kubelet-patch.yaml
  tags: upgrade

- name: Upgrading {{ inventory_hostname }}
  ansible.builtin.command: kubeadm upgrade node --patches /etc/kubernetes/patches
  tags: upgrade

- name: Generate Kubeadm configuration
  ansible.builtin.template:
    src: "kubeadm-stacked-config.yaml.j2"
    dest: "{{ kubeadm_config_file }}"
    owner: root
    group: root
    mode: "0644"
  tags: upgrade
