- name: Create local-path-provisioner values file
  ansible.builtin.template:
    src: local-path-provisioner-values.yaml.j2
    dest: /opt/kubernetes/local-path-provisioner-values.yaml
    mode: "0644"
  tags: install_local-path-provisioner

- name: Deploy local-path-provisioner with Helm
  kubernetes.core.helm:
    name: local-path-provisioner
    chart_ref: local-path-provisioner
    chart_version: 0.0.30
    chart_repo_url: https://charts.containeroo.ch
    release_namespace: local-path-storage
    create_namespace: true
    values_files:
      - /opt/kubernetes/local-path-provisioner-values.yaml
    kubeconfig: /etc/kubernetes/admin.conf
    wait: true
    # default_check only compares the chart and values against helm's own release record, never
    # against the cluster, so a caller that deleted the resources has to ask for the reconcile
    force: "{{ lpp_helm_force | default(false) | bool }}"
  tags: install_local-path-provisioner
