---
# The rotation diff. It shares its node lists with the sync diff (#474) but deliberately computes
# nodes_to_remove differently: a rotation replaces the whole control plane, so every node the
# cluster currently holds is a removal candidate and rotate-nodes.yaml narrows that to the masters
# and drops the orchestrator. Only nodes_to_add is a real inventory-vs-cluster diff.
#
# Keep this asymmetry in mind before merging the two files further -- they are not the same
# operation, which is why only the list-building half is shared.

- name: Collect the inventory and cluster node lists
  ansible.builtin.import_tasks: ../../../common/tasks/collect-node-lists.yaml

- name: Register current master nodes for removal(filter for master nodes will applied alter)
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl get nodes -o json | jq -c '[.items[].metadata.name] | sort'
  args:
    executable: /bin/bash
  register: nodes_to_remove
  changed_when: false


- name: Register master nodes to replace with above master nodes
  ansible.builtin.command: python3 /opt/kubernetes/compare-to-add.py
  register: nodes_to_add
  changed_when: false

# debug
- name: List of nodes changes
  ansible.builtin.debug:
    msg:
    - "Nodes to remove: {{ nodes_to_remove.stdout }}."
    - "Nodes to add '{{ nodes_to_add.stdout }}'."
