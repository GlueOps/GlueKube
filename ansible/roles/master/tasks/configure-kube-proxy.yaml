---
# Tell an existing cluster's kube-proxy to leave net.netfilter.nf_conntrack_max alone
# (conntrack.maxPerCore: 0), the same as kubeadm-stacked-config.yaml.j2's KubeProxyConfiguration
# does for new clusters. kubeadm only writes the kube-proxy ConfigMap at init, and
# `kubeadm upgrade apply` carries the existing one forward, so clusters built before this setting
# never get it otherwise. Run on the orchestrator from upgrade-cluster.yaml (after the upgrade),
# and from sync-resources.yaml and rotate-master-nodes.yaml (before new nodes join), so a
# rotation-only rollout fixes existing clusters too.
#
# Idempotent: when maxPerCore is already 0 nothing is written and kube-proxy is not restarted.
- name: Set conntrack.maxPerCore to 0 in the kube-proxy ConfigMap
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG=/etc/kubernetes/admin.conf
    out=$(mktemp)
    trap 'rm -f "$out"' EXIT
    kubectl -n kube-system get configmap kube-proxy -o json | python3 -c '
    import json, sys, yaml
    cm = json.load(sys.stdin)
    conf = yaml.safe_load(cm["data"]["config.conf"])
    conntrack = conf.setdefault("conntrack", {}) or {}
    if conntrack.get("maxPerCore") == 0:
        sys.exit(0)
    conntrack["maxPerCore"] = 0
    conf["conntrack"] = conntrack
    cm["data"]["config.conf"] = yaml.safe_dump(conf, default_flow_style=False)
    json.dump(cm, open(sys.argv[1], "w"))
    print("changed")
    ' "$out"
    if [ -s "$out" ]; then
      kubectl replace -f "$out"
      kubectl -n kube-system rollout restart daemonset kube-proxy
      kubectl -n kube-system rollout status daemonset kube-proxy --timeout=600s
    fi
  args:
    executable: /bin/bash
  register: master_kube_proxy_conntrack
  changed_when: "'changed' in master_kube_proxy_conntrack.stdout"
  tags: upgrade
