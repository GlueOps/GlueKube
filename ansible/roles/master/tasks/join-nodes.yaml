- name: List current nodes
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl get nodes --no-headers -o custom-columns=":metadata.name"
  tags: join_nodes
  register: current_cluster_nodes
  changed_when: false
  when: inventory_hostname == orchestrator_node

- name: List of nodes will join the cluster
  ansible.builtin.debug:
    var: inventory_hostname
  when: inventory_hostname in groups['masters'] and inventory_hostname not in hostvars[orchestrator_node]['current_cluster_nodes'].stdout_lines
  tags: join_nodes

- name: Create PKI directory
  ansible.builtin.file:
    path: /etc/kubernetes/pki/
    state: directory
    mode: '0755'
  when: inventory_hostname in groups['masters'] and inventory_hostname not in hostvars[orchestrator_node]['current_cluster_nodes'].stdout_lines

- name: Generate Authentication Configuration
  ansible.builtin.template:
    src: "authentication-configuration.yaml.j2"
    dest: "/etc/kubernetes/pki/authentication-config.yaml"
    owner: root
    group: root
    mode: "0644"
  tags: join_nodes
  when: inventory_hostname in groups['masters'] and inventory_hostname not in hostvars[orchestrator_node]['current_cluster_nodes'].stdout_lines


# Re-render the per-node kubelet patch before the join. `patches.directory` in
# kubeadm-join-config.j2 points here; without the file the join silently falls back to the
# cluster-wide reservations sized from masters[0] (#449).
- name: Render the per-node kubelet patch
  ansible.builtin.import_tasks: render-kubelet-patch.yaml
  tags: join_master
  when: inventory_hostname in groups['masters'] and inventory_hostname not in hostvars[orchestrator_node]['current_cluster_nodes'].stdout_lines


# join_master, not join_worker: this joins a control-plane node. `--tags join_worker` reaching
# the control-plane join was the opposite of what anyone typing it intends -- the worker join
# lives in roles/worker/tasks/join-nodes.yaml and keeps that tag (#476).
- name: Join the control-node to the Kubernetes cluster
  ansible.builtin.command: kubeadm join --config /opt/kubeadm_join.yaml
  tags: join_master
  when: inventory_hostname in groups['masters'] and inventory_hostname not in hostvars[orchestrator_node]['current_cluster_nodes'].stdout_lines


# kubeadm_config, not kubeconfig_setup: this renders the kubeadm ClusterConfiguration, not a
# kubeconfig. kubeadm-init.yaml keeps kubeconfig_setup for the tasks that really do handle
# admin.conf (#476).
- name: Generate Kubeadm configuration
  ansible.builtin.template:
    src: "kubeadm-stacked-config.yaml.j2"
    dest: "{{ kubeadm_config_file }}"
    owner: root
    group: root
    mode: "0644"
  tags: kubeadm_config
  when: 
    - inventory_hostname in groups['masters'] and inventory_hostname not in hostvars[orchestrator_node]['current_cluster_nodes'].stdout_lines
