
- name: Create calico.yaml file
  ansible.builtin.template:
    src: calico.yaml.j2
    dest: /opt/kubernetes/calico.yaml
    mode: "0644"
  tags: install_calico


- name: Create calico global-network-policy.yaml file
  ansible.builtin.template:
    src: calico-global-network-policy.yaml.j2
    dest: /opt/kubernetes/calico-global-network-policy.yaml
    mode: "0644"
  tags: install_calico


- name: Deploy calico with Helm
  kubernetes.core.helm:
    name: calico
    chart_ref: tigera-operator
    chart_version: "{{ calico_chart_version }}"
    chart_repo_url: https://docs.tigera.io/calico/charts
    release_namespace: tigera-operator
    create_namespace: true
    values_files:
      - /opt/kubernetes/calico.yaml
    kubeconfig: /etc/kubernetes/admin.conf
  tags: install_calico


- name: Wait for tigera-operator pod to be ready
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl -n tigera-operator wait --for=condition=Ready pods --all --timeout=30s

  register: tigera_operator_ready
  until: tigera_operator_ready.rc == 0
  retries: 20
  delay: 30
  changed_when: false
  tags: install_calico


# the operator being up only means it can start reconciling, the CNI is not usable before
# calico-node runs on every node, so wait for the daemonset the operator creates
- name: Wait for the tigera operator to create the calico-node daemonset
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl -n calico-system get daemonset calico-node
  register: calico_node_daemonset
  until: calico_node_daemonset.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  tags: install_calico


- name: Wait for calico-node to be ready on all nodes
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl -n calico-system rollout status daemonset/calico-node --timeout=180s
  register: calico_node_ready
  until: calico_node_ready.rc == 0
  retries: 5
  delay: 10
  changed_when: false
  tags: install_calico
