---
# Control-plane node preparation: the shared body (#474) plus the tools a control plane needs.

- name: Prepare the node
  ansible.builtin.import_tasks: ../../common/tasks/prepare-node.yaml

# Created here, unconditionally, rather than only on the node that ran `kubeadm init` (#486).
# /opt/kubernetes is where taint-nodes.yaml drops taint-label-nodes.py, install-addons.yaml
# writes its Helm values, first-node-upgrade.yaml writes upgrade_plan.txt and kubeadm-init.yaml
# keeps the kubeconfig the `fetch` reads. Those plays are now `hosts: orchestrator`, so any
# master is a legal orchestrator -- but the directory only ever existed on the bootstrap node,
# so a run whose elected orchestrator had not been through `kubeadm init` failed at the fetch,
# and `make upgrade-cluster` aborted on a missing /opt/kubernetes/upgrade_plan.txt after a full
# rotation had replaced the original node. file/state=directory is idempotent.
- name: Create the GlueKube state directory
  ansible.builtin.file:
    path: /opt/kubernetes/.kube
    state: directory
    mode: "0755"

# jq is what compare-node.yaml and the etcd checks parse kubectl/etcdctl JSON with.
- name: Install the control-plane CLI dependencies
  ansible.builtin.apt:
    name: jq
    state: present

# install helm

- name: Download Helm binary tarball
  ansible.builtin.get_url:
    url: https://get.helm.sh/helm-v3.18.6-linux-amd64.tar.gz
    dest: /tmp/helm-v3.18.6-linux-amd64.tar.gz
    mode: '0644'

- name: Extract Helm binary
  ansible.builtin.unarchive:
    src: /tmp/helm-v3.18.6-linux-amd64.tar.gz
    dest: /tmp/
    remote_src: true

# This used to be `mv` guarded by `creates: /usr/local/bin/helm`, a path nothing ever writes --
# the binary goes to /usr/bin/helm -- so the guard never fired and the task ran on every pass.
# copy compares checksums, so a converged node reports no change and no sentinel is needed.
- name: Install the Helm binary
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/bin/helm
    remote_src: true
    mode: "0755"

- name: Verify Helm installation
  ansible.builtin.command: helm version
  register: helm_version
  changed_when: false

- name: Show Helm version
  ansible.builtin.debug:
    msg: "{{ helm_version.stdout }}"



# install k9s
- name: Download k9s
  ansible.builtin.get_url:
    url: https://github.com/derailed/k9s/releases/download/v0.32.7/k9s_linux_amd64.deb
    dest: /tmp/k9s.deb
    mode: "0644"
  tags: install_k9s

- name: Install k9s
  ansible.builtin.apt:
    deb: /tmp/k9s.deb
    state: present
  tags: install_k9s


# install etcd
- name: Install etcd-client
  ansible.builtin.apt:
    name: etcd-client
    state: present
  tags: install_etcd
