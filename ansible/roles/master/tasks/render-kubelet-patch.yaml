# Writes the per-node kubelet patch kubeadm merges over the cluster-wide kubelet-config
# ConfigMap (#449). Imported before every control-plane `kubeadm join`, `kubeadm upgrade node`
# and `kubeadm upgrade apply` -- kubeadm reads --patches from disk on each of those and keeps no
# record of the directory between them, so the file has to exist at each call (#448).
- name: Create kubeadm patches directory
  ansible.builtin.file:
    path: /etc/kubernetes/patches
    state: directory
    mode: "0755"

- name: Render kubelet configuration patch
  ansible.builtin.template:
    src: kubeletConfigurationPatch.yaml.j2
    dest: /etc/kubernetes/patches/kubeletconfiguration+merge.yaml
    owner: root
    group: root
    mode: "0644"
