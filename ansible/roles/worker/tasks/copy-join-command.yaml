---
# Worker side of the join: the same shared credentials as the control plane (#474), then the
# worker JoinConfiguration -- which differs from the master one by carrying the containerd
# criSocket and the kubelet patch directory instead of a controlPlane block.

- name: Create the join credentials on the orchestrator
  ansible.builtin.include_role:
    name: common
    tasks_from: create-join-credentials.yaml
  tags: create_join_command

- name: Generate Kubeadm Join configuration
  ansible.builtin.template:
    src: kubeadm-join-config.j2
    dest: /opt/kubeadm_join.yaml
    mode: "0755"
  when: inventory_hostname in groups['workers']
  tags: create_join_command
