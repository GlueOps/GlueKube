---
# list current nodes
- name: List current nodes
  ansible.builtin.shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubectl get nodes --no-headers -o custom-columns=":metadata.name"
  tags: join_worker
  register: current_cluster_nodes
  changed_when: false
  when: inventory_hostname == orchestrator_node

# debug
- name: List of nodes will join the cluster
  ansible.builtin.debug:
    var: inventory_hostname
  when: inventory_hostname in groups['workers'] and inventory_hostname not in hostvars[orchestrator_node]['current_cluster_nodes'].stdout_lines
  tags: join_worker

# reset the nodes before joining
- name: Reset the worker node
  ansible.builtin.command: kubeadm reset -f
  tags: join_worker
  when: inventory_hostname in groups['workers'] and inventory_hostname not in hostvars[orchestrator_node]['current_cluster_nodes'].stdout_lines


# Shared with roles/worker/tasks/upgrade.yaml, which has to re-render the same file because
# kubeadm re-reads --patches from disk on every upgrade and this task is gated on the node not
# already being in the cluster (#448).
- name: Render the per-node kubelet patch
  ansible.builtin.import_tasks: ../../common/tasks/render-kubelet-patch.yaml
  tags: join_worker
  when: inventory_hostname in groups['workers'] and inventory_hostname not in hostvars[orchestrator_node]['current_cluster_nodes'].stdout_lines

- name: Join the worker node to the Kubernetes cluster
  ansible.builtin.command: kubeadm join --config /opt/kubeadm_join.yaml
  tags: join_worker
  when: inventory_hostname in groups['workers'] and inventory_hostname not in hostvars[orchestrator_node]['current_cluster_nodes'].stdout_lines
