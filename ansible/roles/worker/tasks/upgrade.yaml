# --patches is not optional here. The per-node kubeReserved/systemReserved a worker got at join
# time live only in /etc/kubernetes/patches; kubeadm does not persist the directory in the
# cluster. A bare `kubeadm upgrade node` rewrites /var/lib/kubelet/config.yaml from the
# cluster-wide kubelet-config ConfigMap -- sized from masters[0]'s hardware -- and
# upgrade-kubelet.yaml then restarts kubelet onto it. A 32 GiB worker under a 4 GiB masters[0]
# silently drops from reserving 2560Mi to 512Mi and over-commits several GiB from that point on.
# The patch is re-rendered rather than assumed present: the join-time render is gated on the node
# not already being in the cluster, so it never re-runs for an existing node (#448).
- name: Render the per-node kubelet patch
  ansible.builtin.import_tasks: ../../common/tasks/render-kubelet-patch.yaml
  tags: upgrade

- name: Upgrading {{ inventory_hostname }}
  ansible.builtin.command: kubeadm upgrade node --patches /etc/kubernetes/patches
  tags: upgrade
