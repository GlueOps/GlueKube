# Writes the per-node kubelet patch kubeadm merges over the cluster-wide kubelet-config ConfigMap
# (#449). Imported before every `kubeadm join`, `kubeadm upgrade node` and `kubeadm upgrade apply`
# on masters and workers alike -- kubeadm reads --patches from disk on each of those and keeps no
# record of the directory between them, so the file has to exist at each call (#448).
#
# One copy for both roles (#474); the TEMPLATE stays per-role and is deliberately not shared. The
# worker's small-tier systemReserved is higher than the master's (1024Mi vs 512Mi) because workers
# carry more non-kubelet system load -- see the header of
# roles/master/templates/kubeletConfigurationPatch.yaml.j2.
#
# That split is what the src below depends on: a task imported by path keeps the role context of
# the file that imported it, so `kubeletConfigurationPatch.yaml.j2` resolves from
# roles/master/templates/ when the master role imports this and from roles/worker/templates/ when
# the worker role does. roles/common has no templates/ directory and must not grow one holding
# this name, or both roles would silently start rendering it.
- name: Create kubeadm patches directory
  ansible.builtin.file:
    path: /etc/kubernetes/patches
    state: directory
    mode: "0755"

- name: Render kubelet configuration patch
  ansible.builtin.template:
    src: kubeletConfigurationPatch.yaml.j2
    dest: /etc/kubernetes/patches/kubeletconfiguration+merge.yaml
    owner: root
    group: root
    mode: "0644"
