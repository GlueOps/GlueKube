---
# Create the short-lived credentials a node needs to run `kubeadm join`, on the orchestrator.
# The three registers below are read out of hostvars[orchestrator_node] by both
# kubeadm-join-config.j2 templates, which is why they are registered here rather than passed.
#
# This was three near-identical copies -- master/, worker/ and master-node-rotation/ (#474). They
# agreed on these tasks; what differed was which join config each caller rendered afterwards, so
# that part stayed with the callers. The worker copy was also missing the hash task entirely while
# roles/worker/templates/kubeadm-join-config.j2 reads common_join_hash, so a worker run only worked
# because an earlier master play happened to have registered it on the same host.
#
# The tokens are deliberately short-lived (--ttl 10m); a join that starts more than ten minutes
# after this runs needs a fresh pass.
#
# DELIBERATELY UNGATED -- do not add `when: inventory_hostname == orchestrator_node` here (#486).
# Every caller decides for itself which host mints, because the two callers need opposite answers:
#
#   - the steady-state callers (roles/{master,worker}/tasks/copy-join-command.yaml) run per-host
#     across the play, so they carry the gate on their include and it selects the one right host.
#   - the rotation caller (master-node-rotation/add-single-master.yaml) runs under `run_once`, and
#     `run_once` executes the task as the play's FIRST host -- inventory_hostname is
#     groups['masters'][0] for everything nested inside it, however deep. A gate in here would then
#     be asking "is masters[0] the orchestrator?", which is false in exactly the case the election
#     exists for: masters[0] reachable over SSH but its apiserver not answering /readyz. All three
#     tasks would skip, and because `run_once` broadcasts its result to every host in the play,
#     hostvars[orchestrator_node] would hold {skipped: true} rather than being merely absent -- so
#     the kubeadm-join-config templates fail with "'dict object' has no attribute 'stdout'", after
#     prepare-node has dist-upgraded the incoming node and reupload-certs has re-encrypted the
#     cluster's certificate bundle. That caller delegates to the orchestrator instead, which is
#     what puts these commands on the right node.
#
# This gate used to read `== groups['masters'][0]` in the rotation's own deleted copy of this file,
# where it was vacuous: under run_once the evaluating host IS masters[0], so it compared a host to
# itself and never filtered anything. Electing the orchestrator turned that dead condition into a
# live and wrong one.

- name: Print Kubeadm join node command
  ansible.builtin.command: kubeadm token create --print-join-command --ttl 10m
  register: common_join_command
  # Genuinely changes remote state -- it mints a new bootstrap token every run.
  changed_when: true
  tags: create_join_command

- name: Get Join token
  ansible.builtin.command: kubeadm token create --ttl 10m
  register: common_join_token
  # As above: this mints a token, so reporting it as changed is the truthful annotation.
  changed_when: true
  tags: create_join_command

- name: Get Join hash
  ansible.builtin.shell: |
    set -euo pipefail
    openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt \
    | openssl rsa -pubin -outform der 2>/dev/null \
    | openssl dgst -sha256 -hex | sed 's/^.* //'
  args:
    executable: /bin/bash
  register: common_join_hash
  changed_when: false
  tags: create_join_command
