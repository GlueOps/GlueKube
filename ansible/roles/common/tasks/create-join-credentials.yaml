---
# Create the short-lived credentials a node needs to run `kubeadm join`, on the orchestrator.
# The three registers below are read out of hostvars[orchestrator_node] by both
# kubeadm-join-config.j2 templates, which is why they are registered here rather than passed.
#
# This was three near-identical copies -- master/, worker/ and master-node-rotation/ (#474). They
# agreed on these tasks; what differed was which join config each caller rendered afterwards, so
# that part stayed with the callers. The worker copy was also missing the hash task entirely while
# roles/worker/templates/kubeadm-join-config.j2 reads join_hash, so a worker run only worked
# because an earlier master play happened to have registered it on the same host.
#
# The tokens are deliberately short-lived (--ttl 10m); a join that starts more than ten minutes
# after this runs needs a fresh pass.

- name: Print Kubeadm join node command
  ansible.builtin.command: kubeadm token create --print-join-command --ttl 10m
  when: inventory_hostname == orchestrator_node
  register: join_command
  tags: create_join_command

- name: Get Join token
  ansible.builtin.command: kubeadm token create --ttl 10m
  when: inventory_hostname == orchestrator_node
  register: join_token
  tags: create_join_command

- name: Get Join hash
  ansible.builtin.shell: |
    set -euo pipefail
    openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt \
    | openssl rsa -pubin -outform der 2>/dev/null \
    | openssl dgst -sha256 -hex | sed 's/^.* //'
  args:
    executable: /bin/bash
  when: inventory_hostname == orchestrator_node
  register: join_hash
  changed_when: false
  tags: create_join_command
