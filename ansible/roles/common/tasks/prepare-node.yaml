---
# hostvars[node_to_add | default(inventory_hostname)], not the bare fact (#486). The rotation
# reaches this file through add-single-master.yaml's `delegate_to: {{ node_to_add }}` inside a
# run_once block, and delegation moves where a task EXECUTES, not which host's facts a bare
# `ansible_*` name resolves to -- that stays the play host, groups['masters'][0]. A bare
# ansible_swaptotal_mb therefore asked "does the OUTGOING master have swap" while swapoff ran on
# the incoming one, so a rotated-in node with /swap.img in fstab kept swap on and its kubelet
# refused to start. kubeadm-join-config.j2 already uses this form for the same reason.
# In the steady-state path node_to_add is undefined and this is the play host, unchanged.
- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false
  when: hostvars[node_to_add | default(inventory_hostname)]['ansible_swaptotal_mb'] | default(0) | int > 0

# swapoff only lasts until the next boot. kubelet has failSwapOn true by default and
# kubeadm-stacked-config.yaml.j2 does not override it, so a node that reboots with swap back
# on from fstab comes up NotReady and stays there until someone re-runs the playbook.
- name: Disable swap permanently in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\s]\S*\s+\S+\s+swap\s+.*)$'
    replace: '# \1'

# persistent: present writes /etc/modules-load.d/ so the modules survive a reboot. This has
# to stay ahead of the sysctl task below: with br_netfilter unloaded the net.bridge.* keys do
# not exist, and systemd-sysctl fails to apply them at boot in a way that looks like a CNI bug.
- name: Load required kernel modules persistently
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - overlay
    - br_netfilter

- name: Apply Kubernetes sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    sysctl_set: true
    reload: true
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    # only ends up set today as a side effect of installing docker-ce
    - { name: net.ipv4.ip_forward, value: "1" }
    - { name: vm.swappiness, value: "0" }

# these used to be written to /etc/sysctl.conf. drop them there so the values are not defined
# in two files with no ordering guarantee between them.
- name: Remove the superseded sysctl entries from /etc/sysctl.conf
  ansible.posix.sysctl:
    name: "{{ item }}"
    sysctl_file: /etc/sysctl.conf
    state: absent
    reload: false
  loop:
    - net.bridge.bridge-nf-call-iptables
    - vm.swappiness

# Before the cache update, which a bad key would fail.
- name: Install the apt signing keys
  ansible.builtin.import_role:
    name: apt_keys

- name: Point the Ubuntu apt sources at the mirror
  ansible.builtin.import_role:
    name: apt_sources

- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  register: common_apt_cache
  retries: 5
  delay: 10
  until: common_apt_cache is succeeded

# apt gives up on the first HTTP error for a file (e.g. one lagging upstream address), so downloads retry.
- name: Upgrade all installed packages
  ansible.builtin.apt:
    upgrade: dist
  register: common_dist_upgrade
  retries: 5
  delay: 10
  until: common_dist_upgrade is succeeded

- name: Install dependencies for containerd
  ansible.builtin.apt:
    name:
      - software-properties-common
      - gpg
      - curl
      - apt-transport-https
      - ca-certificates
    state: present
  register: common_containerd_deps
  retries: 5
  delay: 10
  until: common_containerd_deps is succeeded

# The mirror proxies one Docker suite per codename (docker-ubuntu-jammy, -noble, -resolute,
# docker-debian-bookworm, -trixie), so a codename outside that set is a 404 here. preflight.yaml
# asserts the codename up front for exactly that reason.
- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
      https://repo.gpkg.io/repository/docker-{{ ansible_distribution | lower }}-{{ ansible_distribution_release }} {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install containerd
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  register: common_containerd_packages
  retries: 5
  delay: 10
  until: common_containerd_packages is succeeded

- name: Add Docker group
  ansible.builtin.group:
    name: docker
    state: present

- name: Add user to Docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Enable and start Docker services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - docker.service
    - containerd.service

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Generate containerd default configuration
  ansible.builtin.command: containerd config default
  register: common_containerd_config
  changed_when: false          # reading defaults changes nothing


- name: Write containerd config with SystemdCgroup enabled
  ansible.builtin.copy:
    content: "{{ common_containerd_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') | regex_replace('registry\\.k8s\\.io/pause', 'k8s.repo.gpkg.io/pause') }}"
    dest: /etc/containerd/config.toml
    mode: "0644"
  register: common_containerd_config_file

# Restarted inline rather than through a notified handler. The master rotation path includes
# this file with delegate_to the new node, and handlers do not inherit delegation: the restart
# would run against the play host (an existing, already-configured master) while the new node
# keeps serving the packaged config.toml, which ships disabled_plugins = ["cri"]. kubeadm join
# then fails preflight with 'unknown service runtime.v1.RuntimeService'. A regular task carries
# the delegation, so the restart lands on the node whose config just changed.
#
# This is also why the worker copy's notify + flush_handlers pair did not survive the merge:
# it works for a plain worker play and silently does the wrong thing under delegation.
- name: Reload systemd and enable containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: "{{ 'restarted' if common_containerd_config_file is changed else 'started' }}"
    daemon_reload: true

- name: Add Kubernetes repository via Nexus
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://repo.gpkg.io/repository/kubernetes-{{ kubernetes_version.split('.')[0] }}-{{ kubernetes_version.split('.')[1] }} /
    filename: nexus-kubernetes
    state: present
  tags:
    - kubernetes_component_kubeadm
    - kubernetes_component_kubelet

- name: Add Helm repository via Nexus
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/helm-apt-keyring.gpg]
      https://repo.gpkg.io/repository/helm-apt any main
    filename: nexus-helm
    state: present

- name: Install kubeadm {{ kubernetes_package_version }}
  ansible.builtin.apt:
    name:
      - kubeadm={{ kubernetes_package_version }}
    state: present
    allow_unauthenticated: true
    allow_change_held_packages: true
    allow_downgrade: true
  register: common_kubeadm_package
  retries: 5
  delay: 10
  until: common_kubeadm_package is succeeded
  tags: kubernetes_component_kubeadm

# Held immediately after the pinned install, not only in the upgrade path. Without this,
# the dist-upgrade above bumps kubelet to the newest version in the repo and the pinned
# install downgrades it back -- two package swaps per run on a live node -- and
# unattended-upgrades can move kubelet underneath the cluster between runs. apt honours
# dpkg holds, so the hold is what actually stops both. The installs above set
# allow_change_held_packages, so a deliberate version change still applies.
- name: Hold kubeadm at the pinned version
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: hold
  tags: kubernetes_component_kubeadm

- name: Install kubelet and kubectl {{ kubernetes_package_version }}
  ansible.builtin.apt:
    name:
      - kubelet={{ kubernetes_package_version }}
      - kubectl={{ kubernetes_package_version }}
    state: present
    allow_unauthenticated: true
    allow_change_held_packages: true
    allow_downgrade: true
  register: common_kubelet_packages
  retries: 5
  delay: 10
  until: common_kubelet_packages is succeeded
  tags: kubernetes_component_kubelet

- name: Hold kubelet and kubectl at the pinned version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubectl
  tags: kubernetes_component_kubelet

# Same reason as the containerd restart above: a notified handler would run against the play
# host instead of the delegated new node during a master rotation, so restart inline when the
# kubelet package actually moved.
- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
    state: "{{ 'restarted' if (common_kubelet_packages is defined and common_kubelet_packages is changed) else 'started' }}"
    daemon_reload: true
  tags: kubernetes_component_kubelet
