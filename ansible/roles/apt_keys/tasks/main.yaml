---
# Copies the apt signing keys the Dockerfile fetched into /opt/gluekube/apt-keys, replacing any
# stale or broken keyring.

- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# Readable by _apt, which apt verifies signatures as.
- name: Install the apt signing keys
  ansible.builtin.copy:
    src: "/opt/gluekube/apt-keys/{{ item.name }}.gpg"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { name: docker, dest: /etc/apt/keyrings/docker.gpg }
    - { name: kubernetes, dest: /etc/apt/keyrings/kubernetes-apt-keyring.gpg }
    - { name: helm, dest: /etc/apt/keyrings/helm-apt-keyring.gpg }
  loop_control:
    label: "{{ item.name }}"

# The CRIU PPA's key, for roles/common/tasks/live-migration.yaml. Separate and gated so that a
# controller whose /opt/gluekube/apt-keys predates this key still prepares every cluster that
# does not opt in.
- name: Install the CRIU PPA signing key
  ansible.builtin.copy:
    src: /opt/gluekube/apt-keys/criu.gpg
    dest: /etc/apt/keyrings/criu.gpg
    owner: root
    group: root
    mode: "0644"
  when: live_migration_enabled | default(false) | bool
