---
driver:
  name: default

provisioner:
  name: ansible
  log: true
  inventory:
    links:
      # The BASTION, not the cluster. create.yml writes this file with the one host molecule can
      # reach; the cluster inventory is written onto the bastion and never exists locally.
      hosts: inventory/hosts.yaml
      # Still the cluster's group_vars: the remote runs read them from the shipped tree, and
      # against this bastion-only inventory they are inert.
      group_vars: inventory/group_vars
  playbooks:
    side_effect: side_effect/default.yaml


scenario:
  name: defrag-etcd
  # `make defrag-etcd` end to end, against three masters so there is a leader to leave until last.
  # Every step past `create` runs on the bastion -- see the wrappers in remote/, and converge.yml
  # and verify.yml.
  test_sequence:
    - create
    - side_effect remote/test_nodes_pingable.yml
    - converge
    - side_effect remote/test_cluster_healthy.yml
    # A fresh db has nothing to reclaim; this leaves >=150MB free inside it on every member.
    - side_effect remote/bloat_etcd.yml
    - side_effect remote/defrag_etcd.yml
    - side_effect remote/test_etcd_defragmented.yml
    # Every member under the skip threshold now, so a re-run must change nothing.
    - side_effect remote/defrag_etcd_again.yml
    # The cluster itself survived: every node Ready and the full etcd membership.
    - verify
    - destroy

verifier:
  name: ansible
