---
# Puts an etcdctl >= 3.5 on every master for the NOSPACE steps.
#
# The nodes boot noble, whose apt etcd-client is 3.4, and 3.4's `endpoint health` never looks at
# alarms. The bug the NOSPACE test exists for -- the health gates failing on "Active Alarm(s):
# NOSPACE" -- only shows on 3.5+, the client resolute ships, so on 3.4 the test would pass with the
# bug present. The etcd static pod's image carries a client of its server's own version: it is
# copied out through /proc/<pid>/root and installed in /usr/local/bin, which sudo's secure_path
# puts ahead of the apt one in /usr/bin. restore_quota.yaml removes it.
- name: Borrow etcdctl from the etcd pod
  hosts: masters
  become: true
  gather_facts: false
  tasks:
    - name: Copy etcdctl out of the running etcd container
      ansible.builtin.shell: |
        set -euo pipefail
        crictl() { command crictl --runtime-endpoint unix:///var/run/containerd/containerd.sock "$@"; }
        id=$(crictl ps --name '^etcd$' --state running -q | head -n1)
        test -n "$id"
        pid=$(crictl inspect "$id" | jq -r '.info.pid')
        install -m 0755 "/proc/$pid/root/usr/local/bin/etcdctl" /usr/local/bin/etcdctl
      args:
        executable: /bin/bash
      changed_when: true

    - name: Read which etcdctl a become shell runs, and its version
      ansible.builtin.shell: |
        set -euo pipefail
        command -v etcdctl
        etcdctl version | sed -n 's/^etcdctl version: //p'
      args:
        executable: /bin/bash
      register: borrowed_etcdctl
      changed_when: false

    - name: The borrowed etcdctl is the one in use, and it checks alarms
      ansible.builtin.assert:
        that:
          - borrowed_etcdctl.stdout_lines[0] == '/usr/local/bin/etcdctl'
          - borrowed_etcdctl.stdout_lines[1] is version('3.5.0', '>=')
        fail_msg: >-
          Expected /usr/local/bin/etcdctl >= 3.5 to win over the apt client, got
          {{ borrowed_etcdctl.stdout_lines }}
        success_msg: "etcdctl {{ borrowed_etcdctl.stdout_lines[1] }} at {{ borrowed_etcdctl.stdout_lines[0] }}"
