---
# Builds a molecule scenario's nodes on Proxmox VE and works out their addresses.
#
# Imported by every scenario's create.yml with
#   ansible.builtin.import_tasks: ../common/proxmox-provision.yml
# after `vars_files: [../common/proxmox-vars.yml]`. This file was extracted from
# test-cluster/create.yml once all three scenarios moved off Hetzner -- it is the same code that
# scenario was running, not a reimplementation.
#
# Required from the importing play:
#   num_master_nodes / num_worker_nodes   how many of each to build
#   snippet_prefix                        namespaces the cloud-init files and tags the VMs
#   pve_vmid_offset                       0 / 100 / 200, keeps the scenarios' vmids disjoint
#
# What it leaves behind for the scenario to build inventories from:
#   cluster_nodes           [{name, vmid, role}] for every node, masters first
#   master_nodes_list       the master subset, in name order
#   worker_nodes_list       the worker subset, in name order
#   node_public_addresses   {name: net0 address}  -- what molecule SSHes to
#   node_lan_addresses      {name: net1 address}  -- what the cluster binds to
#
# Auth comes from the environment and is never written here: community.proxmox reads
# PROXMOX_HOST, PROXMOX_USER, PROXMOX_TOKEN_ID, PROXMOX_TOKEN_SECRET and PROXMOX_VALIDATE_CERTS
# itself, which is why no module below passes api_* parameters. The ansible.builtin.uri calls
# cannot use that fallback and rebuild the token header from the same variables.
#
# Prerequisites on the cluster, none of which this file creates:
#   - an Ubuntu 24.04 cloud image on a storage's "import" content type ($PROXMOX_IMPORT_FROM).
#     The nodes are built from it directly; there is no template to clone. The cloud-init drive
#     is attached here (ide2) -- without one, cicustom and ipconfig0 are accepted and then
#     silently ignored.
#   - a storage with the "snippets" content type ($PROXMOX_SNIPPET_STORAGE)
#   - SSH access to the PVE host. The API's storage upload endpoint does not accept snippets, so
#     the cloud-init files have to be written to the hypervisor directly.
#   - the datacenter firewall switched on (asserted below, never set here)
#   - two bridges with DHCP on each: $PROXMOX_BRIDGE_PUBLIC carries net0, the address molecule
#     SSHes to and the only NIC that is filtered; $PROXMOX_BRIDGE_LAN carries net1, which is what
#     the cluster itself runs on. $PROXMOX_LAN_CIDR is what tells the two leases apart.

- name: Required Proxmox variables are set
  ansible.builtin.assert:
    that:
      - pve_api_host | length > 0
      - pve_node | length > 0
      - pve_token_id | length > 0
      - pve_token_secret | length > 0
      - pve_lan_cidr | length > 0
    fail_msg: >-
      PROXMOX_HOST, PROXMOX_NODE, PROXMOX_TOKEN_ID, PROXMOX_TOKEN_SECRET and PROXMOX_LAN_CIDR
      must all be set. See ansible/molecule/readme.md. Failing here beats failing inside a
      module with "api_host is required" after some of the VMs already exist -- and, for the
      CIDR, beats building them all and then finding no address can be classified.
    quiet: true

# Both of these fail with the candidates listed rather than letting the create call answer with a
# bare "storage does not exist" or an import error, and both run before anything is written to
# the hypervisor, so a wrong value costs two API calls.
- name: Read the node's storage list
  ansible.builtin.uri:
    url: "{{ pve_api_url }}/nodes/{{ pve_node }}/storage"
    method: GET
    headers: "{{ pve_auth_header }}"
    validate_certs: "{{ pve_validate_certs }}"
    return_content: true
  register: node_storage

- name: The configured storages exist
  ansible.builtin.assert:
    that:
      - pve_storage in storage_names
      - pve_import_storage in storage_names
      - pve_snippet_storage in storage_names
    fail_msg: >-
      One of PROXMOX_STORAGE={{ pve_storage }}, the import volume's storage
      ({{ pve_import_storage }}) or PROXMOX_SNIPPET_STORAGE={{ pve_snippet_storage }} is not on
      node {{ pve_node }}. Storages found: {{ storage_names | join(', ') }}.
    quiet: true
  vars:
    storage_names: "{{ node_storage.json.data | map(attribute='storage') | list }}"

# cicustom takes a VOLUME id (storage:snippets/file), not a path, and PVE only resolves one if
# the storage carries the "snippets" content type. Without it the file is written to the
# hypervisor happily and then every VM refuses to start with "volume ... does not exist" --
# which is what happened before this check existed, six times over, after the VMs were built.
- name: Read the snippet storage's configuration
  ansible.builtin.uri:
    url: "{{ pve_api_url }}/storage/{{ pve_snippet_storage }}"
    method: GET
    headers: "{{ pve_auth_header }}"
    validate_certs: "{{ pve_validate_certs }}"
    return_content: true
  register: snippet_storage_cfg

- name: The snippet storage accepts snippets
  ansible.builtin.assert:
    that:
      - "'snippets' in (snippet_storage_cfg.json.data.content | default('') | split(','))"
    fail_msg: >-
      Storage {{ pve_snippet_storage }} does not have the "snippets" content type, so cicustom
      cannot reference the cloud-init files. It currently allows:
      {{ snippet_storage_cfg.json.data.content | default('nothing') }}. Add it once with
      `pvesm set {{ pve_snippet_storage }} --content
      {{ snippet_storage_cfg.json.data.content | default('') }},snippets`.
    quiet: true

# The API reports where the storage keeps its files; the snippets live in a subdirectory of it.
# Deriving this beats assuming /var/lib/vz.
- name: Resolve the snippet directory
  ansible.builtin.set_fact:
    pve_snippet_dir: >-
      {{ pve_snippet_dir_override
         | default((snippet_storage_cfg.json.data.path | default('/var/lib/vz')) ~ '/snippets', true) }}

- name: Read the import volumes
  ansible.builtin.uri:
    url: "{{ pve_api_url }}/nodes/{{ pve_node }}/storage/{{ pve_import_storage }}/content?content=import"
    method: GET
    headers: "{{ pve_auth_header }}"
    validate_certs: "{{ pve_validate_certs }}"
    return_content: true
  register: import_volumes

- name: The cloud image to import exists
  ansible.builtin.assert:
    that:
      - pve_import_from in import_volids
    fail_msg: >-
      PROXMOX_IMPORT_FROM={{ pve_import_from }} is not an import volume on
      {{ pve_import_storage }}. Found: {{ import_volids | join(', ') | default('none', true) }}.
      Upload an Ubuntu 24.04 cloud image to that storage's "import" content type, or point
      PROXMOX_IMPORT_FROM at one of the above.
    quiet: true
  vars:
    import_volids: "{{ import_volumes.json.data | map(attribute='volid') | list }}"

# The per-VM ruleset further down only takes effect if the datacenter firewall is on. Turning it
# on is deliberately NOT done here: it is hypervisor-wide state shared with every other VM on the
# cluster, and enabling it applies a default-DROP input policy that can lock you out of unrelated
# guests and of the PVE host itself. Assert, and let a human do it once.
#
# Asserting rather than warning is the point. Writing rules that silently do nothing is exactly
# the failure this replaced: the code claimed the nodes were firewalled while 2381, 6443, 10250
# and every NodePort sat open on a public address (#508, #437).
- name: Read the datacenter firewall options
  ansible.builtin.uri:
    url: "{{ pve_api_url }}/cluster/firewall/options"
    method: GET
    headers: "{{ pve_auth_header }}"
    validate_certs: "{{ pve_validate_certs }}"
    return_content: true
  register: cluster_firewall

- name: The datacenter firewall is enabled
  ansible.builtin.assert:
    that:
      - cluster_firewall.json.data.enable | default(0) | int == 1
    fail_msg: >-
      The datacenter firewall is off, so the per-VM rules this playbook creates would do nothing
      and the test nodes would be wide open on a public address. Turn it on once at
      Datacenter -> Firewall -> Options, or `pvesh set /cluster/firewall/options --enable 1`.
      Read your default policies before you do: enabling it applies a default-DROP input policy
      cluster-wide, and the PVE host's own management port is subject to it.
    quiet: true

# One list, used by every loop below and rebuilt identically in proxmox-teardown.yml.
- name: Build the master node list
  ansible.builtin.set_fact:
    cluster_nodes: >-
      {{ cluster_nodes | default([])
         + [{'name': 'master-node-' ~ (item + 1),
             'vmid': (pve_vmid_base | int) + item + 1,
             'role': 'master'}] }}
  loop: "{{ range(0, num_master_nodes) | list }}"

- name: Add the worker nodes to the list
  ansible.builtin.set_fact:
    cluster_nodes: >-
      {{ cluster_nodes
         + [{'name': 'worker-node-' ~ (item + 1),
             'vmid': (pve_vmid_base | int) + 10 + item + 1,
             'role': 'worker'}] }}
  loop: "{{ range(0, num_worker_nodes) | list }}"

# Split once here so the inventory templates can slice them -- master_nodes_list[:1] is the
# direct replacement for the Hetzner scenarios' master_nodes.results[:1].
- name: Split the node list by role
  ansible.builtin.set_fact:
    master_nodes_list: "{{ cluster_nodes | selectattr('role', 'equalto', 'master') | list }}"
    worker_nodes_list: "{{ cluster_nodes | selectattr('role', 'equalto', 'worker') | list }}"

# The hypervisor as an ansible host, so the snippet tasks can delegate_to it. In memory only;
# nothing is written to an inventory file.
- name: Register the Proxmox host for the snippet upload
  ansible.builtin.add_host:
    name: pve_host
    ansible_host: "{{ pve_ssh_host }}"
    ansible_user: "{{ pve_ssh_user }}"
    ansible_ssh_private_key_file: "{{ pve_ssh_key_file | default(omit, true) }}"
    ansible_python_interpreter: /usr/bin/python3
  changed_when: false

- name: Ensure the snippet directory exists
  ansible.builtin.file:
    path: "{{ pve_snippet_dir }}"
    state: directory
    mode: "0755"
  delegate_to: pve_host

# One snippet per node, not one shared file: cicustom user= REPLACES the user-data Proxmox
# generates rather than merging with it, so the hostname qm would normally inject is lost. VMs
# that all carry the image's hostname register as a single Kubernetes node and
# tests/test_cluster_healthy.yaml fails its "every inventory node is present" assert.
#
# The template is addressed through playbook_dir rather than a bare relative path: this task file
# lives in common/, so `cloudinit/...` would be looked for next to *this* file first.
- name: Render a cloud-init snippet for each node
  ansible.builtin.template:
    src: "{{ cloudinit_template | default(playbook_dir ~ '/../common/cloud-init.yaml.j2', true) }}"
    dest: "{{ pve_snippet_dir }}/{{ snippet_prefix }}-{{ item.name }}.yaml"
    mode: "0644"
  vars:
    node_name: "{{ item.name }}"
  delegate_to: pve_host
  loop: "{{ cluster_nodes }}"
  loop_control:
    label: "{{ item.name }}"

# The write above went to a filesystem over SSH; this asks the API whether the node that will run
# the VMs can actually resolve those files as volumes. They are not the same question: `local` is
# node-local storage, so a snippet written on one node is invisible to a VM on another, and the
# VMs then fail to START -- after all of them have been built -- with "volume ... does not exist"
# and nothing pointing at why.
- name: Read the snippet volumes the node can see
  ansible.builtin.uri:
    url: "{{ pve_api_url }}/nodes/{{ pve_node }}/storage/{{ pve_snippet_storage }}/content?content=snippets"
    method: GET
    headers: "{{ pve_auth_header }}"
    validate_certs: "{{ pve_validate_certs }}"
    return_content: true
  register: snippet_volumes

- name: The node can see every snippet
  ansible.builtin.assert:
    that:
      - expected_volids | difference(seen_volids) | length == 0
    fail_msg: >-
      Node {{ pve_node }} cannot see {{ expected_volids | difference(seen_volids) | join(', ') }}.
      They were written to {{ pve_snippet_dir }} on {{ pve_ssh_host }}, and that host reported
      the directory already present. {{ pve_snippet_storage }} on {{ pve_node }} currently holds:
      {{ seen_volids | join(', ') | default('nothing', true) }}.
      A directory storage is node-local, so the usual cause is PROXMOX_HOST (or PROXMOX_SSH_HOST)
      being a different node from PROXMOX_NODE={{ pve_node }} -- point them at the same machine.
      Otherwise {{ pve_snippet_storage }}'s path on this node is not {{ pve_snippet_dir | dirname }};
      set PROXMOX_SNIPPET_DIR to the real one.
    quiet: true
  vars:
    seen_volids: "{{ snippet_volumes.json.data | map(attribute='volid') | list }}"
    expected_volids: >-
      {{ cluster_nodes
         | map(attribute='name')
         | map('regex_replace', '^(.*)$', pve_snippet_storage ~ ':snippets/' ~ snippet_prefix ~ '-\1.yaml')
         | list }}

# Idempotent the same way hetzner.hcloud.server was, just keyed on the vmid rather than the name:
# proxmox_kvm returns changed=false when the vmid already exists. So a create re-run after a
# partial failure picks up where it left off. It also means a *stale* VM on one of our vmids is
# silently adopted -- see the warning at the top of ansible/molecule/readme.md.
#
# Everything is set in this ONE call on purpose. proxmox_kvm silently DROPS net, virtio, ide,
# sata and scsi from an `update: true` call unless update_unsafe is also set -- so configuring
# the NICs in a second pass, the way the clone-based version did, left the nodes with no net1.
- name: Create each node from the cloud image
  community.proxmox.proxmox_kvm:
    node: "{{ pve_node }}"
    vmid: "{{ item.vmid }}"
    name: "{{ item.name }}"
    cores: "{{ pve_cores | int }}"
    cpu: "{{ pve_cpu }}"
    memory: "{{ pve_memory | int }}"
    ostype: l26
    scsihw: virtio-scsi-single
    # UEFI, replicating the Terraform module: q35 + OVMF with its own EFI disk. The efidisk is
    # not optional under OVMF -- without it the firmware has nowhere to persist its boot entries.
    # pre_enrolled_keys=0 leaves Secure Boot off, which is what the stock cloud image expects;
    # the module rejects efidisk0 unless bios is ovmf.
    machine: q35
    bios: ovmf
    # snippet_prefix as a second tag so a leaked VM says which scenario leaked it -- the three
    # scenarios otherwise share PROXMOX_TAGS and are only told apart by their vmid range.
    tags: "{{ (pve_tags | split(',') | map('trim') | select | list) + [snippet_prefix] }}"
    efidisk0:
      storage: "{{ pve_storage }}"
      format: qcow2
      efitype: 4m
      pre_enrolled_keys: 0
    # "1", not "enabled": the module runs this through ansible's boolean() and only converts
    # recognised booleans to the 1/0 the API wants. Anything else is passed through verbatim, so
    # `agent: enabled` reaches PVE as agent=enabled -- which it parses as enabled=enabled and
    # rejects.
    agent: "1"
    onboot: false
    # ":0" is the size: with import-from the disk is created from the image's own virtual size,
    # so the number is ignored. Grown to pve_disk_size by the next task.
    virtio:
      virtio0: "{{ pve_storage }}:0,import-from={{ pve_import_from }},iothread=1,discard=on"
    # The cloud-init drive. Without it cicustom and ipconfig0 are accepted and then silently
    # ignored, and nothing works -- the same trap the template had to avoid.
    ide:
      ide2: "{{ pve_storage }}:cloudinit"
    boot: order=virtio0
    net:
      # firewall=1 is what makes the per-VM ruleset below apply at all -- PVE only filters an
      # interface carrying the flag, and a policy_in of DROP on a VM whose NICs are all unflagged
      # filters nothing.
      net0: "virtio,bridge={{ pve_bridge_public }}{{ public_tag }},firewall=1"
      # No firewall=1 here on purpose. The LAN stays open whatever policy_in the VM firewall is
      # set to, which is what lets etcd, the kubelet and Calico VXLAN talk without a single rule.
      net1: "virtio,bridge={{ pve_bridge_lan }}{{ lan_tag }}"
    # cicustom below replaces only user-data, so Proxmox still builds network-config from these
    # two. That is also why the snippet must not configure networking itself.
    ipconfig:
      ipconfig0: "ip=dhcp"
      ipconfig1: "ip=dhcp"
    cicustom: "user={{ pve_snippet_storage }}:snippets/{{ snippet_prefix }}-{{ item.name }}.yaml"
    timeout: 600
  vars:
    public_tag: "{{ ',tag=' ~ pve_bridge_public_vlan if pve_bridge_public_vlan | length > 0 else '' }}"
    lan_tag: "{{ ',tag=' ~ pve_bridge_lan_vlan if pve_bridge_lan_vlan | length > 0 else '' }}"
  loop: "{{ cluster_nodes }}"
  loop_control:
    label: "{{ item.name }} ({{ item.vmid }})"

# No-op when the disk is already at size, so a re-run stays idempotent.
- name: Grow the root disk
  community.proxmox.proxmox_disk:
    vmid: "{{ item.vmid }}"
    disk: virtio0
    size: "{{ pve_disk_size }}"
    state: resized
  loop: "{{ cluster_nodes }}"
  loop_control:
    label: "{{ item.name }} ({{ pve_disk_size }})"

# Applied before the first boot, not after: a node that comes up unfiltered and is fenced a minute
# later has still been reachable on a public address for that minute.
#
# There is no VM-level firewall-options module in community.proxmox, so this one goes through the
# API directly. dhcp: 1 is NOT optional -- both NICs hold a DHCP lease, and a default-DROP input
# policy without it drops the renewal and the node falls off the network mid-run.
- name: Enable the firewall on each node
  ansible.builtin.uri:
    url: "{{ pve_api_url }}/nodes/{{ pve_node }}/qemu/{{ item.vmid }}/firewall/options"
    method: PUT
    headers: "{{ pve_auth_header }}"
    validate_certs: "{{ pve_validate_certs }}"
    body_format: form-urlencoded
    body:
      enable: 1
      dhcp: 1
      policy_in: DROP
      policy_out: ACCEPT
    status_code: [200]
  loop: "{{ cluster_nodes }}"
  loop_control:
    label: "{{ item.name }}"

# Inbound SSH and nothing else; outbound is unrestricted by the policy_out above, which the nodes
# need for apt, the package mirrors and every image pull.
#
# SSH is the only thing that has to reach a node from off-box: molecule connects over net0 and
# every cluster protocol rides the unfiltered LAN NIC. That is what closes 2381, 6443, 10250 and
# the NodePort range on the public address (#508, #437).
#
# level: vm puts the rules in the VM's own firewall config, so they are deleted with the VM and
# proxmox-teardown.yml has no firewall object to clean up. `pos` is required by PVE -- rules are
# position-indexed, not a set -- and `iface` scopes this to the one filtered NIC, so it keeps
# saying what it means if net1 ever gains firewall=1.
- name: Allow inbound SSH on the public NIC of each node
  community.proxmox.proxmox_firewall:
    level: vm
    vmid: "{{ item.vmid }}"
    state: present
    update: true
    rules:
      - pos: 0
        type: in
        action: ACCEPT
        proto: tcp
        dport: "22"
        iface: net0
        enable: true
        comment: molecule SSH
  loop: "{{ cluster_nodes }}"
  loop_control:
    label: "{{ item.name }}"

- name: Start each node
  community.proxmox.proxmox_kvm:
    node: "{{ pve_node }}"
    vmid: "{{ item.vmid }}"
    state: started
  loop: "{{ cluster_nodes }}"
  loop_control:
    label: "{{ item.name }}"

# Replaces the old blind `pause: seconds: 60`. The nodes take a DHCP lease, so their addresses
# are not known until the guest agent answers -- and the agent is installed by the snippet, so
# this also proves cloud-init ran. proxmox_vm_info fail_json()s while the agent is still down,
# hence ignore_errors alongside until.
- name: Wait for the guest agent to report an address
  community.proxmox.proxmox_vm_info:
    node: "{{ pve_node }}"
    type: qemu
    vmid: "{{ item.vmid }}"
    network: true
  register: vm_net
  ignore_errors: true
  changed_when: false
  # Templated lazily, after the register is set, so it sees this task's own result.
  vars:
    agent_ipv4: >-
      {{ vm_net.proxmox_vms | default([])
         | selectattr('network', 'defined') | map(attribute='network') | flatten
         | rejectattr('name', 'equalto', 'lo')
         | selectattr('ip-addresses', 'defined') | map(attribute='ip-addresses') | flatten
         | selectattr('ip-address-type', 'equalto', 'ipv4') | map(attribute='ip-address')
         | reject('match', '^(127\.|169\.254\.)') | list }}
  # Both leases, not just one: net0 usually comes up first, and stopping there would map a node's
  # public address into `ip` on the run where the LAN lease was a second slower.
  until: >-
    (agent_ipv4 | ansible.utils.ipaddr(pve_lan_cidr) | length) > 0
    and
    (agent_ipv4 | difference(agent_ipv4 | ansible.utils.ipaddr(pve_lan_cidr)) | length) > 0
  retries: 40
  delay: 15
  loop: "{{ cluster_nodes }}"
  loop_control:
    label: "{{ item.name }}"

# Collected once, then split, so the extraction expression lives in exactly one place.
- name: Collect the addresses each agent reported
  ansible.builtin.set_fact:
    node_agent_ipv4: >-
      {{ node_agent_ipv4 | default({}) | combine({item.item.name: (
           item.proxmox_vms | default([])
           | selectattr('network', 'defined') | map(attribute='network') | flatten
           | rejectattr('name', 'equalto', 'lo')
           | selectattr('ip-addresses', 'defined') | map(attribute='ip-addresses') | flatten
           | selectattr('ip-address-type', 'equalto', 'ipv4') | map(attribute='ip-address')
           | reject('match', '^(127\.|169\.254\.)') | list) }) }}
  loop: "{{ vm_net.results }}"
  loop_control:
    label: "{{ item.item.name }}"

# Split by CIDR rather than by interface name: ens18/ens19 is a Proxmox naming convention, not a
# guarantee, and the guest agent gives no hint which NIC an address belongs to. The two tasks are
# separate so a node that got only one of its two leases still lands in the map it did get --
# which is what makes the asserts below able to say which lease is missing.
- name: Map each node to its LAN address (net1)
  ansible.builtin.set_fact:
    node_lan_addresses: "{{ node_lan_addresses | default({}) | combine({item.key: lan | first}) }}"
  vars:
    lan: "{{ item.value | ansible.utils.ipaddr(pve_lan_cidr) }}"
  when: lan | length > 0
  loop: "{{ node_agent_ipv4 | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Map each node to its public address (net0)
  ansible.builtin.set_fact:
    node_public_addresses: "{{ node_public_addresses | default({}) | combine({item.key: public | first}) }}"
  vars:
    public: "{{ item.value | difference(item.value | ansible.utils.ipaddr(pve_lan_cidr)) }}"
  when: public | length > 0
  loop: "{{ node_agent_ipv4 | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# Without this the missing node surfaces much later as an inventory that is quietly one host
# short, or as an AnsibleUndefinedVariable with no host name in it.
- name: Every node reported a public address
  ansible.builtin.assert:
    that:
      - node_public_addresses | default({}) | length == cluster_nodes | length
    fail_msg: >-
      No address outside {{ pve_lan_cidr }} came back for
      {{ cluster_nodes | map(attribute='name') | difference(node_public_addresses | default({}) | list) | sort }}.
      Either the qemu-guest-agent never answered -- so cloud-init did not run; check that ide2
      carries the cloud-init drive, and `qm cloudinit dump <vmid> user` -- or
      {{ pve_bridge_public }} handed out no lease.
    quiet: true

# Split from the assert above because the two failures have completely different causes, and the
# LAN one is almost always a wrong PROXMOX_LAN_CIDR rather than a broken VM.
- name: Every node reported a LAN address
  ansible.builtin.assert:
    that:
      - node_lan_addresses | default({}) | length == cluster_nodes | length
    fail_msg: >-
      No address inside {{ pve_lan_cidr }} came back for
      {{ cluster_nodes | map(attribute='name') | difference(node_lan_addresses | default({}) | list) | sort }}.
      Either PROXMOX_LAN_CIDR does not describe what {{ pve_bridge_lan }} hands out -- compare it
      against `ip -4 addr` on a node -- or that bridge has no DHCP server on it.
    quiet: true

- name: Wait for SSH on every node
  ansible.builtin.wait_for:
    host: "{{ item.value }}"
    port: 22
    timeout: 300
  loop: "{{ node_public_addresses | dict2items }}"
  loop_control:
    label: "{{ item.key }} ({{ item.value }})"
