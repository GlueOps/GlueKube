---
# Removes the domain and record autoglue-create.yml made. Deleted record-first, and 404 is
# accepted so a partially-completed create, or a second destroy, is a no-op rather than a failure.

- name: Check whether create recorded any AutoGlue ids
  ansible.builtin.stat:
    path: ./autoglue-ids.yaml
  register: autoglue_ids_file

- name: Load the AutoGlue ids written by create
  ansible.builtin.include_vars:
    file: ./autoglue-ids.yaml
  when: autoglue_ids_file.stat.exists

- name: Delete the ctrp DNS record via AutoGlue API
  ansible.builtin.uri:
    url: "{{ lookup('env', 'AUTOGLUE_BASE_URL') }}/api/v1/dns/records/{{ autoglue_record_id }}"
    method: DELETE
    headers:
      accept: application/json
      x-org-key: "{{ lookup('env', 'AUTOGLUE_ORG_KEY') }}"
      x-org-secret: "{{ lookup('env', 'AUTOGLUE_ORG_SECRET') }}"
    status_code: [200, 202, 204, 404]
  when:
    - autoglue_ids_file.stat.exists
    - autoglue_record_id | default('') | string | length > 0

- name: Delete the DNS domain via AutoGlue API
  ansible.builtin.uri:
    url: "{{ lookup('env', 'AUTOGLUE_BASE_URL') }}/api/v1/dns/domains/{{ autoglue_domain_id }}"
    method: DELETE
    headers:
      accept: application/json
      x-org-key: "{{ lookup('env', 'AUTOGLUE_ORG_KEY') }}"
      x-org-secret: "{{ lookup('env', 'AUTOGLUE_ORG_SECRET') }}"
    status_code: [200, 202, 204, 404]
  when:
    - autoglue_ids_file.stat.exists
    - autoglue_domain_id | default('') | string | length > 0

- name: Drop the AutoGlue id files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - ./autoglue-ids.yaml
    - ./autoglue-record-id
