---
# Proves the per-VM firewall common/proxmox-provision.yml builds is actually in force, from the
# molecule controller, over each node's public address.
#
# This test exists because the previous claim that these ports were closed lived only in comments,
# and was false for months (#508): kubeadm-stacked-config.yaml.j2 and the top-level readme both
# said the molecule scenarios firewalled etcd's unauthenticated 2381 in their create.yml, while no
# firewall was being built at all. A sentence in a comment cannot fail; this can.
#
# Imported by every scenario's verify.yaml rather than copied into each tests/ directory.
- name: The public NIC answers on SSH and nothing else
  hosts: localhost
  gather_facts: false
  vars:
    # Four of the ports an unfiltered node would answer on, one per thing worth catching:
    #   2381  etcd metrics -- unauthenticated by design, which is what makes it the worst of these
    #   6443  the apiserver
    #   10250 the kubelet
    #   30000 the bottom of the NodePort range
    # Not exhaustive, and not meant to be: this asserts the default-DROP policy is on, and a
    # policy that drops these four is not selectively passing the rest.
    closed_ports: [2381, 6443, 10250, 30000]
  tasks:
    - name: SSH is reachable on every node's public address
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        timeout: 30
      loop: "{{ groups['all'] }}"
      loop_control:
        label: "{{ item }} ({{ hostvars[item].ansible_host }})"

    # state: stopped passes as soon as a connect fails, so a DROPped port costs one connect_timeout
    # and an OPEN one burns the full timeout and then fails -- which is the direction the cost
    # should fall. connect_timeout is trimmed from the default 5 because this runs once per
    # host-port pair.
    - name: Nothing else is reachable on it
      ansible.builtin.wait_for:
        host: "{{ hostvars[item.0].ansible_host }}"
        port: "{{ item.1 }}"
        state: stopped
        connect_timeout: 3
        timeout: 10
      loop: "{{ groups['all'] | product(closed_ports) | list }}"
      loop_control:
        label: "{{ item.0 }}:{{ item.1 }} ({{ hostvars[item.0].ansible_host }})"
