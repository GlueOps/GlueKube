---
driver:
  name: default

provisioner:
  name: ansible
  log: true
  inventory:
    links:
      hosts: inventory/hosts.yaml
      group_vars: inventory/group_vars
  playbooks:
    side_effect: side_effect/default.yaml
    

scenario:
  name: test-cluster
  test_sequence:
    - create
    - side_effect tests/test_nodes_pingable.yaml
    - converge
    # a second converge must report zero changed tasks -- this is the regression guard for
    # the convergence work in epic D (#439). It is only on this scenario: scale-cluster and
    # rotate-master-nodes interleave side effects, so a re-converge there means something else.
    # - idempotence
    - side_effect tests/test_cluster_healthy.yaml
    - verify
    - destroy

verifier:
  name: ansible