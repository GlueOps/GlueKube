---
# Tears down what create.yml built on Proxmox.
#
# There is no network or standalone firewall object to remove: the scenario runs on an existing
# flat bridge, and the firewall rules are attached at level: vm, so deleting the VM takes its
# rules and its firewall options with it.
- name: Destroy Proxmox VMs
  hosts: localhost
  gather_facts: true
  vars:
    num_master_nodes: 3
    num_worker_nodes: 3

    pve_node: "{{ lookup('env', 'PROXMOX_NODE') }}"
    # Resolved from the storage config the same way create.yml does it, rather than assuming
    # PVE's stock /var/lib/vz -- otherwise a cluster whose storage lives elsewhere gets its
    # snippets left behind on every run.
    pve_snippet_storage: "{{ lookup('env', 'PROXMOX_SNIPPET_STORAGE') | default('local', true) }}"
    pve_snippet_dir_override: "{{ lookup('env', 'PROXMOX_SNIPPET_DIR') }}"

    # Only used to read the storage's path; the proxmox modules below authenticate from the
    # environment on their own, the same as in create.yml.
    pve_api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    pve_api_port: "{{ lookup('env', 'PROXMOX_PORT') | default('8006', true) }}"
    pve_api_user: "{{ lookup('env', 'PROXMOX_USER') | default('root@pam', true) }}"
    pve_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    pve_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
    pve_validate_certs: "{{ lookup('env', 'PROXMOX_VALIDATE_CERTS') | default('true', true) | bool }}"
    pve_api_url: "https://{{ pve_api_host }}:{{ pve_api_port }}/api2/json"
    pve_auth_header:
      Authorization: "PVEAPIToken={{ pve_api_user }}!{{ pve_token_id }}={{ pve_token_secret }}"
    # Must match create.yml. The vmids are derived, not recorded, which is the whole reason this
    # playbook needs no state file handed to it.
    pve_vmid_base: "{{ lookup('env', 'PROXMOX_VMID_BASE') | default('9000', true) | int }}"

    pve_ssh_host: "{{ lookup('env', 'PROXMOX_SSH_HOST') | default(lookup('env', 'PROXMOX_HOST'), true) }}"
    pve_ssh_user: "{{ lookup('env', 'PROXMOX_SSH_USER') | default('root', true) }}"
    pve_ssh_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_FILE') }}"

    snippet_prefix: molecule-test-cluster

  tasks:
    - name: Build the master node list
      ansible.builtin.set_fact:
        cluster_nodes: >-
          {{ cluster_nodes | default([])
             + [{'name': 'master-node-' ~ (item + 1),
                 'vmid': (pve_vmid_base | int) + item + 1,
                 'role': 'master'}] }}
      loop: "{{ range(0, num_master_nodes) | list }}"

    - name: Add the worker nodes to the list
      ansible.builtin.set_fact:
        cluster_nodes: >-
          {{ cluster_nodes
             + [{'name': 'worker-node-' ~ (item + 1),
                 'vmid': (pve_vmid_base | int) + 10 + item + 1,
                 'role': 'worker'}] }}
      loop: "{{ range(0, num_worker_nodes) | list }}"

    # force stops a running VM first -- without it the module returns changed=false with
    # "Stop it before deletion or use force=true", which is every VM in a normal run. purge drops
    # the vmid from backup/replication/HA config too, which matters here because the next run
    # reuses exactly these vmids. Deleting a vmid that is already gone is a no-op, so a second
    # destroy is harmless.
    - name: Delete the nodes
      community.proxmox.proxmox_kvm:
        node: "{{ pve_node }}"
        vmid: "{{ item.vmid }}"
        name: "{{ item.name }}"
        state: absent
        force: true
        purge: true
        timeout: 300
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.name }} ({{ item.vmid }})"
      register: delete_nodes

    - name: Register the Proxmox host for the snippet cleanup
      ansible.builtin.add_host:
        name: pve_host
        ansible_host: "{{ pve_ssh_host }}"
        ansible_user: "{{ pve_ssh_user }}"
        ansible_ssh_private_key_file: "{{ pve_ssh_key_file | default(omit, true) }}"
        ansible_python_interpreter: /usr/bin/python3
      changed_when: false

    # Never fatal: destroy has to keep going and delete the VMs even if the API is unreachable,
    # so a failure here just leaves the fallback path in place.
    - name: Read the snippet storage's configuration
      ansible.builtin.uri:
        url: "{{ pve_api_url }}/storage/{{ pve_snippet_storage }}"
        method: GET
        headers: "{{ pve_auth_header }}"
        validate_certs: "{{ pve_validate_certs }}"
        return_content: true
      register: snippet_storage_cfg
      failed_when: false

    - name: Resolve the snippet directory
      ansible.builtin.set_fact:
        pve_snippet_dir: >-
          {{ pve_snippet_dir_override
             | default(((snippet_storage_cfg.json | default({})).data | default({})).path
                       | default('/var/lib/vz', true) ~ '/snippets', true) }}

    - name: Remove the cloud-init snippets from the Proxmox host
      ansible.builtin.file:
        path: "{{ pve_snippet_dir }}/{{ snippet_prefix }}-{{ item.name }}.yaml"
        state: absent
      delegate_to: pve_host
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    # The domain and record created in create.yml. Deleted record-first, and 404 is accepted so a
    # partially-completed create, or a second destroy, is a no-op rather than a failure.
    - name: Check whether create recorded any AutoGlue ids
      ansible.builtin.stat:
        path: ./autoglue-ids.yaml
      register: autoglue_ids_file

    - name: Load the AutoGlue ids written by create
      ansible.builtin.include_vars:
        file: ./autoglue-ids.yaml
      when: autoglue_ids_file.stat.exists

    - name: Delete the ctrp DNS record via AutoGlue API
      ansible.builtin.uri:
        url: "{{ lookup('env', 'AUTOGLUE_BASE_URL') }}/api/v1/dns/records/{{ autoglue_record_id }}"
        method: DELETE
        headers:
          accept: application/json
          x-org-key: "{{ lookup('env', 'AUTOGLUE_ORG_KEY') }}"
          x-org-secret: "{{ lookup('env', 'AUTOGLUE_ORG_SECRET') }}"
          x-org-id: "{{ lookup('env', 'AUTOGLUE_ORG_ID') }}"
        status_code: [200, 202, 204, 404]
      when:
        - autoglue_ids_file.stat.exists
        - autoglue_record_id | default('') | string | length > 0

    - name: Delete the DNS domain via AutoGlue API
      ansible.builtin.uri:
        url: "{{ lookup('env', 'AUTOGLUE_BASE_URL') }}/api/v1/dns/domains/{{ autoglue_domain_id }}"
        method: DELETE
        headers:
          accept: application/json
          x-org-key: "{{ lookup('env', 'AUTOGLUE_ORG_KEY') }}"
          x-org-secret: "{{ lookup('env', 'AUTOGLUE_ORG_SECRET') }}"
          x-org-id: "{{ lookup('env', 'AUTOGLUE_ORG_ID') }}"
        status_code: [200, 202, 204, 404]
      when:
        - autoglue_ids_file.stat.exists
        - autoglue_domain_id | default('') | string | length > 0

    - name: Drop the AutoGlue id files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - ./autoglue-ids.yaml
        - ./autoglue-record-id
