---
# Builds the six-node test cluster on Proxmox VE.
#
# Everything downstream of this playbook is provider-agnostic, so the contract it has to honour is
# just the three files it drops in the scenario directory:
#
#   inventory/hosts.yaml   the real inventory, linked by molecule.yml's inventory.links.hosts
#   autoglue-ids.yaml      domain + record ids, read back by destroy.yml
#   autoglue-record-id     the bare record id, read by inventory/group_vars/masters.yaml
#
# Auth comes from the environment and is never written here: community.proxmox reads PROXMOX_HOST,
# PROXMOX_USER, PROXMOX_TOKEN_ID, PROXMOX_TOKEN_SECRET and PROXMOX_VALIDATE_CERTS itself, which is
# why no module below passes api_* parameters. The two ansible.builtin.uri calls cannot use that
# fallback and rebuild the token header from the same variables.
#
# Prerequisites on the cluster, none of which this playbook creates:
#   - an Ubuntu 24.04 cloud-init template ($PROXMOX_TEMPLATE) that has a cloud-init drive.
#     Without the drive, cicustom and ipconfig0 are accepted and then silently ignored.
#   - a storage with the "snippets" content type ($PROXMOX_SNIPPET_STORAGE)
#   - SSH access to the PVE host. The API's storage upload endpoint does not accept snippets, so
#     the cloud-init files have to be written to the hypervisor directly.
#   - the datacenter firewall switched on (asserted below, never set here)
#   - two bridges with DHCP on each: $PROXMOX_BRIDGE_PUBLIC carries net0, the address molecule
#     SSHes to and the only NIC that is firewalled; $PROXMOX_BRIDGE_LAN carries net1, which is
#     what the cluster itself runs on. $PROXMOX_LAN_CIDR is what tells the two leases apart.
- name: Create Proxmox VMs and their firewall rules
  hosts: localhost
  gather_facts: true
  vars:
    num_master_nodes: 3
    num_worker_nodes: 3
    public_key: "{{ lookup('file', 'keys/vm_node.pub') }}"

    # `default('x')` alone does not work for any of these: lookup('env', ...) returns "" for an
    # unset variable, which is DEFINED but falsy, so the default never fires. The boolean form
    # below also replaces empty values. (Same trap the old HCLOUD_LOCATION line documented.)
    pve_node: "{{ lookup('env', 'PROXMOX_NODE') }}"
    pve_template: "{{ lookup('env', 'PROXMOX_TEMPLATE') | default('ubuntu-2404-cloudinit', true) }}"
    pve_storage: "{{ lookup('env', 'PROXMOX_STORAGE') | default('local-lvm', true) }}"
    # Two NICs. net0 on the public bridge is what molecule SSHes to and the only one that is
    # firewalled; net1 on the LAN bridge carries everything the cluster does -- kubelet, etcd,
    # Calico VXLAN -- and is what lands in the inventory's `ip`. Both take a DHCP lease.
    pve_bridge_public: "{{ lookup('env', 'PROXMOX_BRIDGE_PUBLIC') | default('vmbr_public', true) }}"
    pve_bridge_lan: "{{ lookup('env', 'PROXMOX_BRIDGE_LAN') | default('vmbr_lan', true) }}"
    # Required, and the only thing that tells the two leases apart: the guest agent reports both
    # addresses in one list with nothing to say which NIC they came from.
    pve_lan_cidr: "{{ lookup('env', 'PROXMOX_LAN_CIDR') }}"
    pve_snippet_storage: "{{ lookup('env', 'PROXMOX_SNIPPET_STORAGE') | default('local', true) }}"
    pve_snippet_dir: "{{ lookup('env', 'PROXMOX_SNIPPET_DIR') | default('/var/lib/vz/snippets', true) }}"
    pve_cores: "{{ lookup('env', 'PROXMOX_CORES') | default('4', true) }}"
    pve_memory: "{{ lookup('env', 'PROXMOX_MEMORY') | default('8192', true) }}"
    # Masters take base+1..3, workers base+11..13. Deterministic so destroy.yml needs no state
    # file -- and so a collision with a pre-existing VM is a collision with a *known* range.
    pve_vmid_base: "{{ lookup('env', 'PROXMOX_VMID_BASE') | default('9000', true) | int }}"

    # Used only by the two uri calls, which cannot use the collection's env fallbacks.
    pve_api_host: "{{ lookup('env', 'PROXMOX_HOST') }}"
    pve_api_port: "{{ lookup('env', 'PROXMOX_PORT') | default('8006', true) }}"
    pve_api_user: "{{ lookup('env', 'PROXMOX_USER') | default('root@pam', true) }}"
    pve_token_id: "{{ lookup('env', 'PROXMOX_TOKEN_ID') }}"
    pve_token_secret: "{{ lookup('env', 'PROXMOX_TOKEN_SECRET') }}"
    pve_validate_certs: "{{ lookup('env', 'PROXMOX_VALIDATE_CERTS') | default('true', true) | bool }}"
    pve_api_url: "https://{{ pve_api_host }}:{{ pve_api_port }}/api2/json"
    pve_auth_header:
      Authorization: "PVEAPIToken={{ pve_api_user }}!{{ pve_token_id }}={{ pve_token_secret }}"

    # SSH to the hypervisor, for the cloud-init snippets.
    pve_ssh_host: "{{ lookup('env', 'PROXMOX_SSH_HOST') | default(lookup('env', 'PROXMOX_HOST'), true) }}"
    pve_ssh_user: "{{ lookup('env', 'PROXMOX_SSH_USER') | default('root', true) }}"
    pve_ssh_key_file: "{{ lookup('env', 'PROXMOX_SSH_KEY_FILE') }}"

    snippet_prefix: molecule-test-cluster

  tasks:
    - name: Required Proxmox variables are set
      ansible.builtin.assert:
        that:
          - pve_api_host | length > 0
          - pve_node | length > 0
          - pve_token_id | length > 0
          - pve_token_secret | length > 0
          - pve_lan_cidr | length > 0
        fail_msg: >-
          PROXMOX_HOST, PROXMOX_NODE, PROXMOX_TOKEN_ID, PROXMOX_TOKEN_SECRET and PROXMOX_LAN_CIDR
          must all be set. See ansible/molecule/readme.md. Failing here beats failing inside a
          module with "api_host is required" after some of the six VMs already exist -- and, for
          the CIDR, beats building all six and then finding no address can be classified.
        quiet: true

    # The per-VM rules below only take effect if the datacenter firewall is on. Enabling it is
    # deliberately NOT done here: it applies a default-DROP input policy across the whole cluster
    # and can lock you out of unrelated VMs and of the PVE host itself. Assert and let a human do
    # it once.
    - name: Read the datacenter firewall options
      ansible.builtin.uri:
        url: "{{ pve_api_url }}/cluster/firewall/options"
        method: GET
        headers: "{{ pve_auth_header }}"
        validate_certs: "{{ pve_validate_certs }}"
        return_content: true
      register: cluster_firewall

    # One list, used by every loop below and rebuilt identically in destroy.yml.
    - name: Build the master node list
      ansible.builtin.set_fact:
        cluster_nodes: >-
          {{ cluster_nodes | default([])
             + [{'name': 'master-node-' ~ (item + 1),
                 'vmid': (pve_vmid_base | int) + item + 1,
                 'role': 'master'}] }}
      loop: "{{ range(0, num_master_nodes) | list }}"

    - name: Add the worker nodes to the list
      ansible.builtin.set_fact:
        cluster_nodes: >-
          {{ cluster_nodes
             + [{'name': 'worker-node-' ~ (item + 1),
                 'vmid': (pve_vmid_base | int) + 10 + item + 1,
                 'role': 'worker'}] }}
      loop: "{{ range(0, num_worker_nodes) | list }}"

    # The hypervisor as an ansible host, so the snippet tasks can delegate_to it. In memory only;
    # nothing is written to an inventory file.
    - name: Register the Proxmox host for the snippet upload
      ansible.builtin.add_host:
        name: pve_host
        ansible_host: "{{ pve_ssh_host }}"
        ansible_user: "{{ pve_ssh_user }}"
        ansible_ssh_private_key_file: "{{ pve_ssh_key_file | default(omit, true) }}"
        ansible_python_interpreter: /usr/bin/python3
      changed_when: false

    - name: Ensure the snippet directory exists
      ansible.builtin.file:
        path: "{{ pve_snippet_dir }}"
        state: directory
        mode: "0755"
      delegate_to: pve_host

    # One snippet per node, not one shared file: cicustom user= REPLACES the user-data Proxmox
    # generates rather than merging with it, so the hostname qm would normally inject is lost.
    # Six VMs with the template's hostname all register as a single Kubernetes node and
    # tests/test_cluster_healthy.yaml fails its "every inventory node is present" assert.
    - name: Render a cloud-init snippet for each node
      ansible.builtin.template:
        src: cloudinit/cloud-init.yaml.j2
        dest: "{{ pve_snippet_dir }}/{{ snippet_prefix }}-{{ item.name }}.yaml"
        mode: "0644"
      vars:
        node_name: "{{ item.name }}"
      delegate_to: pve_host
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    # Idempotent the same way hetzner.hcloud.server was, just keyed on the vmid rather than the
    # name: proxmox_kvm's clone returns changed=false when newid already exists. So a create
    # re-run after a partial failure picks up where it left off. It also means a *stale* VM on one
    # of our vmids is silently adopted -- see the warning at the top of ansible/molecule/readme.md.
    - name: Clone the template into each node
      community.proxmox.proxmox_kvm:
        node: "{{ pve_node }}"
        clone: "{{ pve_template }}"
        newid: "{{ item.vmid }}"
        name: "{{ item.name }}"
        storage: "{{ pve_storage }}"
        full: true
        timeout: 300
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.name }} ({{ item.vmid }})"

    # A separate call from the clone: proxmox_kvm will not clone and configure in one pass.
    # firewall=1 on the NIC is what makes the per-VM rules further down apply at all.
    - name: Configure hardware and cloud-init on each node
      community.proxmox.proxmox_kvm:
        node: "{{ pve_node }}"
        vmid: "{{ item.vmid }}"
        name: "{{ item.name }}"
        update: true
        cores: "{{ pve_cores | int }}"
        memory: "{{ pve_memory | int }}"
        # "1", not "enabled": the module runs this through ansible's boolean() and only
        # converts recognised booleans to the 1/0 the API wants. Anything else is passed through
        # verbatim, so `agent: enabled` reaches PVE as agent=enabled -- which it parses as
        # enabled=enabled and rejects.
        agent: "1"
        onboot: false
        net:
          net0: "virtio,bridge={{ pve_bridge_public }},firewall=1"
          # No firewall=1 here on purpose. PVE only filters interfaces carrying the flag, so the
          # LAN stays open no matter what policy_in the VM firewall is set to -- which is what
          # lets etcd, the kubelet and Calico talk without a single rule.
          net1: "virtio,bridge={{ pve_bridge_lan }}"
        # cicustom below replaces only user-data, so Proxmox still builds network-config from
        # these two. That is also why the snippet must not configure networking itself.
        ipconfig:
          ipconfig0: "ip=dhcp"
          ipconfig1: "ip=dhcp"
        cicustom: "user={{ pve_snippet_storage }}:snippets/{{ snippet_prefix }}-{{ item.name }}.yaml"
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Start each node
      community.proxmox.proxmox_kvm:
        node: "{{ pve_node }}"
        vmid: "{{ item.vmid }}"
        state: started
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    # Replaces the old blind `pause: seconds: 60`. The nodes take a DHCP lease, so their addresses
    # are not known until the guest agent answers -- and the agent is installed by the snippet, so
    # this also proves cloud-init ran. proxmox_vm_info fail_json()s while the agent is still down,
    # hence ignore_errors alongside until.
    - name: Wait for the guest agent to report an address
      community.proxmox.proxmox_vm_info:
        node: "{{ pve_node }}"
        type: qemu
        vmid: "{{ item.vmid }}"
        network: true
      register: vm_net
      ignore_errors: true
      changed_when: false
      # Templated lazily, after the register is set, so it sees this task's own result.
      vars:
        agent_ipv4: >-
          {{ vm_net.proxmox_vms | default([])
             | selectattr('network', 'defined') | map(attribute='network') | flatten
             | rejectattr('name', 'equalto', 'lo')
             | selectattr('ip-addresses', 'defined') | map(attribute='ip-addresses') | flatten
             | selectattr('ip-address-type', 'equalto', 'ipv4') | map(attribute='ip-address')
             | reject('match', '^(127\.|169\.254\.)') | list }}
      # Both leases, not just one: net0 usually comes up first, and stopping there would map a
      # node's public address into `ip` on the run where the LAN lease was a second slower.
      until: >-
        (agent_ipv4 | ansible.utils.ipaddr(pve_lan_cidr) | length) > 0
        and
        (agent_ipv4 | difference(agent_ipv4 | ansible.utils.ipaddr(pve_lan_cidr)) | length) > 0
      retries: 40
      delay: 15
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    # Collected once, then split, so the extraction expression lives in exactly one place.
    - name: Collect the addresses each agent reported
      ansible.builtin.set_fact:
        node_agent_ipv4: >-
          {{ node_agent_ipv4 | default({}) | combine({item.item.name: (
               item.proxmox_vms | default([])
               | selectattr('network', 'defined') | map(attribute='network') | flatten
               | rejectattr('name', 'equalto', 'lo')
               | selectattr('ip-addresses', 'defined') | map(attribute='ip-addresses') | flatten
               | selectattr('ip-address-type', 'equalto', 'ipv4') | map(attribute='ip-address')
               | reject('match', '^(127\.|169\.254\.)') | list) }) }}
      loop: "{{ vm_net.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    # Split by CIDR rather than by interface name: ens18/ens19 is a Proxmox naming convention, not
    # a guarantee, and the guest agent gives no hint which NIC an address belongs to. The two
    # tasks are separate so a node that got only one of its two leases still lands in the map it
    # did get -- which is what makes the assert below able to say which lease is missing.
    - name: Map each node to its LAN address (net1)
      ansible.builtin.set_fact:
        node_lan_addresses: "{{ node_lan_addresses | default({}) | combine({item.key: lan | first}) }}"
      vars:
        lan: "{{ item.value | ansible.utils.ipaddr(pve_lan_cidr) }}"
      when: lan | length > 0
      loop: "{{ node_agent_ipv4 | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Map each node to its public address (net0)
      ansible.builtin.set_fact:
        node_public_addresses: "{{ node_public_addresses | default({}) | combine({item.key: public | first}) }}"
      vars:
        public: "{{ item.value | difference(item.value | ansible.utils.ipaddr(pve_lan_cidr)) }}"
      when: public | length > 0
      loop: "{{ node_agent_ipv4 | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    # Without this the missing node surfaces much later as an inventory that is quietly one host
    # short, or as an AnsibleUndefinedVariable with no host name in it.
    - name: Every node reported a public address
      ansible.builtin.assert:
        that:
          - node_public_addresses | default({}) | length == cluster_nodes | length
        fail_msg: >-
          No address outside {{ pve_lan_cidr }} came back for
          {{ cluster_nodes | map(attribute='name') | difference(node_public_addresses | default({}) | list) | sort }}.
          Either the qemu-guest-agent never answered -- so cloud-init did not run; check that
          {{ pve_template }} has a cloud-init drive, and `qm cloudinit dump <vmid> user` -- or
          {{ pve_bridge_public }} handed out no lease.
        quiet: true

    # Split from the assert above because the two failures have completely different causes, and
    # the LAN one is almost always a wrong PROXMOX_LAN_CIDR rather than a broken VM.
    - name: Every node reported a LAN address
      ansible.builtin.assert:
        that:
          - node_lan_addresses | default({}) | length == cluster_nodes | length
        fail_msg: >-
          No address inside {{ pve_lan_cidr }} came back for
          {{ cluster_nodes | map(attribute='name') | difference(node_lan_addresses | default({}) | list) | sort }}.
          Either PROXMOX_LAN_CIDR does not describe what {{ pve_bridge_lan }} hands out -- compare
          it against `ip -4 addr` on a node -- or that bridge has no DHCP server on it.
        quiet: true

    # Same logic the Hetzner scenario used, and still meaningful: these nodes carry public
    # addresses, so SSH has to be scoped to whatever is running molecule.
    - name: Discover the public address molecule connects from
      ansible.builtin.uri:
        url: https://api.ipify.org?format=json
        return_content: true
      register: controller_public_ip
      when: lookup('env', 'MOLECULE_SSH_SOURCE_CIDRS') | length == 0

    - name: Set the CIDRs allowed to SSH into the test nodes
      ansible.builtin.set_fact:
        ssh_source_cidrs: >-
          {{ lookup('env', 'MOLECULE_SSH_SOURCE_CIDRS') | split(',') | map('trim') | select | list
             if lookup('env', 'MOLECULE_SSH_SOURCE_CIDRS') | length > 0
             else [controller_public_ip.json.ip ~ '/32'] }}

    # Two things differ from the Hetzner firewall and both shape the tasks below:
    #   - a PVE rule's `source` is a single string, not a list, so one rule per CIDR
    #   - rules are position-indexed, and `pos` is required
    #
    # level: vm means the rules live on the VM and are deleted with it, so destroy.yml has no
    # firewall teardown to do. Only net0 carries firewall=1, so this ruleset governs the public
    # NIC alone -- SSH is the only thing that has to reach a node from off-box, because every
    # cluster protocol rides the unfiltered LAN NIC.
    - name: Start the ruleset with SSH from the controller
      ansible.builtin.set_fact:
        fw_rules: >-
          {{ fw_rules | default([])
             + [{'type': 'in', 'action': 'ACCEPT', 'proto': 'tcp', 'dport': '22',
                 'source': item, 'enable': true, 'comment': 'molecule controller'}] }}
      loop: "{{ ssh_source_cidrs }}"

    # No node-to-node rule. The Hetzner scenarios need one because Calico autodetects with
    # firstFound and lands on their public NIC; here inventory/group_vars/masters.yaml pins
    # nodeAddressAutodetectionV4 to PROXMOX_LAN_CIDR, so VXLAN never touches net0.
    - name: Number the rules
      ansible.builtin.set_fact:
        vm_firewall_rules: "{{ vm_firewall_rules | default([]) + [fw_rules[item] | combine({'pos': item})] }}"
      loop: "{{ range(0, fw_rules | length) | list }}"
      loop_control:
        label: "{{ item }}"

    # There is no VM-level firewall-options module in community.proxmox, so this one goes through
    # the API directly. dhcp: 1 is not optional -- the nodes hold a DHCP lease, and a default-DROP
    # input policy without it drops the renewal and the node falls off the network mid-run.
    - name: Enable the firewall on each VM
      ansible.builtin.uri:
        url: "{{ pve_api_url }}/nodes/{{ pve_node }}/qemu/{{ item.vmid }}/firewall/options"
        method: PUT
        headers: "{{ pve_auth_header }}"
        validate_certs: "{{ pve_validate_certs }}"
        body_format: form-urlencoded
        body:
          enable: 1
          dhcp: 1
          policy_in: DROP
          policy_out: ACCEPT
        status_code: [200]
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Apply the firewall rules to each VM
      community.proxmox.proxmox_firewall:
        level: vm
        vmid: "{{ item.vmid }}"
        state: present
        update: true
        rules: "{{ vm_firewall_rules }}"
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Wait for SSH on every node
      ansible.builtin.wait_for:
        host: "{{ item.value }}"
        port: 22
        timeout: 300
      loop: "{{ node_public_addresses | dict2items }}"
      loop_control:
        label: "{{ item.key }} ({{ item.value }})"

    # ansible_host is the public address molecule connects over; ip is the LAN address every
    # cluster component binds to -- etcd_initial_cluster, the kubelet and the ctrp record all read
    # it. Same split the Hetzner scenarios use (scale-cluster/create.yml: public ipv4_address vs
    # private_networks_info[0].ip).
    - name: Store default inventory
      ansible.builtin.copy:
        content: |
          all:
            children:
              masters:
                hosts:
                  {% for node in cluster_nodes | selectattr('role', 'equalto', 'master') -%}
                    {{ node.name }}:
                      ansible_host: {{ node_public_addresses[node.name] }}
                      ip: {{ node_lan_addresses[node.name] }}
                      ansible_user: cluster
                      ansible_ssh_private_key_file: keys/vm_node
                      extra:
                        taints:
                          - node-role.kubernetes.io/control-plane:NoSchedule-
                  {% endfor +%}
              workers:
                hosts:
                  {% for node in cluster_nodes | selectattr('role', 'equalto', 'worker') -%}
                    {{ node.name }}:
                      ansible_host: {{ node_public_addresses[node.name] }}
                      ip: {{ node_lan_addresses[node.name] }}
                      ansible_user: cluster
                      ansible_ssh_private_key_file: keys/vm_node
                      extra:
                        taints: []
                  {% endfor +%}
        dest: "./inventory/hosts.yaml"
        mode: "0644"

    # AutoGlue owns the DNS the apiserver is reached through. The domain and the ctrp record are
    # both created here rather than assumed to exist, and destroy.yml removes them again, so a
    # run leaves nothing behind. The ids are written to autoglue-ids.yaml because destroy runs
    # as a separate playbook and cannot see these registers.
    - name: Create the DNS domain via AutoGlue API
      ansible.builtin.uri:
        url: "{{ lookup('env', 'AUTOGLUE_BASE_URL') }}/api/v1/dns/domains"
        method: POST
        headers:
          accept: application/json
          content-type: application/json
          x-org-key: "{{ lookup('env', 'AUTOGLUE_ORG_KEY') }}"
          x-org-secret: "{{ lookup('env', 'AUTOGLUE_ORG_SECRET') }}"
          x-org-id: "{{ lookup('env', 'AUTOGLUE_ORG_ID') }}"
        body_format: json
        body:
          credential_id: "{{ lookup('env', 'AUTOGLUE_CREDENTIAL_ID') }}"
          domain_name: "{{ lookup('env', 'domain_name') }}"
          zone_id: "{{ lookup('env', 'AUTOGLUE_ZONE_ID') }}"
        status_code: [200, 201]
      register: autoglue_domain

    # Fail here with the body in the message rather than three tasks later with an empty URL,
    # if the response ever stops carrying `id` at the top level.
    - name: Confirm AutoGlue returned a domain id
      ansible.builtin.assert:
        that:
          - autoglue_domain.json.id is defined
          - autoglue_domain.json.id | string | length > 0
        fail_msg: "AutoGlue did not return an id for the domain: {{ autoglue_domain.json }}"

    - name: Create the ctrp A record in the new domain via AutoGlue API
      ansible.builtin.uri:
        url: "{{ lookup('env', 'AUTOGLUE_BASE_URL') }}/api/v1/dns/domains/{{ autoglue_domain.json.id }}/records"
        method: POST
        headers:
          accept: application/json
          content-type: application/json
          x-org-key: "{{ lookup('env', 'AUTOGLUE_ORG_KEY') }}"
          x-org-secret: "{{ lookup('env', 'AUTOGLUE_ORG_SECRET') }}"
          x-org-id: "{{ lookup('env', 'AUTOGLUE_ORG_ID') }}"
        body_format: json
        body:
          name: ctrp
          ttl: 60
          type: A
          # all three masters, on the LAN -- this is the address the apiserver listens on and the
          # one every node resolves ctrp to, so it must match the inventory's `ip`.
          values: >-
            {{ cluster_nodes | selectattr('role', 'equalto', 'master')
               | map(attribute='name') | map('extract', node_lan_addresses) | list }}
        status_code: [200, 201]
      register: autoglue_record

    - name: Confirm AutoGlue returned a record id
      ansible.builtin.assert:
        that:
          - autoglue_record.json.id is defined
          - autoglue_record.json.id | string | length > 0
        fail_msg: "AutoGlue did not return an id for the record: {{ autoglue_record.json }}"

    - name: Hand the AutoGlue ids to destroy
      ansible.builtin.copy:
        content: |
          ---
          autoglue_domain_id: "{{ autoglue_domain.json.id }}"
          autoglue_record_id: "{{ autoglue_record.json.id }}"
        dest: "./autoglue-ids.yaml"
        mode: "0644"

    # The same id again, bare, because inventory/group_vars/masters.yaml reads it with
    # lookup('file') to give the master role an autoglue_record_id that actually exists.
    # A plain file rather than parsing the YAML above: lookup('file', errors='ignore') returns
    # None when the file is missing, and from_yaml would then blow up instead of falling back.
    - name: Hand the record id to the inventory
      ansible.builtin.copy:
        content: "{{ autoglue_record.json.id }}"
        dest: "./autoglue-record-id"
        mode: "0644"
