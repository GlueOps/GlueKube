---
- name: Verify Kubernetes Nodes Status
  hosts: masters[0]
  become: true
  gather_facts: true
  tasks:
    # A point-in-time Ready check fails on a legitimate reconvergence. Removing a control-plane
    # node does not stop its apiserver, so a worker whose kubelet is pinned to that apiserver
    # keeps talking to it until the connection breaks: the node misses heartbeats and the node
    # controller marks it NotReady for one nodeMonitorGracePeriod (~50s) before the kubelet
    # re-resolves the ctrp record onto a surviving master and recovers. A scale-cluster run
    # failed here on exactly that, twelve seconds after this same assertion had passed against
    # the same cluster.
    #
    # Retrying IS the assertion: the cluster is required to reach all-Ready, not to have been
    # all-Ready at the first instant it was asked.
    - name: Wait for every node to report Ready
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl get nodes --no-headers
      register: kube_nodes
      changed_when: false
      retries: 12
      delay: 10
      # The node count is part of the condition on purpose: a kubectl that fails outright
      # reject()s to length 0 exactly like an all-Ready cluster does, so emptiness alone would
      # satisfy the loop on the first attempt and pass this test on no evidence whatsoever.
      until: >-
        kube_nodes.stdout_lines | default([]) | length > 0 and
        kube_nodes.stdout_lines | default([]) | reject('search', ' Ready ') | list | length == 0
      # Not fatal on its own. Failing here would abort the play before the diagnostics below
      # ran, on exactly the runs that need them; the two fail tasks after them decide the result.
      ignore_errors: true

    - name: Debug Node Status Output
      ansible.builtin.debug:
        msg: "{{ kube_nodes.stdout_lines }}"

    - name: Show Nodes Events
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl get events --all-namespaces --sort-by='.metadata.creationTimestamp' | tail -n 20
      register: kube_events
      ignore_errors: true

    - name: Debug Nodes Events
      ansible.builtin.debug:
        msg: "{{ kube_events.stdout_lines }}"
        

    # The loop below iterates the node list, so an empty list is a vacuous pass: a kubectl that
    # never answered would report the cluster healthy. Checked separately so the two say what
    # actually went wrong.
    - name: Fail if the node list could not be read
      ansible.builtin.fail:
        msg: >-
          kubectl get nodes returned no nodes after 120s
          (rc {{ kube_nodes.rc | default('n/a') }}):
          {{ kube_nodes.stderr | default('') | trim }}
      when: kube_nodes.stdout_lines | default([]) | length == 0

    - name: Fail if any node is not Ready
      ansible.builtin.fail:
        msg: "Node is still not Ready after 120s: {{ item }}"
      when: "' Ready ' not in item"
      loop: "{{ kube_nodes.stdout_lines }}"


    - name: Get node names
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl get nodes --no-headers -o custom-columns=':metadata.name'
      register: nodes
      changed_when: false

    - name: Every inventory node is present and Ready
      ansible.builtin.assert:
        that:
          - nodes.stdout_lines | sort == (groups['masters'] + groups['workers']) | sort
        fail_msg: >-
          Expected {{ (groups['masters'] + groups['workers']) | sort }},
          got {{ nodes.stdout_lines | sort }}

    - name: etcd membership matches the control-plane count
      ansible.builtin.shell: |
        ETCDCTL_API=3 etcdctl member list --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key -w json | jq '.members | length'
      register: etcd_members
      changed_when: false

    - name: Etcd membership matches the number of masters in the inventory
      ansible.builtin.assert:
        that: etcd_members.stdout | int == groups['masters'] | length
        fail_msg: >-
          Expected {{ groups['masters'] | length }} etcd members,
          found {{ etcd_members.stdout }}