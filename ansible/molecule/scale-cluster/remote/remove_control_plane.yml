---
# Molecule runs this; the bastion runs side_effect/remove_control_plane.yaml.
#
# The cluster nodes have no address molecule can reach, so every step that touches them is a
# thin play against the bastion that shells out to ansible-playbook there. The playbook it
# runs is unchanged and unaware -- common/bastion-prepare.yml mirrors the repo at
# /opt/gluekube/ansible and the remote run chdirs to the scenario directory, so its relative paths
# resolve exactly as they do locally.
- name: Scale the control plane down from the bastion
  hosts: bastion
  gather_facts: false
  vars_files:
    - ../../common/bastion-vars.yml
  tasks:
    - name: Run side_effect/remove_control_plane.yaml on the bastion
      ansible.builtin.include_tasks: ../../common/bastion-run.yml
      vars:
        bastion_run_name: remove_control_plane
        bastion_run_playbook: side_effect/remove_control_plane.yaml
        bastion_run_timeout: 3600
