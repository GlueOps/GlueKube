---
- name: Create Hetzner VMs and Firewall
  hosts: localhost
  gather_facts: true
  vars:
    num_master_nodes: 3
    num_worker_nodes: 3
    public_key: "{{ lookup('file', 'keys/vm_node.pub') }}"

  tasks:
    - name: Create Hetzner Network
      hetzner.hcloud.network:
        name: test-molecule-network
        ip_range: "10.1.0.0/16"
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
      register: network

    - name: Create Hetzner Network Subnet
      hetzner.hcloud.subnetwork:
        network: test-molecule-network
        network_zone: "eu-central"
        ip_range: "10.1.0.0/24"
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
        type: cloud
      register: subnet

    # The test nodes carry a public IPv4 and a Hetzner firewall only filters that public
    # interface. Everything the cluster itself needs -- etcd, the apiserver behind the ctrp
    # record, kubelet -- travels over test-molecule-network, so the only traffic that has to
    # reach a node from outside is SSH from whatever is running molecule.
    #
    # Node-to-node still needs the public interface open: calico autodetects with firstFound
    # and lands on eth0 here, so VXLAN would break if the nodes could not reach each other.
    # Their addresses do not exist yet -- the firewall has to be created before the servers
    # that attach to it -- so that rule is added in "Restrict the firewall ..." below, once
    # master_nodes and worker_nodes are registered.
    - name: Discover the public address molecule connects from
      ansible.builtin.uri:
        url: https://api.ipify.org?format=json
        return_content: true
      register: controller_public_ip
      when: lookup('env', 'MOLECULE_SSH_SOURCE_CIDRS') | length == 0

    - name: Set the CIDRs allowed to SSH into the test nodes
      ansible.builtin.set_fact:
        ssh_source_cidrs: >-
          {{ lookup('env', 'MOLECULE_SSH_SOURCE_CIDRS') | split(',') | map('trim') | select | list
             if lookup('env', 'MOLECULE_SSH_SOURCE_CIDRS') | length > 0
             else [controller_public_ip.json.ip ~ '/32'] }}

    - name: Create Firewall
      hetzner.hcloud.firewall:
        name: my-firewall
        rules:
          - direction: in
            protocol: tcp
            port: "22"
            source_ips: "{{ ssh_source_cidrs }}"
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
      register: firewall


    - name: Create Master Nodes
      hetzner.hcloud.server:
        name: "master-node-{{ item + 1 }}"
        server_type: ccx13
        image: ubuntu-24.04
        # `default('hel1')` alone does not work here: lookup('env', ...) returns "" for an unset
        # variable, which is DEFINED but falsy, so the default never fires. hetzner.hcloud then
        # calls locations.get_by_name("") -> None and dies with
        # "'NoneType' object has no attribute 'name'". The boolean form also replaces empty values.
        location: "{{ lookup('env', 'HCLOUD_LOCATION') | default('hel1', true) }}"
        enable_ipv4: true
        enable_ipv6: false
        firewalls:
          - my-firewall
        user_data: "{{ lookup('template', 'cloudinit/cloud-init.yaml.j2')}}"
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
        private_networks:
          - test-molecule-network
      loop: "{{ range(0, num_master_nodes) | list }}"
      register: master_nodes
    
    - name: Create Worker Nodes
      hetzner.hcloud.server:
        name: "worker-node-{{ item + 1 }}"
        server_type: ccx13
        image: ubuntu-24.04
        location: "{{ lookup('env', 'HCLOUD_LOCATION') | default('hel1', true) }}"
        enable_ipv4: true
        enable_ipv6: false
        firewalls:
          - my-firewall
        user_data: "{{ lookup('template', 'cloudinit/cloud-init.yaml.j2')}}"
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
        private_networks:
          - test-molecule-network
      loop: "{{ range(0, num_worker_nodes) | list }}"
      register: worker_nodes

    # Now that the nodes exist, replace the bootstrap ruleset: SSH stays scoped to the
    # controller, and the nodes are allowed to talk to each other over their public
    # addresses. Nothing else on the internet can reach the cluster.
    - name: Restrict the firewall to SSH and node-to-node traffic
      hetzner.hcloud.firewall:
        name: my-firewall
        rules:
          - direction: in
            protocol: tcp
            port: "22"
            source_ips: "{{ ssh_source_cidrs }}"
          - direction: in
            protocol: tcp
            port: "1-65535"
            source_ips: "{{ node_source_cidrs }}"
          - direction: in
            protocol: udp
            port: "1-65535"
            source_ips: "{{ node_source_cidrs }}"
        api_token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
      vars:
        node_source_cidrs: >-
          {{ (master_nodes.results + worker_nodes.results)
             | map(attribute='hcloud_server.ipv4_address')
             | map('regex_replace', '$', '/32') | list }}


    - name: Store default inventory
      ansible.builtin.copy:
        content: |
          all:
            children:
              masters:
                hosts:
                  {% for node in master_nodes.results[:1] -%}
                    {{ node.hcloud_server.name }}:
                      ansible_host: {{ node.hcloud_server.ipv4_address }}
                      ip: {{ node.hcloud_server.private_networks_info[0].ip }}
                      ansible_user: cluster
                      ansible_ssh_private_key_file: keys/vm_node
                      extra:
                        taints:
                          - node-role.kubernetes.io/control-plane:NoSchedule-
                  {% endfor +%}
              workers:
                hosts:
                  {% for node in worker_nodes.results[:2] -%}
                    {{ node.hcloud_server.name }}:
                      ansible_host: {{ node.hcloud_server.ipv4_address }}
                      ip: {{ node.hcloud_server.private_networks_info[0].ip }}
                      ansible_user: cluster
                      ansible_ssh_private_key_file: keys/vm_node
                      extra:
                        taints: []
                  {% endfor +%}
        dest: "./inventory/hosts.yaml"
        mode: "0644"
    
    - name: Store Scale Up control plane inventory
      ansible.builtin.copy:
        content: |
          all:
            children:
              masters:
                hosts:
                  {% for node in master_nodes.results -%}
                    {{ node.hcloud_server.name }}:
                      ansible_host: {{ node.hcloud_server.ipv4_address }}
                      ip: {{ node.hcloud_server.private_networks_info[0].ip }}
                      ansible_user: cluster
                      ansible_ssh_private_key_file: keys/vm_node
                      extra:
                        taints:
                          - node-role.kubernetes.io/control-plane:NoSchedule-
                  {% endfor +%}
              workers:
                hosts:
                  {% for node in worker_nodes.results[:2] -%}
                    {{ node.hcloud_server.name }}:
                      ansible_host: {{ node.hcloud_server.ipv4_address }}
                      ip: {{ node.hcloud_server.private_networks_info[0].ip }}
                      ansible_user: cluster
                      ansible_ssh_private_key_file: keys/vm_node
                      extra:
                        taints: []
                  {% endfor +%}
                  
        dest: "./inventory/scale-up-ctrp.yaml"
        mode: "0644"
    - name: Store inventory(for scale up worker node)
      ansible.builtin.copy:
        content: |
          all:
            children:
              masters:
                hosts:
                  {% for node in master_nodes.results -%}
                    {{ node.hcloud_server.name }}:
                      ansible_host: {{ node.hcloud_server.ipv4_address }}
                      ip: {{ node.hcloud_server.private_networks_info[0].ip }}
                      ansible_user: cluster
                      ansible_ssh_private_key_file: keys/vm_node
                      extra:
                        taints:
                          - node-role.kubernetes.io/control-plane:NoSchedule-
                  {% endfor +%}
              workers:
                hosts:
                  {% for node in worker_nodes.results -%}
                    {{ node.hcloud_server.name }}:
                      ansible_host: {{ node.hcloud_server.ipv4_address }}
                      ip: {{ node.hcloud_server.private_networks_info[0].ip }}
                      ansible_user: cluster
                      ansible_ssh_private_key_file: keys/vm_node
                      extra:
                        taints: []
                  {% endfor +%}
                  
        dest: "./inventory/scale-up-worker.yaml"
        mode: "0644"

    - name: Store inventory(for scale down worker node)
      ansible.builtin.copy:
        content: |
          all:
            children:
              masters:
                hosts:
                  {% for node in master_nodes.results -%}
                    {{ node.hcloud_server.name }}:
                      ansible_host: {{ node.hcloud_server.ipv4_address }}
                      ip: {{ node.hcloud_server.private_networks_info[0].ip }}
                      ansible_user: cluster
                      ansible_ssh_private_key_file: keys/vm_node
                      extra:
                        taints:
                          - node-role.kubernetes.io/control-plane:NoSchedule-
                  {% endfor +%}
              workers:
                hosts:
                  {% for node in worker_nodes.results[:1] -%}
                    {{ node.hcloud_server.name }}:
                      ansible_host: {{ node.hcloud_server.ipv4_address }}
                      ip: {{ node.hcloud_server.private_networks_info[0].ip }}
                      ansible_user: cluster
                      ansible_ssh_private_key_file: keys/vm_node
                      extra:
                        taints: []
                  {% endfor +%}
                  
        dest: "./inventory/scale-down-worker.yaml"
        mode: "0644"

    - name: Store inventory(for scale down control plane node)
      ansible.builtin.copy:
        content: |
          all:
            children:
              masters:
                hosts:
                  {% for node in master_nodes.results[:1] -%}
                    {{ node.hcloud_server.name }}:
                      ansible_host: {{ node.hcloud_server.ipv4_address }}
                      ip: {{ node.hcloud_server.private_networks_info[0].ip }}
                      ansible_user: cluster
                      ansible_ssh_private_key_file: keys/vm_node
                      extra:
                        taints:
                          - node-role.kubernetes.io/control-plane:NoSchedule-
                  {% endfor +%}
              workers:
                hosts:
                  {% for node in worker_nodes.results -%}
                    {{ node.hcloud_server.name }}:
                      ansible_host: {{ node.hcloud_server.ipv4_address }}
                      ip: {{ node.hcloud_server.private_networks_info[0].ip }}
                      ansible_user: cluster
                      ansible_ssh_private_key_file: keys/vm_node
                      extra:
                        taints: []
                  {% endfor +%}

        dest: "./inventory/scale-down-ctrp.yaml"
        mode: "0644"


    # Only the first master exists as an apiserver at this point -- inventory/hosts.yaml above
    # converges master_nodes.results[:1]. PATCHing all three IPs here pre-satisfied the
    # scenario's own assertion: converge ran against two dead A records, and a scale-up that
    # never touched DNS still looked correct (#464). sync.yaml's update-dns-records task is
    # what has to move the record when add_control_plane runs.
    # AutoGlue owns the DNS the apiserver is reached through. The domain and the ctrp record are
    # both created here rather than assumed to exist, and destroy.yml removes them again, so a
    # run leaves nothing behind. The ids are written to autoglue-ids.yaml because destroy runs
    # as a separate playbook and cannot see these registers.
    - name: Create the DNS domain via AutoGlue API
      ansible.builtin.uri:
        url: "{{ lookup('env', 'AUTOGLUE_BASE_URL') }}/api/v1/dns/domains"
        method: POST
        headers:
          accept: application/json
          content-type: application/json
          x-org-key: "{{ lookup('env', 'AUTOGLUE_ORG_KEY') }}"
          x-org-secret: "{{ lookup('env', 'AUTOGLUE_ORG_SECRET') }}"
          x-org-id: "{{ lookup('env', 'AUTOGLUE_ORG_ID') }}"
        body_format: json
        body:
          credential_id: "{{ lookup('env', 'AUTOGLUE_CREDENTIAL_ID') }}"
          domain_name: "{{ lookup('env', 'domain_name') }}"
          zone_id: "{{ lookup('env', 'AUTOGLUE_ZONE_ID') }}"
        status_code: [200, 201]
      register: autoglue_domain

    # Fail here with the body in the message rather than three tasks later with an empty URL,
    # if the response ever stops carrying `id` at the top level.
    - name: Confirm AutoGlue returned a domain id
      ansible.builtin.assert:
        that:
          - autoglue_domain.json.id is defined
          - autoglue_domain.json.id | string | length > 0
        fail_msg: "AutoGlue did not return an id for the domain: {{ autoglue_domain.json }}"

    - name: Create the ctrp A record in the new domain via AutoGlue API
      ansible.builtin.uri:
        url: "{{ lookup('env', 'AUTOGLUE_BASE_URL') }}/api/v1/dns/domains/{{ autoglue_domain.json.id }}/records"
        method: POST
        headers:
          accept: application/json
          content-type: application/json
          x-org-key: "{{ lookup('env', 'AUTOGLUE_ORG_KEY') }}"
          x-org-secret: "{{ lookup('env', 'AUTOGLUE_ORG_SECRET') }}"
          x-org-id: "{{ lookup('env', 'AUTOGLUE_ORG_ID') }}"
        body_format: json
        body:
          name: ctrp
          ttl: 60
          type: A
          # only the first master -- the one inventory/hosts.yaml converges
          values: "{{ master_nodes.results[:1] | map(attribute='hcloud_server') | map(attribute='private_networks_info') | map('first') | map(attribute='ip') | list }}"
        status_code: [200, 201]
      register: autoglue_record

    - name: Confirm AutoGlue returned a record id
      ansible.builtin.assert:
        that:
          - autoglue_record.json.id is defined
          - autoglue_record.json.id | string | length > 0
        fail_msg: "AutoGlue did not return an id for the record: {{ autoglue_record.json }}"

    - name: Hand the AutoGlue ids to destroy
      ansible.builtin.copy:
        content: |
          ---
          autoglue_domain_id: "{{ autoglue_domain.json.id }}"
          autoglue_record_id: "{{ autoglue_record.json.id }}"
        dest: "./autoglue-ids.yaml"
        mode: "0644"

    - name: wait for 60 seconds to ensure that the nodes are up and running
      ansible.builtin.pause:
        seconds: 60