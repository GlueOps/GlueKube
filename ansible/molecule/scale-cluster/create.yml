---
# Builds the nodes scale-cluster scales up and down, on Proxmox VE.
#
# The provisioning is shared -- see ../common/proxmox-provision.yml. What is specific to this
# scenario is the five inventories below: every node is BUILT here, but each side effect converges
# a different subset of them, and the inventory files are how that subset is expressed.
#
#   inventory/hosts.yaml            one master, two workers -- the cluster converge starts from
#   inventory/scale-up-ctrp.yaml    three masters, two workers
#   inventory/scale-up-worker.yaml  three masters, three workers
#   inventory/scale-down-worker.yaml  three masters, one worker
#   inventory/scale-down-ctrp.yaml    one master, three workers
#
# Plus the two AutoGlue files destroy.yml and group_vars/masters.yaml read back.
- name: Create Proxmox VMs
  hosts: localhost
  gather_facts: true
  vars_files:
    - ../common/proxmox-vars.yml
  vars:
    num_master_nodes: 3
    num_worker_nodes: 3
    public_key: "{{ lookup('file', 'keys/vm_node.pub') }}"
    # vmids 9101-9103 (masters) and 9111-9113 (workers) -- disjoint from test-cluster's 9001+
    # and rotate-master-nodes' 9201+. destroy.yml must carry the same offset.
    pve_vmid_offset: 100
    snippet_prefix: molecule-scale-cluster

  tasks:
    - name: Build the nodes on Proxmox
      ansible.builtin.import_tasks: ../common/proxmox-provision.yml

    # The subset the first converge builds a cluster from. The remaining nodes exist but are not
    # in this file, so nothing touches them until a side effect converges one of the inventories
    # below.
    - name: Store default inventory
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../common/hosts.yaml.j2"
        dest: "./inventory/hosts.yaml"
        mode: "0644"
      vars:
        inv_masters: "{{ master_nodes_list[:1] }}"
        inv_workers: "{{ worker_nodes_list[:2] }}"

    - name: Store scale up control plane inventory
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../common/hosts.yaml.j2"
        dest: "./inventory/scale-up-ctrp.yaml"
        mode: "0644"
      vars:
        inv_masters: "{{ master_nodes_list }}"
        inv_workers: "{{ worker_nodes_list[:2] }}"

    - name: Store inventory (for scale up worker node)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../common/hosts.yaml.j2"
        dest: "./inventory/scale-up-worker.yaml"
        mode: "0644"
      vars:
        inv_masters: "{{ master_nodes_list }}"
        inv_workers: "{{ worker_nodes_list }}"

    - name: Store inventory (for scale down worker node)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../common/hosts.yaml.j2"
        dest: "./inventory/scale-down-worker.yaml"
        mode: "0644"
      vars:
        inv_masters: "{{ master_nodes_list }}"
        inv_workers: "{{ worker_nodes_list[:1] }}"

    - name: Store inventory (for scale down control plane node)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../common/hosts.yaml.j2"
        dest: "./inventory/scale-down-ctrp.yaml"
        mode: "0644"
      vars:
        inv_masters: "{{ master_nodes_list[:1] }}"
        inv_workers: "{{ worker_nodes_list }}"

    # Only the first master exists as an apiserver at this point -- inventory/hosts.yaml above
    # converges master_nodes_list[:1]. Pointing the record at all three pre-satisfied the
    # scenario's own assertion: converge ran against two dead A records, and a scale-up that
    # never touched DNS still looked correct (#464). sync.yaml's update-dns-records task is what
    # has to move the record when add_control_plane runs.
    - name: Create the DNS domain and ctrp record
      ansible.builtin.import_tasks: ../common/autoglue-create.yml
      vars:
        autoglue_record_values: >-
          {{ master_nodes_list[:1] | map(attribute='name') | map('extract', node_lan_addresses) | list }}

    # proxmox-provision.yml already waits for the guest agent and for SSH, so the nodes are up by
    # here. This is the tail of cloud-init: package_upgrade is still running when SSH opens, and
    # converging into it means fighting the apt lock.
    - name: Wait for 60 seconds to let cloud-init finish
      ansible.builtin.pause:
        seconds: 60
