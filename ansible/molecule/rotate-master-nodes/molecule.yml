---
# NO `platforms:` block, deliberately -- see test-cluster and scale-cluster, which never had one.
# With driver `default` the hosts come from inventory/hosts.yaml, which create.yml writes; molecule
# nonetheless merges any platform names into the inventory it generates, so a leftover placeholder
# entry becomes a real host with no address. It stays invisible until a play targets `all` --
# playbooks/preflight.yaml (#466) does -- and then converge dies with
# "Could not resolve hostname instance-1".
driver:
  name: default

provisioner:
  name: ansible
  inventory:
    links:
      hosts: inventory/hosts.yaml
      group_vars: inventory/group_vars
  playbooks:
    side_effect: side_effect/default.yaml
    

scenario:
  name: rotate-master-nodes
  test_sequence:
    - create
    - converge
    - side_effect tests/test_cluster_healthy.yaml
    - side_effect side_effect/rotate_master_nodes.yaml
    - side_effect tests/test_cluster_healthy.yaml
    - side_effect side_effect/second_rotate_master_nodes.yaml
    - side_effect tests/test_cluster_healthy.yaml
    - verify
    - destroy

verifier:
  name: ansible