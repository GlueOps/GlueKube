---
# Builds the nodes rotate-master-nodes rotates through, on Proxmox VE.
#
# The provisioning is shared -- see ../common/proxmox-provision.yml. What is specific here is the
# node count and the three inventories: the scenario replaces the control plane twice, so nine
# masters are built up front and each rotation converges a different window of them.
#
#   inventory/hosts.yaml                      masters 1-3, the cluster converge starts from
#   inventory/rotate-master-nodes.yaml        masters 1-6, the first rotation's before+after
#   inventory/second-rotate-master-nodes.yaml masters 4-9, the second rotation's
#
# NOTE ON SIZE: nine masters plus a worker is ten VMs at PROXMOX_CORES/PROXMOX_MEMORY each --
# 40 vCPU and 80G of RAM at the defaults. That was cheap on Hetzner, where the nodes were rented
# per-hour; on a single PVE host it is not. Set PROXMOX_CORES / PROXMOX_MEMORY down for this
# scenario if the host cannot seat it.
- name: Create Proxmox VMs
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../common/proxmox-vars.yml
  vars:
    num_master_nodes: 9
    num_worker_nodes: 1
    public_key: "{{ lookup('file', 'keys/vm_node.pub') }}"
    # vmids 9201-9209 (masters) and 9211 (worker) -- disjoint from test-cluster's 9001+ and
    # scale-cluster's 9101+. destroy.yml must carry the same offset.
    pve_vmid_offset: 200
    snippet_prefix: molecule-rotate-master-nodes

  tasks:
    - name: Build the nodes on Proxmox
      ansible.builtin.import_tasks: ../common/proxmox-provision.yml

    - name: Store default inventory
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../common/hosts.yaml.j2"
        dest: "./inventory/hosts.yaml"
        mode: "0644"
      vars:
        inv_masters: "{{ master_nodes_list[:3] }}"
        inv_workers: "{{ worker_nodes_list }}"

    - name: Store inventory (for rotating the master nodes)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../common/hosts.yaml.j2"
        dest: "./inventory/rotate-master-nodes.yaml"
        mode: "0644"
      vars:
        inv_masters: "{{ master_nodes_list[:6] }}"
        inv_workers: "{{ worker_nodes_list }}"

    - name: Store inventory (for verifying the rotated nodes work)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../common/hosts.yaml.j2"
        dest: "./inventory/second-rotate-master-nodes.yaml"
        mode: "0644"
      vars:
        inv_masters: "{{ master_nodes_list[3:9] }}"
        inv_workers: "{{ worker_nodes_list }}"

    - name: Create the DNS domain and ctrp record
      ansible.builtin.import_tasks: ../common/autoglue-create.yml
      vars:
        # The three masters the scenario starts with, on the LAN.
        autoglue_record_values: >-
          {{ master_nodes_list[:3] | map(attribute='name') | map('extract', node_lan_addresses) | list }}

    # proxmox-provision.yml already waits for the guest agent and for SSH, so the nodes are up by
    # here. This is the tail of cloud-init: package_upgrade is still running when SSH opens, and
    # converging into it means fighting the apt lock.
    - name: Wait for 60 seconds to let cloud-init finish
      ansible.builtin.pause:
        seconds: 60
