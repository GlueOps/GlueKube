---
# After upgrade-cluster.yaml -e upgrade_workers=false: the apiserver and every master are on the
# new version, and the existing worker still runs the old kubelet -- the worker play was skipped.
- name: Verify only the control plane was upgraded
  hosts: masters[0]
  become: true
  gather_facts: false
  tasks:
    - name: Read the apiserver version
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl version -o json | jq -r '.serverVersion.gitVersion'
      register: server_version
      changed_when: false

    - name: Read every node's kubelet version
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name} {.status.nodeInfo.kubeletVersion}{"\n"}{end}'
      register: node_versions
      changed_when: false

    - name: The apiserver runs the new version
      ansible.builtin.assert:
        that: server_version.stdout == upgrade_to_kubernetes_version
        fail_msg: "apiserver is {{ server_version.stdout }}, expected {{ upgrade_to_kubernetes_version }}"
        quiet: true

    - name: Every master runs the new kubelet
      ansible.builtin.assert:
        that: kubelet_versions[item] | default('missing') == upgrade_to_kubernetes_version
        fail_msg: >-
          {{ item }} runs kubelet {{ kubelet_versions[item] | default('missing') }}, expected
          {{ upgrade_to_kubernetes_version }}
        quiet: true
      loop: "{{ groups['masters'] }}"

    - name: The existing worker kept the old kubelet
      ansible.builtin.assert:
        that: kubelet_versions[old_worker] | default('missing') == upgrade_from_kubernetes_version
        fail_msg: >-
          {{ old_worker }} runs kubelet {{ kubelet_versions[old_worker] | default('missing') }},
          expected {{ upgrade_from_kubernetes_version }}: upgrade_workers=false should leave the
          workers alone
        quiet: true
  vars:
    old_worker: worker-node-1
    kubelet_versions: "{{ dict(node_versions.stdout_lines | map('split')) }}"
