---
# Molecule runs this; the bastion runs side_effect/add_worker_node.yaml.
#
# The cluster nodes have no address molecule can reach, so every step that touches them is a
# thin play against the bastion that shells out to ansible-playbook there.
- name: Join the new worker from the bastion
  hosts: bastion
  gather_facts: false
  vars_files:
    - ../../common/bastion-vars.yml
    - ../versions.yml
  tasks:
    - name: Run side_effect/add_worker_node.yaml on the bastion
      ansible.builtin.include_tasks: ../../common/bastion-run.yml
      vars:
        bastion_run_name: add_worker_node
        bastion_run_playbook: side_effect/add_worker_node.yaml
        bastion_run_timeout: 3600
