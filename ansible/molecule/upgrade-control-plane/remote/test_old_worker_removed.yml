---
# Molecule runs this; the bastion runs tests/test_old_worker_removed.yaml.
#
# The cluster nodes have no address molecule can reach, so every step that touches them is a
# thin play against the bastion that shells out to ansible-playbook there.
- name: Check the old worker is gone from the bastion
  hosts: bastion
  gather_facts: false
  vars_files:
    - ../../common/bastion-vars.yml
    - ../versions.yml
  tasks:
    - name: Run tests/test_old_worker_removed.yaml on the bastion
      ansible.builtin.include_tasks: ../../common/bastion-run.yml
      vars:
        bastion_run_name: test_old_worker_removed
        bastion_run_playbook: tests/test_old_worker_removed.yaml
        bastion_run_extra_args: "{{ upgrade_test_extra_args }}"
        bastion_run_timeout: 900
