---
driver:
  name: default

provisioner:
  name: ansible
  log: true
  inventory:
    links:
      # The BASTION, not the cluster. create.yml writes this file with the one host molecule can
      # reach; the cluster inventory is written onto the bastion and never exists locally.
      hosts: inventory/hosts.yaml
      # Still the cluster's group_vars: the remote runs read them from the shipped tree, and
      # against this bastion-only inventory they are inert.
      group_vars: inventory/group_vars
  playbooks:
    side_effect: side_effect/default.yaml


scenario:
  name: upgrade-control-plane
  # `make upgrade-control-plane` end to end: build at the previous minor, upgrade the masters
  # only, then join a new worker through `sync`. Every step past `create` runs on the
  # bastion -- see the wrappers in remote/, and converge.yml and verify.yml.
  test_sequence:
    - create
    - side_effect remote/test_nodes_pingable.yml
    # setup-cluster.yaml at upgrade_from_kubernetes_version (versions.yml).
    - converge
    - side_effect remote/test_cluster_healthy.yml
    - side_effect remote/upgrade_control_plane.yml
    # Masters on the new version, the existing worker still on the old one.
    - side_effect remote/test_control_plane_upgraded.yml
    - side_effect remote/add_worker_node.yml
    # The worker joined after the upgrade comes up on the new version.
    - side_effect remote/test_new_worker_version.yml
    - verify
    - destroy

verifier:
  name: ansible
