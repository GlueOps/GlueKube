# this should upgrade all the cluster component like: kubelet, kube-proxy, coredns, etcd(with cert rotation)
---
# The version floor and the kubernetes_version/kubernetes_package_version cross-check matter most
# here: an upgrade is exactly where those two drift apart (#466).
- name: Preflight
  ansible.builtin.import_playbook: preflight.yaml

- name: Elect the orchestrator
  ansible.builtin.import_playbook: elect-orchestrator.yaml

- name: Upgrade the orchestrator control-plane node first
  hosts: orchestrator
  become: true
  tasks:
    - name: Upgrade kubeadm on the orchestrator
      ansible.builtin.include_role:
        name: common
        tasks_from: upgrade-kubeadm.yaml

    - name: Run kubeadm upgrade apply on the orchestrator
      ansible.builtin.include_role:
        name: master
        tasks_from: first-node-upgrade.yaml
      tags: upgrade

    - name: Upgrade kubelet and kubectl on the orchestrator
      ansible.builtin.include_role:
        name: common
        tasks_from: upgrade-kubelet.yaml

    # After `kubeadm upgrade apply`, which carries the existing kube-proxy ConfigMap forward
    # unchanged.
    - name: Stop kube-proxy from resetting nf_conntrack_max
      ansible.builtin.include_role:
        name: master
        tasks_from: configure-kube-proxy.yaml


- name: Upgrade Master Nodes Sequentially
  hosts: masters
  become: true
  serial: 1
  tasks:
    - name: Select the orchestrator node
      ansible.builtin.include_role:
        name: master
        tasks_from: select-orchestrator.yaml

    - name: Upgrade kubeadm on this control-plane node
      ansible.builtin.include_role:
        name: common
        tasks_from: upgrade-kubeadm.yaml
      when: inventory_hostname != orchestrator_node

    - name: Upgrade Master Nodes
      ansible.builtin.include_role:
        name: master
        tasks_from: upgrade.yaml
      tags: upgrade
      when: inventory_hostname != orchestrator_node
      
    # Before the drain: a node whose containerd/Docker no longer match their pins is drained for
    # the runtime move even if nothing else on it changes (the orchestrator, whose kubelet moved
    # in the play above).
    - name: Compare the container runtime with its pins
      ansible.builtin.include_role:
        name: common
        tasks_from: check-container-runtime.yaml

    - name: "Drain '{{ inventory_hostname }}' from the master"
      delegate_to: "{{ orchestrator_node }}"
      become: true
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl --server https://127.0.0.1:6443 --request-timeout=30s cordon {{ inventory_hostname }}
        kubectl --server https://127.0.0.1:6443 --request-timeout=30s drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data
          
      register: drain_result
      retries: 5
      delay: 10
      until: drain_result.rc == 0
      changed_when: "'drained' in drain_result.stdout"
      when: inventory_hostname != orchestrator_node or common_container_runtime_drift | bool
    
    - name: "Perform maintenance on '{{ inventory_hostname }}'"
      ansible.builtin.debug:
        msg: "Node {{ inventory_hostname }} is drained. Performing maintenance now."

    # Every node, not only drifted ones: this also holds the packages on nodes built before they
    # were held. Where nothing differs, apt changes nothing and the runtime is not restarted.
    - name: Move containerd and Docker onto their pins
      ansible.builtin.include_role:
        name: common
        tasks_from: upgrade-container-runtime.yaml

    # The same modules and sysctls new nodes get from prepare-node.yaml, so a change to them
    # reaches nodes that already exist.
    - name: Apply the node kernel tuning
      ansible.builtin.include_role:
        name: common
        tasks_from: kernel-tuning.yaml

    - name: Upgrade kubelet and kubectl on this control-plane node
      ansible.builtin.include_role:
        name: common
        tasks_from: upgrade-kubelet.yaml
      when: inventory_hostname != orchestrator_node

    # The kubelet restart above recreates this node's static pods. Wait for its own apiserver (not
    # the ctrp record, which a sibling would answer) before uncordoning, so the next serial batch
    # never takes a second control plane down while this one is still coming back.
    - name: Wait for the apiserver on '{{ inventory_hostname }}' to become ready
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl --server https://127.0.0.1:6443 --request-timeout=10s get --raw='/readyz'
      register: upgraded_apiserver_ready
      retries: 18
      delay: 10
      until: upgraded_apiserver_ready.rc == 0 and ('ok' in upgraded_apiserver_ready.stdout)
      changed_when: false
      when: inventory_hostname != orchestrator_node or common_container_runtime_drift | bool
    
    - name: "Uncordon '{{ inventory_hostname }}' from the master"
      delegate_to: "{{ orchestrator_node }}"
      become: true
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl --server https://127.0.0.1:6443 --request-timeout=30s uncordon {{ inventory_hostname }}
      register: uncordon_result
      retries: 5
      delay: 10
      until: uncordon_result.rc == 0
      changed_when: "'uncordoned' in uncordon_result.stdout"
      when: inventory_hostname != orchestrator_node or common_container_runtime_drift | bool

    - name: "Pause for 60 seconds to allow pods to reschedule"
      ansible.builtin.pause:
        seconds: 60
        prompt: "Node {{ inventory_hostname }} is back online. Pausing before starting with the next node."



- name: Upgrade Worker Nodes Sequentially
  # upgrade_workers=false (make upgrade-control-plane): match no hosts, so this play gathers nothing
  # and runs nothing -- the workers stay on their current kubelet and are replaced through
  # `make sync` instead. Gated here rather than by a skip task so --tags can't bypass it and no
  # worker is connected to at all.
  hosts: "{{ 'workers' if (upgrade_workers | default(true) | bool) else 'workers:!workers' }}"
  become: true
  serial: 1
  tasks:
    - name: Select the orchestrator node
      ansible.builtin.include_role:
        name: master
        tasks_from: select-orchestrator.yaml

    - name: Upgrade kubeadm on this worker
      ansible.builtin.include_role:
        name: common
        tasks_from: upgrade-kubeadm.yaml
      
    - name: Upgrade Worker Nodes
      ansible.builtin.include_role:
        name: worker
        tasks_from: upgrade.yaml
      tags: upgrade

    # Reported only: workers are drained regardless, so the move below always runs drained.
    - name: Compare the container runtime with its pins
      ansible.builtin.include_role:
        name: common
        tasks_from: check-container-runtime.yaml

    - name: "Drain '{{ inventory_hostname }}' from the master"
      delegate_to: "{{ orchestrator_node }}"
      become: true
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl --server https://127.0.0.1:6443 --request-timeout=30s cordon {{ inventory_hostname }}
        kubectl --server https://127.0.0.1:6443 --request-timeout=30s drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data
          
      register: drain_result
      retries: 5
      delay: 10
      until: drain_result.rc == 0
      changed_when: "'drained' in drain_result.stdout"
    
    - name: "Perform maintenance on '{{ inventory_hostname }}'"
      ansible.builtin.debug:
        msg: "Node {{ inventory_hostname }} is drained. Performing maintenance now."

    # Every node, not only drifted ones: this also holds the packages on nodes built before they
    # were held. Where nothing differs, apt changes nothing and the runtime is not restarted.
    - name: Move containerd and Docker onto their pins
      ansible.builtin.include_role:
        name: common
        tasks_from: upgrade-container-runtime.yaml

    # The same modules and sysctls new nodes get from prepare-node.yaml, so a change to them
    # reaches nodes that already exist.
    - name: Apply the node kernel tuning
      ansible.builtin.include_role:
        name: common
        tasks_from: kernel-tuning.yaml

    - name: Upgrade kubelet and kubectl on this worker
      ansible.builtin.include_role:
        name: common
        tasks_from: upgrade-kubelet.yaml
        apply:
          tags:
          - kubernetes_component

    - name: "Uncordon '{{ inventory_hostname }}' from the master"
      delegate_to: "{{ orchestrator_node }}"
      become: true
      ansible.builtin.shell: |
        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl --server https://127.0.0.1:6443 --request-timeout=30s uncordon {{ inventory_hostname }}
      register: uncordon_result
      retries: 5
      delay: 10
      until: uncordon_result.rc == 0
      changed_when: "'uncordoned' in uncordon_result.stdout"

    - name: "Pause for 60 seconds to allow pods to reschedule"
      ansible.builtin.pause:
        seconds: 60
        prompt: "Node {{ inventory_hostname }} is back online. Pausing before starting with the next node."


